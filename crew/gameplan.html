<body>
<div id="gate"><form class="gate-card" onsubmit="login(event)"><div class="gate-mark">EGC</div><h1>Crew sign-in</h1><p>Use your employee portal login.</p><label for="user">Username</label><input id="user" autocomplete="username"><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password"><button>Unlock walkthrough</button><div class="gate-error" id="gate-error">Incorrect username or password.</div></form></div>
<div id="app">
  <header class="top"><div class="top-row"><div class="brand">EGC</div><div class="top-copy"><strong>Walkthrough</strong><span id="customer-label">New customer</span></div><div class="top-status"><i></i><span id="save-label">Saved on this device</span></div><button class="lock" onclick="logout()">Lock</button></div><nav class="steps" id="steps"></nav></header>
  <main id="screen"></main>
  <footer class="bottom"><div class="bottom-in"><button class="back" id="back" onclick="move(-1)">Back</button><button class="next" id="next" onclick="move(1)">Continue</button></div></footer>
</div>
<div id="viewer" onclick="this.classList.remove('on')"><button aria-label="Close">×</button><img id="viewer-img" alt="Walkthrough photo"></div>
<script>
const USERS={ZacB:'6b8670f397174ff99440629b877581216a0b26b6770054be198988ff48a16861',TylerG:'28b50fd5ee98af8cf015972811def03dbc2eaff52997f82ecfc4342ece6cfa36',AlexK:'52e2e9901adc10406ad9597084ece4770d1c9fd0e3b76e1f31abf35f8030ac50',JobberCrew:'a68121119b6a72c583c366a62257cbb3652867e9b50e46bdda6fb05280dee683'};
const SALT='egc-salt-2026',SAVE='egc_walkthrough_v3',FLOW='2026-09-simple';
const sections=['Customer','Photos','Scope','Finish','Schedule','Review'];
let index=0,error='',LOOK=[],APPTS=[],PHOTO_COUNT=0,sigCtx=null,draw=false;
const S={name:'',phone:'',email:'',address:'',highlevelContactId:'',highlevelAppointmentId:'',highlevelJobAppointmentId:'',source:'',whyNow:'',outcome:'',garageSize:'2',fill:'',loads:'',sortMethod:'',keepNotes:'',removeNotes:'',valuables:'',special:[],hazards:[],access:[],accessNotes:'',truckPlacement:'',finish:['cleanout'],shelfType:'metal',shelfQty:0,toteQty:0,jobDate:'',startTime:'',endTime:'',crewSize:'2',assignedTo:'',notes:'',lockedPrice:'',approved:false,signature:'',jobId:''};
const $=id=>document.getElementById(id),esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'$'+Number(v||0).toLocaleString('en-US',{maximumFractionDigits:0});
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
const normPhone=raw=>{const d=String(raw||'').replace(/\D/g,'');return d.length===10?'+1'+d:d.length===11&&d[0]==='1'?'+'.concat(d):d};
async function sha(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function token(u){return sha(u+':'+USERS[u]+':egc-session')}
async function validSession(){const u=sessionStorage.getItem('egc_u')||localStorage.getItem('egc_u'),t=sessionStorage.getItem('egc_tok')||localStorage.getItem('egc_tok');return Boolean(u&&USERS[u]&&t===await token(u))}
async function login(e){e.preventDefault();const u=$('user').value.trim(),p=$('pass').value;if(USERS[u]&&await sha(u+':'+p+':'+SALT)===USERS[u]){sessionStorage.setItem('egc_u',u);sessionStorage.setItem('egc_tok',await token(u));openApp()}else $('gate-error').style.display='block'}
function logout(){sessionStorage.removeItem('egc_u');sessionStorage.removeItem('egc_tok');localStorage.removeItem('egc_u');localStorage.removeItem('egc_tok');location.reload()}
let hubDb=null;
try{if(window.firebase){if(!firebase.apps.length)firebase.initializeApp({apiKey:'AIzaSyA8g4UAW4P4bsCrQNZhUe81CbC7BvjJbNc',authDomain:'egcw-1ec83.firebaseapp.com',projectId:'egcw-1ec83',storageBucket:'egcw-1ec83.firebasestorage.app',messagingSenderId:'763340109795',appId:'1:763340109795:web:ac203b3eb71831fa4ed2d6'});hubDb=firebase.firestore()}}catch(e){}
function openApp(){$('gate').style.display='none';$('app').style.display='block';restore();render();refreshPhotoCount();loadAppointments()}
function save(){try{localStorage.setItem(SAVE,JSON.stringify({flow:FLOW,index,S}));$('save-label').textContent='Saved on this device'}catch(e){$('save-label').textContent='Device storage blocked'}}
function restore(){try{const d=JSON.parse(localStorage.getItem(SAVE)||'null');if(d&&d.flow===FLOW){Object.assign(S,d.S||{});index=Math.min(sections.length-1,Number(d.index||0))}}catch(e){}}
function pick(key,value,multi=false){if(multi)S[key]=S[key].includes(value)?S[key].filter(x=>x!==value):[...S[key],value];else S[key]=value;if(key==='garageSize'&&!S.loads)S.loads={1:'1',2:'1.5',3:'2',other:'2.5'}[value];save();render()}
const choice=(key,value,label,sub='',multi=false)=>{const selected=multi?S[key].includes(value):S[key]===value;return`<button type="button" class="choice ${selected?'on':''}" onclick="pick('${key}','${value}',${multi})">${label}${sub?`<span>${sub}</span>`:''}</button>`};
function title(k,h,p){return`<div class="screen-head"><div><div class="eyebrow">${k}</div><h1>${h}</h1><p>${p}</p></div><div class="autosave">Changes save automatically</div></div>`}
function input(label,key,type='text',placeholder='',extra=''){return`<div><label class="label" for="f-${key}">${label}</label><input class="field" id="f-${key}" type="${type}" value="${esc(S[key])}" placeholder="${esc(placeholder)}" oninput="S.${key}=this.value;save()" ${extra}></div>`}
function area(label,key,placeholder=''){return`<div><label class="label" for="f-${key}">${label}</label><textarea class="field" id="f-${key}" placeholder="${esc(placeholder)}" oninput="S.${key}=this.value;save()">${esc(S[key])}</textarea></div>`}

const screens=[
()=>title('Start','Customer and goal','Confirm who you are meeting and what they want the garage to do for them.')+`<section class="panel"><h2>Today’s Hub walkthroughs</h2><p>Tap one to fill the customer details.</p><div class="appointment-list" id="appointments">${APPTS.length?APPTS.map((a,i)=>`<button type="button" class="appointment" onclick="useAppointment(${i})"><time>${esc(a.time||'Today')}</time><div><strong>${esc(a.customer||a.name||a.title||'Walkthrough')}</strong><small>${esc(a.address||a.phone||'')}</small></div></button>`).join(''):'<div class="note">No walkthrough is scheduled in the Hub today. Manual entry still works.</div>'}</div><label class="label">Search HighLevel CRM</label><div class="inline-search"><input class="field" id="contact-search" value="${esc(S.name)}" placeholder="Customer name or phone"><button type="button" class="small-btn" onclick="searchContacts()">Search</button></div><div class="lookup-results" id="lookup-results"></div></section><section class="panel"><div class="grid2">${input('Customer name','name','text','Full name')}${input('Mobile','phone','tel','(970) 555-0123')}${input('Email','email','email','name@email.com')}${input('Address','address','text','Street address')}<div><label class="label">Source</label><select class="field" onchange="S.source=this.value;save()"><option value="">Select</option>${['Google','Facebook / Instagram','Referral','Repeat customer','Truck / yard sign','Other'].map(x=>`<option ${S.source===x?'selected':''}>${x}</option>`).join('')}</select></div></div>${area('Why now?','whyNow','What changed or made this urgent?')}${area('What should be different when we leave?','outcome','Use the customer’s words.')}</section>`,
()=>title('Document','Photograph the garage','Take enough photos to price and hand the job off without another explanation.')+`<section class="panel"><div class="photo-drop"><input type="file" accept="image/*" capture="environment" multiple onchange="addPhotos(this)"><div><div class="camera">＋</div><strong>Take or add photos</strong><span>Doorway wide shot, both sides, and the worst area</span></div></div><div class="photos" id="photos"></div><div class="photo-count ${PHOTO_COUNT>=3?'good':''}" id="photo-count">${PHOTO_COUNT} photo${PHOTO_COUNT===1?'':'s'} saved · ${PHOTO_COUNT>=3?'Enough to continue':'Take at least 3'}</div></section><section class="panel"><h2>Quick size check</h2><p>This supports the background estimate. No dimensions or diagram needed.</p><label class="label">Garage size</label><div class="choices cols4">${choice('garageSize','1','1-car')+choice('garageSize','2','2-car')+choice('garageSize','3','3-car')+choice('garageSize','other','Larger')}</div><label class="label">How full is it?</label><div class="choices cols4">${choice('fill','light','Light','Floor mostly open')+choice('fill','medium','Medium','Walkways remain')+choice('fill','full','Full','Little open floor')+choice('fill','packed','Packed','Stacked / no paths')}</div></section>`,
()=>title('Scope','What stays, what leaves, and what could slow the job','Record only what the crew needs to execute safely and correctly.')+`<section class="panel"><h2>Sorting plan</h2><label class="label">How will keep/remove decisions happen?</label><div class="choices cols2">${choice('sortMethod','customer','Customer sorts with crew')+choice('sortMethod','labels','Customer labels before arrival')+choice('sortMethod','zones','Crew stages keep / donate / haul zones')+choice('sortMethod','remove_all','Everything goes')}</div><div class="grid2">${area('Important keep items','keepNotes','Valuables, heirlooms, or anything the crew must protect')}${area('Remove / donate notes','removeNotes','Donation preferences or items that need confirmation')}${area('Known valuables','valuables','Tools, documents, family items, or “ask before touching”')}</div></section><section class="panel"><h2>Special handling</h2><div class="check-grid">${['Mattress','Refrigerator / freezer','Tires','Paint / chemicals','Electronics','Appliances','Piano / safe','Very heavy items'].map(x=>choice('special',x,x,'',true).replace('choice ','check ')).join('')}</div><label class="label">Hazards seen</label><div class="check-grid">${['Mold / moisture','Pest waste','Unstable stacks','Blocked panel / heater','Sharp material','No visible hazards'].map(x=>choice('hazards',x,x,'',true).replace('choice ','check ')).join('')}</div></section><section class="panel"><h2>Access</h2><div class="check-grid">${['Long carry','Stairs','Narrow gate / alley','HOA / access restriction','Trailer can park at garage','Customer will not be home'].map(x=>choice('access',x,x,'',true).replace('choice ','check ')).join('')}</div><div class="grid2">${input('Estimated truckloads','loads','number','1.5','min="0.5" step="0.5"')}${input('Truck placement / carry distance','truckPlacement','text','Driveway, curb, alley…')}${area('Access notes','accessNotes','Codes, pets, clearance, parking limits…')}</div></section>`,
()=>title('Finish','Choose the finished result','Use the photos to show the difference, then select only what the customer wants included. The estimate updates in the background.')+`<div class="before-after"><figure><img src="/images/garage-before.jpg" alt="Garage before an EGC transformation"><figcaption>BEFORE</figcaption></figure><figure><img src="/images/garage-after.jpg" alt="Garage after an EGC transformation"><figcaption>AFTER</figcaption></figure></div><section class="panel"><h2>Work to include</h2><p>Cleanout, basic organization with what they own, and a sweep are the baseline.</p><div class="service-grid"><button type="button" class="service on" disabled><img src="/images/job-before-after-1.jpg" alt="Garage cleanout"><div><strong>Cleanout + reset</strong><span>Sort, haul, donate, organize what stays, sweep</span></div></button><button type="button" class="service ${S.finish.includes('deep_clean')?'on':''}" onclick="pick('finish','deep_clean',true)"><img src="/images/upsell-deepclean.jpg" alt="Deep garage cleaning"><div><strong>Deep clean</strong><span>Degrease, dust, ledges, and detailed floor clean</span></div></button><button type="button" class="service ${S.finish.includes('shelving')?'on':''}" onclick="pick('finish','shelving',true)"><img src="/images/shelf-metal.png" alt="Installed garage shelving"><div><strong>Add shelving</strong><span>Installed and loaded as part of the reset</span></div></button><button type="button" class="service ${S.finish.includes('totes')?'on':''}" onclick="pick('finish','totes',true)"><img src="/images/upsell-totes.jpg" alt="Garage storage totes"><div><strong>Add labeled totes</strong><span>27-gallon totes grouped by zone</span></div></button></div>${S.finish.includes('shelving')?`<div class="conditional"><label class="label">Shelving type</label><div class="choices cols2">${choice('shelfType','metal','Metal')+choice('shelfType','wood','Wood + metal')+choice('shelfType','plastic','Plastic')}</div><label class="label">How many shelving units?</label><div class="qty-row"><button type="button" onclick="qty('shelfQty',-1)">−</button><strong>${S.shelfQty}</strong><button type="button" onclick="qty('shelfQty',1)">+</button></div></div>`:''}${S.finish.includes('totes')?`<div class="conditional"><label class="label">How many totes?</label><div class="qty-row"><button type="button" onclick="qty('toteQty',-1)">−</button><strong>${S.toteQty}</strong><button type="button" onclick="qty('toteQty',1)">+</button></div></div>`:''}</section>`,
()=>title('Schedule','Put the job on the EGC schedule','The Hub owns this date and crew assignment. HighLevel receives the appointment and starts the customer communication workflow.')+`<section class="panel"><div class="grid3">${input('Job date','jobDate','date')}${input('Arrival start','startTime','time')}${input('Arrival end','endTime','time')}${input('Assigned crew / lead','assignedTo','text','Zac + Tyler')}<div><label class="label">Crew size</label><select class="field" onchange="S.crewSize=this.value;save()">${['1','2','3','4'].map(x=>`<option ${S.crewSize===x?'selected':''}>${x}</option>`).join('')}</select></div></div>${area('Final job notes','notes','Anything the crew must know before arrival')}</section><section class="panel"><h2>Confirm the handoff aloud</h2><p>Repeat back what stays, what leaves, the finished result, the arrival window, and the rule that nothing leaves without approval.</p></section>`,
()=>title('Review','Confirm the scope and save it','The recommended flat rate was calculated from the scope. Review it, adjust only if needed, and get approval.')+reviewScreen()
];

function reviewScreen(){const price=recommend();if(!S.lockedPrice)S.lockedPrice=String(price);const finish=['Cleanout + reset',S.finish.includes('deep_clean')?'Deep clean':'',S.finish.includes('shelving')?`${S.shelfQty} ${S.shelfType} shelving unit${S.shelfQty===1?'':'s'}`:'',S.finish.includes('totes')?`${S.toteQty} labeled totes`:''].filter(Boolean).join(', ');return`<div class="review"><section class="panel summary"><div class="sum-row"><b>Customer</b><span>${esc(S.name)} · ${esc(S.address)}</span></div><div class="sum-row"><b>Goal</b><span>${esc(S.outcome)}</span></div><div class="sum-row"><b>Garage</b><span>${esc(S.garageSize)}-car · ${esc(S.fill)} · about ${esc(S.loads)} truckload(s) · ${PHOTO_COUNT} photos</span></div><div class="sum-row"><b>Sort</b><span>${esc(S.sortMethod.replaceAll('_',' '))}${S.keepNotes?' · '+esc(S.keepNotes):''}</span></div><div class="sum-row"><b>Special / hazards</b><span>${esc([...S.special,...S.hazards].join(', ')||'None recorded')}</span></div><div class="sum-row"><b>Finish</b><span>${esc(finish)}</span></div><div class="sum-row"><b>Schedule</b><span>${esc(S.jobDate)} · ${esc(S.startTime)}–${esc(S.endTime)} · ${esc(S.assignedTo||`crew of ${S.crewSize}`)}</span></div><div class="sum-row"><b>Notes</b><span>${esc(S.notes||'None')}</span></div><div class="approve"><input id="approved" type="checkbox" ${S.approved?'checked':''} onchange="S.approved=this.checked;save()"><label for="approved">The homeowner confirms the written scope, locked flat rate, and that only approved items will be removed.</label></div><label class="label">Homeowner signature</label><canvas class="signature" id="signature"></canvas><div class="sig-tools"><button type="button" onclick="clearSignature()">Clear signature</button></div></section><aside class="price-card"><div class="eyebrow">Recommended flat rate</div><div class="price">${money(price)}</div><p>The rate was built in the background from the documented work. Change it only when the real scope calls for it.</p><label class="label" for="locked-price">Final flat rate</label><input class="field" id="locked-price" type="number" inputmode="decimal" value="${esc(S.lockedPrice)}" oninput="S.lockedPrice=this.value;save()"><div class="send-grid"><button class="save-btn" onclick="sendHighLevel(this)">Save plan + schedule</button></div><div class="send-status" id="send-status">Saving will place the job in the Hub and trigger HighLevel confirmation workflows.</div></aside></div>`}
function qty(key,d){S[key]=Math.max(0,Number(S[key]||0)+d);save();render()}
function recommend(){const size={1:450,2:650,3:850,other:1100}[S.garageSize]||650,fill={light:.75,medium:1,full:1.35,packed:1.7}[S.fill]||1;let n=size*fill;const stated=Number(S.loads||0)*500;if(stated)n=Math.max(n,stated);n+=S.special.reduce((a,x)=>a+({'Mattress':45,'Refrigerator / freezer':60,'Tires':50,'Paint / chemicals':45,'Electronics':25,'Appliances':40,'Piano / safe':150,'Very heavy items':100}[x]||0),0);if(S.access.includes('Long carry'))n+=75;if(S.access.includes('Stairs'))n+=125;if(S.finish.includes('deep_clean'))n+=({1:125,2:220,3:320,other:420}[S.garageSize]||220);if(S.finish.includes('shelving'))n+=S.shelfQty*({metal:499,wood:449,plastic:349}[S.shelfType]||499);if(S.finish.includes('totes'))n+=S.toteQty*21.5;return Math.max(450,Math.round(n/25)*25)}

function validateStep(step=index){const miss=[];if(step===0){if(!S.name)miss.push('customer name');if(!S.phone)miss.push('mobile number');if(!S.whyNow)miss.push('why now');if(!S.outcome)miss.push('desired result')}if(step===1){if(PHOTO_COUNT<3)miss.push('at least 3 photos');if(!S.fill)miss.push('fullness')}if(step===2){if(!S.sortMethod)miss.push('sorting plan');if(!S.loads)miss.push('estimated truckloads');if(!S.truckPlacement)miss.push('truck placement')}if(step===4){if(!S.jobDate||!S.startTime||!S.endTime)miss.push('job date and arrival window')}return miss}
function validate(){return validateStep(index)}
function move(d){if(d>0){const m=validate();if(m.length){error='Add '+m.join(', ')+' before continuing.';render();return}}error='';index=Math.max(0,Math.min(sections.length-1,index+d));save();render();scrollTo({top:0,behavior:'smooth'})}
function jump(i){if(i<=index){index=i;error='';save();render()}}
function render(){$('steps').innerHTML=sections.map((x,i)=>`<button class="${i===index?'on':i<index?'done':''}" onclick="jump(${i})">${i<index?'✓ ':''}${x}</button>`).join('');$('screen').innerHTML=screens[index]()+ (error?`<div class="required">${esc(error)}</div>`:'');$('back').style.visibility=index?'visible':'hidden';$('next').style.display=index===sections.length-1?'none':'block';$('customer-label').textContent=S.name||'New customer';if(index===1)mountPhotos();if(index===5)setTimeout(initSignature)}

function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('egc_photos',1);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('p')){const st=db.createObjectStore('p',{keyPath:'id'});st.createIndex('job','job',{unique:false})}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function photoList(){if(!S.jobId)S.jobId=uid();const db=await dbOpen();return new Promise(res=>{const out=[],tx=db.transaction('p','readonly');tx.objectStore('p').index('job').openCursor(IDBKeyRange.only(S.jobId)).onsuccess=e=>{const c=e.target.result;if(c){if(c.value.tag==='before')out.push(c.value);c.continue()}else res(out.sort((a,b)=>a.at-b.at))}})}
async function fileData(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height,s=Math.min(1,1600/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',.82));URL.revokeObjectURL(img.src)};img.onerror=rej;img.src=URL.createObjectURL(file)})}
async function addPhotos(input){if(!S.jobId)S.jobId=uid();const db=await dbOpen();for(const f of Array.from(input.files||[])){const dataUrl=await fileData(f),tx=db.transaction('p','readwrite');tx.objectStore('p').put({id:uid(),job:S.jobId,tag:'before',dataUrl,at:Date.now()});await new Promise(res=>{tx.oncomplete=res;tx.onerror=res})}input.value='';await mountPhotos();save()}
async function removePhoto(id){const db=await dbOpen(),tx=db.transaction('p','readwrite');tx.objectStore('p').delete(id);await new Promise(res=>{tx.oncomplete=res;tx.onerror=res});mountPhotos()}
async function mountPhotos(){const el=$('photos');if(!el)return;const ps=await photoList();PHOTO_COUNT=ps.length;el.innerHTML=ps.map(p=>`<div class="photo"><img src="${p.dataUrl}" onclick="viewPhoto(this.src)"><button onclick="removePhoto('${p.id}')">×</button></div>`).join('');const c=$('photo-count');if(c){c.className='photo-count '+(PHOTO_COUNT>=3?'good':'');c.textContent=PHOTO_COUNT+' photo'+(PHOTO_COUNT===1?'':'s')+' saved · '+(PHOTO_COUNT>=3?'Enough to continue':'Take at least 3')}}
async function refreshPhotoCount(){try{PHOTO_COUNT=(await photoList()).length;if(index===1||index===5)render()}catch(e){}}
function viewPhoto(src){$('viewer-img').src=src;$('viewer').classList.add('on')}

async function loadAppointments(){try{if(hubDb){const today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Denver',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),snap=await hubDb.collection('jobs').where('date','==',today).get();APPTS=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.type==='walkthrough'&&x.status!=='cancelled').sort((a,b)=>String(a.time).localeCompare(String(b.time)))}}catch(e){}if(index===0)render()}
function useAppointment(i){const a=APPTS[i];if(!a)return;S.name=a.customer||a.name||S.name;S.phone=a.phone||S.phone;S.email=a.email||S.email;S.address=a.address||S.address;S.highlevelContactId=a.highlevelContactId||a.contactId||S.highlevelContactId;S.highlevelAppointmentId=a.highlevelAppointmentId||S.highlevelAppointmentId;save();render()}
async function searchContacts(){const q=$('contact-search').value.trim(),out=$('lookup-results');if(q.length<2){out.innerHTML='<div class="note">Type at least 2 characters.</div>';return}out.innerHTML='<div class="note">Searching HighLevel…</div>';try{const r=await fetch('/api/highlevel?view=contacts&q='+encodeURIComponent(q)),j=await r.json();if(!r.ok)throw 0;LOOK=j.contacts||[];out.innerHTML=LOOK.length?LOOK.map((c,i)=>`<button onclick="useContact(${i})"><strong>${esc(c.name)}</strong><small>${esc([c.phone,c.address].filter(Boolean).join(' · '))}</small></button>`).join(''):'<div class="note">No matching contact. Continue with manual entry.</div>'}catch(e){out.innerHTML='<div class="note">HighLevel is not connected. Continue with manual entry.</div>'}}
function useContact(i){const c=LOOK[i];if(!c)return;S.name=c.name||S.name;S.phone=c.phone||S.phone;S.email=c.email||S.email;S.address=c.address||S.address;S.highlevelContactId=c.id||S.highlevelContactId;save();render()}

function initSignature(){const c=$('signature');if(!c)return;const ratio=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*ratio;c.height=r.height*ratio;sigCtx=c.getContext('2d');sigCtx.scale(ratio,ratio);sigCtx.lineWidth=2.3;sigCtx.lineCap='round';sigCtx.strokeStyle='#172033';if(S.signature){const im=new Image();im.onload=()=>sigCtx.drawImage(im,0,0,r.width,r.height);im.src=S.signature}const pos=e=>{const q=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[p.clientX-q.left,p.clientY-q.top]};c.onpointerdown=e=>{draw=true;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(...p);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!draw)return;sigCtx.lineTo(...pos(e));sigCtx.stroke()};c.onpointerup=()=>{draw=false;S.signature=c.toDataURL('image/png');save()}}
function clearSignature(){S.signature='';render()}
function payload(){const total=Number(S.lockedPrice||recommend()),startAt=new Date(`${S.jobDate}T${S.startTime}`).toISOString(),endAt=new Date(`${S.jobDate}T${S.endTime}`).toISOString();return{tool:'game_plan',job_id:S.jobId||(S.jobId=uid()),sent_at:new Date().toISOString(),client:{name:S.name,phone:normPhone(S.phone),email:S.email,address:S.address,lead_source:S.source,highlevel_contact_id:S.highlevelContactId,highlevel_appointment_id:S.highlevelAppointmentId,highlevel_job_appointment_id:S.highlevelJobAppointmentId},quote:{title:'EGC Garage Service — '+(S.address||S.name),total,deposit:Math.round(total*.2),job_date:S.jobDate,start_time:S.startTime,end_time:S.endTime,start_at:startAt,end_at:endAt,line_items:[{name:'Garage cleanout and reset',qty:1,total}],line_items_count:1},discovery:{why_now:S.whyNow,success:S.outcome,lead_source:S.source},scope:{loads:S.loads,garages:S.garageSize,fullness:S.fill,keep_remove:[S.sortMethod,S.keepNotes,S.removeNotes].filter(Boolean).join(' · '),exclusions:S.valuables,hazards:S.hazards,truck_placement:S.truckPlacement,special_items:S.special,access:S.access,finish:S.finish},logistics:{truck_placement:S.truckPlacement,access:S.access,notes:S.accessNotes},signature:S.signature,terms_version:'2026-09-simple',terms_accepted:S.approved&&Boolean(S.signature),photos:{before:PHOTO_COUNT},notes:S.notes,raw:{...S,signature:S.signature?'[captured]':''}}}
function readyToSend(){const miss=[];for(let i=0;i<5;i++)validateStep(i).forEach(x=>{if(!miss.includes(x))miss.push(x)});if(!S.approved)miss.push('scope approval');if(!S.signature)miss.push('signature');if(!Number(S.lockedPrice))miss.push('locked price');return miss}
async function saveHubJob(){if(!hubDb)throw new Error('Hub database unavailable');const plan=payload(),total=Number(S.lockedPrice||recommend()),now=new Date().toISOString(),ref=hubDb.collection('jobs').doc(S.jobId),existing=await ref.get(),job={id:S.jobId,type:'job',serviceType:'Garage transformation',date:S.jobDate,time:S.startTime,endTime:S.endTime,durationMin:Math.max(60,(new Date(`${S.jobDate}T${S.endTime}`)-new Date(`${S.jobDate}T${S.startTime}`))/60000),customer:S.name,phone:normPhone(S.phone),email:S.email,address:S.address,assignedTo:S.assignedTo||`Crew of ${S.crewSize}`,crewSize:Number(S.crewSize),notes:S.notes,scope:plan.scope,walkthroughNotes:`${S.whyNow}\n${S.outcome}`,priceQuoted:total,total,status:'scheduled',pipelineStatus:'scheduled',scheduleSource:'egc_hub',syncStatus:'pending',highlevelContactId:S.highlevelContactId||'',highlevelAppointmentId:S.highlevelJobAppointmentId||'',walkthroughAppointmentId:S.highlevelAppointmentId||'',photoCount:PHOTO_COUNT,updatedAt:now};if(!existing.exists)job.createdAt=now;await ref.set(job,{merge:true});return job}
async function sendHighLevel(btn){const miss=readyToSend(),st=$('send-status');if(miss.length){st.textContent='Add '+miss.join(', ')+'.';return}btn.disabled=true;btn.textContent='Saving…';try{await saveHubJob();writeActive()}catch(e){btn.disabled=false;btn.textContent='Retry save';st.textContent='The Hub schedule could not save. Check the connection and try again.';return}try{const r=await fetch('/api/highlevel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.code||'sync failed');S.highlevelContactId=j.contactId||S.highlevelContactId;S.highlevelJobAppointmentId=j.appointmentId||S.highlevelJobAppointmentId;await hubDb.collection('jobs').doc(S.jobId).set({syncStatus:'synced',highlevelContactId:S.highlevelContactId,highlevelAppointmentId:S.highlevelJobAppointmentId,updatedAt:new Date().toISOString()},{merge:true});save();writeActive();btn.textContent='Saved ✓';st.textContent='Scheduled in the EGC Hub. HighLevel will run the customer communication workflow.'}catch(e){btn.disabled=false;btn.textContent='Retry HighLevel sync';st.textContent='Scheduled in the EGC Hub. HighLevel sync is pending until its API connection is ready.'}}
function writeActive(){const total=Number(S.lockedPrice||recommend());localStorage.setItem('egc_active_job',JSON.stringify({jobId:S.jobId,highlevelContactId:S.highlevelContactId,highlevelAppointmentId:S.highlevelJobAppointmentId,name:S.name,phone:S.phone,addr:S.address,pkg:S.finish.join(', '),total,rate:total,deposit:Math.round(total*.2),jobdate:S.jobDate,pain:S.whyNow,scope:payload().scope,photosBefore:PHOTO_COUNT,savedAt:new Date().toISOString()}))}
document.addEventListener('input',save);
(async()=>{if(await validSession())openApp()})();
</script>
