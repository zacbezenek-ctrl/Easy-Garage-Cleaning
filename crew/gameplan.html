<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>EGC · Garage Game Plan</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#13203a; --navy2:#1d2d4f; --orange:#e8581c; --orange2:#c4470f;
    --cream:#f2e9dc; --paper:#faf5ec; --khaki:#8a8170; --line:#d9cdb8;
    --ok:#2e7d4f; --r:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--navy);
       display:flex;flex-direction:column;overflow:hidden;position:fixed;width:100%}
  .disp{font-family:'Oswald','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.02em}

  /* ---------- top bar ---------- */
  #topbar{background:var(--navy);color:#fff;padding:max(env(safe-area-inset-top),10px) 20px 10px;flex-shrink:0}
  #topbar .row{display:flex;align-items:center;justify-content:space-between}
  #brand{font-family:'Oswald';font-weight:700;font-size:15px;letter-spacing:.06em}
  #brand span{color:var(--orange)}
  #zonechip{font-family:'Oswald';font-weight:600;font-size:12px;letter-spacing:.08em;
            background:var(--orange);padding:3px 10px;border-radius:99px}
  #runtotal{font-family:'Oswald';font-weight:700;font-size:16px;color:#fff;display:none}
  #rail{display:flex;gap:4px;margin-top:9px}
  #rail i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
  #rail i.zA.done{background:var(--orange)} #rail i.zB.done{background:#f0a25c} #rail i.zC.done{background:#fff}
  #rail i.cur{outline:2px solid var(--orange);outline-offset:1px}

  /* ---------- stage ---------- */
  #stage{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 22px 30px}
  .screen{max-width:760px;margin:0 auto}
  .eyebrow{font-family:'Oswald';font-weight:600;font-size:13px;letter-spacing:.12em;color:var(--orange);text-transform:uppercase}
  h1{font-family:'Oswald';font-weight:700;font-size:clamp(30px,5.5vw,44px);line-height:1.04;text-transform:uppercase;margin:6px 0 4px}
  .ask{font-size:17px;color:var(--khaki);font-weight:500;margin:8px 0 20px;line-height:1.45}
  .ask b{color:var(--navy)}
  label.fl{display:block;font-family:'Oswald';font-weight:600;font-size:12px;letter-spacing:.1em;
           text-transform:uppercase;color:var(--khaki);margin:18px 0 8px}

  /* ---------- inputs ---------- */
  input[type=text],input[type=number],input[type=date],textarea{
    width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);
    padding:15px 16px;font:inherit;font-size:17px;color:var(--navy)}
  input:focus,textarea:focus{outline:none;border-color:var(--orange)}
  textarea{min-height:84px;resize:none}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;
        padding:13px 20px;font-size:16px;font-weight:600;color:var(--navy);cursor:pointer;user-select:none;
        min-height:48px;display:inline-flex;align-items:center;transition:background .12s,border-color .12s}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .chip.on.hot{background:var(--orange);border-color:var(--orange)}
  .yn{display:flex;gap:12px}
  .yn .chip{flex:1;justify-content:center;font-family:'Oswald';font-weight:600;font-size:20px;padding:18px;border-radius:var(--r)}
  .checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .check{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--paper);
         border-radius:var(--r);padding:14px 16px;font-size:16px;font-weight:600;cursor:pointer;min-height:54px}
  .check .bx{width:24px;height:24px;border:2px solid var(--navy);border-radius:6px;flex-shrink:0;
             display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
  .check.on{border-color:var(--orange);background:#fdf1e9}
  .check.on .bx{background:var(--orange);border-color:var(--orange)}
  .check.on .bx::after{content:"✓"}
  .stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:var(--r);
           background:var(--paper);width:max-content;overflow:hidden}
  .stepper button{width:62px;height:62px;border:none;background:var(--navy);color:#fff;font-size:28px;font-weight:700;cursor:pointer}
  .stepper button:active{background:var(--orange)}
  .stepper .val{width:110px;min-width:110px;height:62px;box-sizing:border-box;text-align:center;font-family:'Oswald';font-weight:700;font-size:28px;
                border:none;background:var(--paper);color:inherit;outline:none;padding:0;-webkit-appearance:none;-moz-appearance:textfield}
  .stepper .val:focus{box-shadow:inset 0 -3px 0 var(--orange)}
  .stepper .val::-webkit-outer-spin-button,.stepper .val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  /* ---------- garage grid ---------- */
  #grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;background:var(--paper);
        border:1.5px solid var(--line);border-radius:var(--r);padding:14px;touch-action:manipulation}
  #grid .cell{aspect-ratio:1;border-radius:8px;background:#e7ddca;cursor:pointer;transition:background .1s}
  .gridlegend{display:flex;gap:18px;margin-top:10px;font-size:13.5px;font-weight:600;color:var(--khaki)}
  .gridlegend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
  .gridmode{display:flex;gap:10px;margin:14px 0 12px}
  .gridmode .zbtn{flex:1;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 6px;font-family:'Oswald';font-weight:600;font-size:13.5px;cursor:pointer;color:var(--navy)}
  .gridmode .zbtn.on{color:#fff;background:var(--zc,var(--navy));border-color:var(--zc,var(--navy))}
  .doorlabel{text-align:center;font-family:'Oswald';font-size:11px;letter-spacing:.2em;color:var(--khaki);margin-top:8px}

  /* ---------- zone interstitial ---------- */
  .zonecard{min-height:62vh;display:flex;flex-direction:column;justify-content:center}
  .zonecard .big{font-size:clamp(46px,9vw,76px)}
  .zonecard p{font-size:19px;color:var(--khaki);max-width:520px;margin-top:14px;line-height:1.5}

  /* ---------- packages ---------- */
  .pkgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  .pkg{border:2px solid var(--line);background:var(--paper);border-radius:var(--r);padding:20px 18px;cursor:pointer;position:relative}
  .pkg h3{font-family:'Oswald';font-weight:700;font-size:20px;text-transform:uppercase;margin-bottom:8px}
  .pkg p{font-size:14.5px;color:var(--khaki);line-height:1.5;font-weight:500}
  .pkg.on{border-color:var(--orange);background:#fdf1e9}
  .pkg.on::after{content:"SELECTED";position:absolute;top:-11px;right:14px;background:var(--orange);color:#fff;
                 font-family:'Oswald';font-size:11px;letter-spacing:.1em;padding:3px 10px;border-radius:99px}
  .pkg .tag{position:absolute;top:-11px;left:14px;background:var(--navy);color:#fff;
            font-family:'Oswald';font-size:11px;letter-spacing:.1em;padding:3px 10px;border-radius:99px}
  .pkg .pkgprice{font-family:'Oswald';font-weight:700;font-size:22px;color:var(--orange2);margin:-2px 0 8px}
  /* step-down-only package: visually muted — never opened, only stepped down to */
  .pkg.muted{opacity:.55;border-style:dashed}
  .pkg.muted .tag{background:var(--khaki)}
  .pkg.muted .pkgprice{color:var(--khaki)}
  .pkg.muted.on{opacity:.85}

  /* ---------- day-of decision bonus ---------- */
  .bonus{border:2px dashed var(--orange);background:#fdf1e9;border-radius:var(--r);padding:16px 18px;margin:18px 0 0}
  .bonus h4{font-family:'Oswald';color:var(--orange2);font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
  .bonus p{font-size:15px;line-height:1.5;font-weight:500}
  .bonus .bonuschk{display:flex;align-items:center;gap:10px;margin-top:12px;font-family:'Oswald';font-weight:600;
                   font-size:15px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none}
  .bonus .bonuschk input{width:22px;height:22px;accent-color:var(--orange)}
  .holdnote{font-family:'Oswald';font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
            color:var(--khaki);text-align:right;margin:-8px 0 4px}

  /* ---------- upgrades ---------- */
  .up{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);background:var(--paper);
      border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
  .up.on{border-color:var(--orange);background:#fdf1e9}
  .up .bx{width:26px;height:26px;border:2px solid var(--navy);border-radius:7px;flex-shrink:0;cursor:pointer;
          display:flex;align-items:center;justify-content:center;color:#fff}
  .up.on .bx{background:var(--orange);border-color:var(--orange)}
  .up.on .bx::after{content:"✓"}
  .up .nm{flex:1;font-weight:600;font-size:16px}
  .up .nm small{display:block;color:var(--khaki);font-weight:500;font-size:13px}
  .up .qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
  .up .qty button{width:42px;height:42px;border:none;background:var(--navy);color:#fff;font-size:20px;font-weight:700}
  .up .qty span{min-width:42px;text-align:center;font-family:'Oswald';font-weight:700;font-size:18px}
  .up .qty input{width:52px;min-width:52px;height:42px;box-sizing:border-box;text-align:center;font-family:'Oswald';font-weight:700;font-size:18px;
                 border:none;background:var(--paper);color:var(--navy);outline:none;padding:0;-webkit-appearance:none;-moz-appearance:textfield}
  .up .qty input:focus{box-shadow:inset 0 -3px 0 var(--orange)}
  .up .qty input::-webkit-outer-spin-button,.up .qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .up .pr{font-family:'Oswald';font-weight:700;font-size:18px;min-width:74px;text-align:right}

  /* ---------- summary ---------- */
  .quoteblock{background:var(--navy);color:#fff;border-radius:var(--r);padding:22px;margin:18px 0}
  .quoteblock .ln{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:16px}
  .quoteblock .ln:last-child{border:none}
  .quoteblock .ln b{font-family:'Oswald';font-weight:600}
  .quoteblock .total{font-family:'Oswald';font-weight:700;font-size:34px;color:var(--orange)}
  .pain{background:var(--paper);border-left:4px solid var(--orange);border-radius:0 var(--r) var(--r) 0;
        padding:14px 18px;margin-bottom:10px;font-size:16.5px;line-height:1.5}
  .pain b{color:var(--orange2)}
  .guarantee{border:2px solid var(--orange);border-radius:var(--r);padding:18px 20px;margin:18px 0;background:var(--paper)}
  .guarantee h4{font-family:'Oswald';color:var(--orange);font-size:16px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
  .guarantee li{margin-left:18px;font-size:15.5px;font-weight:500;padding:3px 0}
  .terms{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:14px 0}
  .terms h4{font-family:'Oswald';font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--navy);margin-bottom:6px}
  .terms p{font-size:14px;line-height:1.5;color:var(--navy);font-weight:500}
  .terms details{margin-top:9px}
  .terms summary{font-family:'Oswald';font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);cursor:pointer}
  .terms ul{margin:8px 0 0;padding-left:18px}
  .terms li{font-size:13px;line-height:1.5;color:var(--khaki);font-weight:500;margin-bottom:6px}
  .terms li b{color:var(--navy)}
  #sig{width:100%;height:150px;background:var(--paper);border:1.5px dashed var(--khaki);border-radius:var(--r);touch-action:none}
  .sigbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .sigbar button{background:none;border:none;color:var(--orange);font-weight:700;font-size:14px;cursor:pointer;padding:8px}

  /* ---------- bottom nav ---------- */
  #nav{flex-shrink:0;background:var(--cream);border-top:1.5px solid var(--line);
       padding:12px 22px max(env(safe-area-inset-bottom),14px);display:flex;gap:12px}
  #nav .inner{max-width:760px;margin:0 auto;display:flex;gap:12px;width:100%}
  .btn{font-family:'Oswald';font-weight:600;font-size:18px;letter-spacing:.05em;text-transform:uppercase;
       border:none;border-radius:var(--r);padding:18px 26px;cursor:pointer;min-height:58px}
  .btn.next{flex:1;background:var(--orange);color:#fff}
  .btn.next:active{background:var(--orange2)}
  .btn.back{background:transparent;border:2px solid var(--navy);color:var(--navy);min-width:110px}
  .btn.navy{flex:1;background:var(--navy);color:#fff}
  .num{font-family:'Oswald';font-weight:700;color:var(--orange);font-size:15px;letter-spacing:.08em}
  @media (prefers-reduced-motion:no-preference){ .screen{animation:in .18s ease} @keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}} }
  /* ---------- per-job photos + AI after ---------- */
  .lookrow{display:flex;gap:10px}
  .lookrow input{flex:1}
  .lookbtn{background:var(--navy);color:#fff;border:none;border-radius:var(--r);font-family:'Oswald';font-weight:600;
           font-size:14px;letter-spacing:.04em;text-transform:uppercase;padding:0 18px;cursor:pointer;min-height:54px;white-space:nowrap}
  #lookout{margin-top:10px}
  .lkr{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--paper);
       border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
  .lkr:active{border-color:var(--orange)}
  .lkr .nm{font-weight:600;font-size:15.5px}
  .lkr .nm small{display:block;font-weight:500;color:var(--khaki);font-size:13px}
  .lkr .go{font-family:'Oswald';font-weight:700;color:var(--orange);font-size:18px}
  .jreqhead{display:flex;justify-content:space-between;align-items:center;font-family:'Oswald';font-weight:600;font-size:12px;
            letter-spacing:.1em;text-transform:uppercase;color:var(--khaki);margin:2px 0 8px}
  .jreqhead a{color:var(--orange);text-decoration:none;font-size:20px;line-height:1}
  .jrow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--paper);
        border:1.5px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:7px;cursor:pointer}
  .jrow:active{border-color:var(--orange)}
  .jrow .nm{font-weight:600;font-size:15.5px}
  .jrow .nm small{display:block;font-weight:500;color:var(--khaki);font-size:13px}
  .jrow .go{font-family:'Oswald';font-weight:700;color:var(--orange);font-size:18px}
  .jmore{display:inline-block;color:var(--orange);text-decoration:none;font-weight:600;font-size:14px;margin:3px 0 4px}
  .looknote{font-size:13px;color:var(--khaki);font-weight:500;margin-top:8px}
  .drivebtn{margin-top:10px;background:var(--navy);color:#fff;border:none;border-radius:11px;font-family:'Oswald';
            font-weight:600;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;padding:12px 16px;cursor:pointer;
            min-height:46px;display:inline-flex;align-items:center;gap:8px}
  .drivebtn:disabled{opacity:.6}
  .drivelink{display:inline-block;margin:8px 0 0 10px;font-family:'Oswald';font-weight:600;font-size:13px;
             letter-spacing:.04em;text-transform:uppercase;color:var(--orange2)}
  .photostrip{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .pthumb{position:relative;width:104px;height:104px;border-radius:12px;overflow:hidden;border:1.5px solid var(--line);background:var(--paper)}
  .pthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .pthumb .del{position:absolute;top:4px;right:4px;width:24px;height:24px;border:none;border-radius:50%;
               background:rgba(19,32,58,.82);color:#fff;font-size:15px;line-height:24px;cursor:pointer;padding:0}
  .padd{width:104px;height:104px;border-radius:12px;border:2px dashed var(--khaki);background:var(--paper);
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;
        font-family:'Oswald';font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--khaki)}
  .padd span{font-size:26px;line-height:1}
  .aibtn{margin-top:12px;background:var(--navy);color:#fff;border:none;border-radius:12px;font-family:'Oswald';
         font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;padding:14px 18px;cursor:pointer;
         min-height:50px;display:inline-flex;align-items:center;gap:9px}
  .aibtn:disabled{opacity:.55}
  .aibtn.hot{background:var(--orange)}
  .aiout{margin-top:12px}
  .aiout img{width:100%;border-radius:var(--r);border:1.5px solid var(--line);display:block}
  .genbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 6px}
  .genbar i{display:block;height:100%;width:0%;background:var(--orange);border-radius:99px;transition:width .5s ease}
  .genmsg{font-size:13px;color:var(--khaki);font-weight:500}
  .ailbl{font-family:'Oswald';font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
         color:var(--khaki);margin-top:6px}
  .aibadge{display:inline-block;background:#13203a;color:#fff;font-family:'Oswald';font-size:10px;letter-spacing:.1em;
           text-transform:uppercase;padding:3px 8px;border-radius:99px;margin-bottom:6px}
  #pviewer{position:fixed;inset:0;z-index:9000;background:rgba(8,14,26,.92);display:none;align-items:center;justify-content:center;padding:16px}
  #pviewer.on{display:flex}
  #pviewer img{max-width:100%;max-height:88vh;border-radius:10px}
  #pviewer .x{position:absolute;top:14px;right:16px;background:none;border:none;color:#fff;font-size:34px;cursor:pointer}
  /* Save PDF / print: un-fix the clipped app shell so the WHOLE plan prints, not just the viewport */
  @media print{
    html,body{position:static!important;height:auto!important;overflow:visible!important;display:block!important;background:#fff}
    #stage{overflow:visible!important;height:auto!important;padding:0!important}
    #topbar,#nav,#rail,#zonechip,#egc-gate,#sendstatus,.sigbar,.btn{display:none!important}
    .screen{max-width:none;animation:none}
    .quoteblock{background:#13203a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    canvas#sig{border:1px solid #999}
  }
</style>
</head>
<body>

<!-- ═══ EGC crew gate — same credentials as /employee.html (a portal sign-in in this tab carries over) ═══ -->
<style>
  #egc-gate{position:fixed;inset:0;z-index:99999;background:#13203a;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Inter',system-ui,sans-serif}
  #egc-gate.off{display:none}
  #egc-gate .gcard{width:100%;max-width:360px;background:#1d2d4f;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:28px 24px;box-shadow:0 24px 64px rgba(0,0,0,.5)}
  #egc-gate .gpill{display:inline-block;background:#e8581c;color:#fff;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 12px;border-radius:99px;margin-bottom:12px}
  #egc-gate h2{font-family:'Oswald',sans-serif;color:#fff;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px}
  #egc-gate .gsub{color:#aeb8cc;font-size:13.5px;margin:0 0 6px;line-height:1.45}
  #egc-gate label{display:block;color:#aeb8cc;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin:14px 0 5px}
  #egc-gate input{width:100%;box-sizing:border-box;background:#13203a;border:1.5px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:16px;padding:12px 13px;font-family:inherit}
  #egc-gate input:focus{outline:none;border-color:#e8581c}
  #egc-gate .gbtn{width:100%;margin-top:18px;background:#e8581c;border:none;color:#fff;font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:13px;border-radius:10px;cursor:pointer;min-height:48px}
  #egc-gate .gerr{display:none;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#fca5a5;border-radius:8px;padding:9px 12px;font-size:13px;margin-top:14px}
</style>
<div id="egc-gate">
  <div class="gcard">
    <div class="gpill">EGC Crew Tools</div>
    <h2>Crew Sign-In</h2>
    <p class="gsub">Use your employee portal username &amp; password.</p>
    <label for="gate-u">Username</label>
    <input type="text" id="gate-u" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="gate-p">Password</label>
    <input type="password" id="gate-p" autocomplete="current-password">
    <button class="gbtn" onclick="gateLogin()">Unlock</button>
    <div class="gerr" id="gate-err">Incorrect username or password.</div>
  </div>
</div>
<script>
/* SOFT GATE — keeps customers, bots, and casual snoops out of the field tools.
   It is NOT real authentication: the page source is public, so a determined
   reader can forge the token. For true protection put Cloudflare Access in
   front of /crew/* and /api/crew-hook (identity-checked at the edge).
   Auth mirrors /employee.html: salted SHA-256, same usernames & passwords.
   Sessions expire after GATE_TTL so a lost/left iPad re-locks itself.
   Rotate a password by updating the hash here AND in employee.html:
   sha256(username + ':' + newPass + ':egc-salt-2026') */
const GATE_USERS={
  ZacB:"6b8670f397174ff99440629b877581216a0b26b6770054be198988ff48a16861",
  TylerG:"28b50fd5ee98af8cf015972811def03dbc2eaff52997f82ecfc4342ece6cfa36",
  AlexK:"52e2e9901adc10406ad9597084ece4770d1c9fd0e3b76e1f31abf35f8030ac50",
  JobberCrew:"a68121119b6a72c583c366a62257cbb3652867e9b50e46bdda6fb05280dee683"};
const GATE_TTL=12*60*60*1000; // 12h — covers a work day, bounds a lost device
async function gateSha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");}
function gateTok(u){return gateSha(u+":"+GATE_USERS[u]+":egc-session");}
function gateSet(u,t){const exp=String(Date.now()+GATE_TTL);
  try{for(const st of[sessionStorage,localStorage]){st.setItem("egc_u",u);st.setItem("egc_tok",t);st.setItem("egc_exp",exp);}}catch(e){}}
async function gateOk(){
  try{
    for(const st of[sessionStorage,localStorage]){
      const u=st.getItem("egc_u"),t=st.getItem("egc_tok"),exp=parseInt(st.getItem("egc_exp")||"0",10);
      if(u&&GATE_USERS[u]&&t&&t===await gateTok(u)){
        if(exp&&Date.now()<exp){gateSet(u,t);return u;} // valid → slide the window
        gateClear(); // token ok but expired (or pre-expiry session) → require re-login
      }
    }
  }catch(e){}
  return null;
}
function gateClear(){try{["egc_u","egc_tok","egc_exp"].forEach(k=>{sessionStorage.removeItem(k);localStorage.removeItem(k);});}catch(e){}}
async function gateLogin(){
  const u=document.getElementById("gate-u").value.trim(),p=document.getElementById("gate-p").value;
  if(GATE_USERS[u]&&await gateSha(u+":"+p+":egc-salt-2026")===GATE_USERS[u]){
    gateSet(u,await gateTok(u));
    document.getElementById("egc-gate").classList.add("off");
  }else document.getElementById("gate-err").style.display="block";
}
function gateLock(){gateClear();location.reload();}
gateOk().then(u=>{
  if(u){document.getElementById("egc-gate").classList.add("off");return;}
  document.getElementById("gate-p").addEventListener("keydown",e=>{if(e.key==="Enter")gateLogin()});
  document.getElementById("gate-u").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("gate-p").focus()});
});
</script>

/* ===== Per-job photos — on-device (IndexedDB), keyed by jobId =====
   Jobber's Zapier integration has no photo-attachment action, so photos live
   on the iPad and travel with the job (same DB shared by prejob/postjob via
   the egc_active_job handoff). Only counts go to HQ — images stay local. */
const PHOTO_COUNTS={before:0,after:0,after_ai:0};
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open("egc_photos",1);
  r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains("p")){
    const s=db.createObjectStore("p",{keyPath:"id"});s.createIndex("job","job",{unique:false});}};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function photoAdd(job,tag,dataUrl){const db=await idbOpen();return new Promise((res,rej)=>{
  const tx=db.transaction("p","readwrite");const id=uid();
  tx.objectStore("p").put({id,job,tag,dataUrl,at:Date.now()});
  tx.oncomplete=()=>res(id);tx.onerror=()=>rej(tx.error);});}
async function photoDel(id){const db=await idbOpen();return new Promise(res=>{
  const tx=db.transaction("p","readwrite");tx.objectStore("p").delete(id);tx.oncomplete=()=>res();tx.onerror=()=>res();});}
async function photoList(job,tag){const db=await idbOpen();return new Promise(res=>{
  const tx=db.transaction("p","readonly");const out=[];
  tx.objectStore("p").index("job").openCursor(IDBKeyRange.only(job)).onsuccess=e=>{const c=e.target.result;
    if(c){if(!tag||c.value.tag===tag)out.push(c.value);c.continue();}else res(out.sort((a,b)=>a.at-b.at));};});}
function fileToDataUrl(file,max=1600,q=0.82){return new Promise((res,rej)=>{const img=new Image();
  img.onload=()=>{let w=img.width,h=img.height;const sc=Math.min(1,max/Math.max(w,h));
    w=Math.round(w*sc);h=Math.round(h*sc);const cv=document.createElement("canvas");cv.width=w;cv.height=h;
    cv.getContext("2d").drawImage(img,0,0,w,h);res(cv.toDataURL("image/jpeg",q));};
  img.onerror=rej;img.src=URL.createObjectURL(file);});}
function viewPhoto(src){const v=$("pviewer");$("pviewerimg").src=src;v.classList.add("on");}
async function refreshCounts(){
  try{const job=S.jobId||"";const all=await photoList(job);

    PHOTO_COUNTS.after=all.filter(p=>p.tag==="after").length;
    PHOTO_COUNTS.after_ai=all.filter(p=>p.tag==="after_ai").length;

}

}

/* ===== Jobber customer lookup (read-only, via /api/jobber-clients) ===== */

        <div class="nm">${esc(c.name)}<small>${esc([c.address,c.phone].filter(Boolean).join(" · "))}</small></div>

function lookPick(i){

/* ===== Today's Jobber requests — auto-pulled at the start of the walkthrough =====
   Walkthroughs are booked in Jobber as Requests. We load the day's list so the
   crew taps their customer; the detail fields below pre-fill but stay editable.
   Cached after the first load so re-renders don't re-hit Jobber. */
let JREQ={status:"idle", date:"", today:[], recent:[], showAll:false};
async function loadTodayRequests(force){
  if(JREQ.status==="loading") return;
  if(JREQ.status!=="idle" && !force){ paintRequests(); return; } // already attempted — repaint, don't auto-refetch (Retry passes force)
  JREQ.status="loading"; JREQ.showAll=false; paintRequests();
  try{
    const res=await fetch("/api/jobber-requests");
    const j=await res.json().catch(()=>({}));
    if(res.status===501){ JREQ.status="unconfigured"; }
    else if(!res.ok||!j.ok){ JREQ.status="error"; }
    else { JREQ.status="done"; JREQ.date=j.date||""; JREQ.today=j.today||[]; JREQ.recent=j.recent||[]; }
  }catch(e){ JREQ.status="error"; }
  paintRequests();
}
function reqList(){ return JREQ.showAll?JREQ.recent:JREQ.today; }
function fmtDay(d){ try{ return new Date(d+"T12:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }catch(e){ return d; } }
function paintRequests(){
  const el=$("jreq"); if(!el) return;
  if(JREQ.status==="loading"){ el.innerHTML=`<div class="looknote">Pulling today's walkthroughs from Jobber…</div>`; return; }
  if(JREQ.status==="unconfigured"){ el.innerHTML=`<div class="looknote">Jobber isn't connected yet — Zac: run /api/jobber-auth once. Search by name or type it in for now.</div>`; return; }
  if(JREQ.status==="error"){ el.innerHTML=`<div class="looknote">Couldn't reach Jobber — search by name below or type it in. <a href="#" onclick="loadTodayRequests(true);return false">Retry</a></div>`; return; }
  if(JREQ.status!=="done"){ el.innerHTML=""; return; }
  const list=reqList();
  const head=`<div class="jreqhead"><span>${JREQ.showAll?"Recent requests":"Today’s walkthroughs"}${(JREQ.date&&!JREQ.showAll)?" · "+esc(fmtDay(JREQ.date)):""}</span><a href="#" title="Refresh" onclick="loadTodayRequests(true);return false">↻</a></div>`;
  if(!list.length){
    el.innerHTML=head+`<div class="looknote">${JREQ.showAll?"No requests found.":"No walkthrough requests dated today."}${(!JREQ.showAll&&JREQ.recent.length)?` <a href="#" onclick="JREQ.showAll=true;paintRequests();return false">Show recent requests →</a>`:""}</div>`;
    return;
  }
  el.innerHTML=head+list.map((c,i)=>`<div class="jrow" onclick="reqPick(${i})">
      <div class="nm">${esc(c.name||"(no name on request)")}<small>${esc([c.address,c.phone].filter(Boolean).join(" · ")||c.title||"")}</small></div>
      <span class="go">→</span></div>`).join("")
    + ((!JREQ.showAll&&JREQ.recent.length>JREQ.today.length)?`<a class="jmore" href="#" onclick="JREQ.showAll=true;paintRequests();return false">Show all recent requests →</a>`:"")
    + (JREQ.showAll?`<a class="jmore" href="#" onclick="JREQ.showAll=false;paintRequests();return false">← Back to today</a>`:"");
}
function reqPick(i){
  const c=reqList()[i]; if(!c) return;
  if(c.name) S.name=c.name;          // only overwrite a field the request actually has —
  if(c.address) S.addr=c.address;    // never blank out something the crew already typed
  if(c.phone) S.phone=c.phone;
  if(c.email) S.email=c.email;
  S.jobberClientId=c.clientId||"";
  S.jobberRequestId=c.id||"";
  render(); // re-prefills the editable fields + repaints the list from cache
}

/* ===== Upload this job's photos to its Google Drive folder ===== */
function driveKey(){return "egc_drive_"+(S.jobId||"");}
async function photoMark(id){try{const db=await idbOpen();await new Promise(res=>{const tx=db.transaction("p","readwrite");
  const st=tx.objectStore("p");const g=st.get(id);
  g.onsuccess=()=>{const v=g.result;if(v){v.uploaded=true;st.put(v);}};
  tx.oncomplete=()=>res();tx.onerror=()=>res();});}catch(e){}}
function driveLabel(){
  return [(S.jobdate||new Date().toISOString().slice(0,10)),(S.name||"job"),(S.addr||"")].filter(Boolean).join(" — ");
}
async function driveUploadAll(btn,doneEl){
  const job=S.jobId||(S.jobId=uid());
  let ps=[]; try{ps=await photoList(job);}catch(e){}
  const todo=ps.filter(p=>!p.uploaded);
  const linkHtml=u=>`<a class="drivelink" href="${u}" target="_blank" rel="noopener">Open Drive folder ↗</a>`;
  const known=localStorage.getItem(driveKey());
  if(!todo.length){
    if(doneEl)doneEl.innerHTML=known?linkHtml(known):"";
    alert(ps.length?"All photos for this job are already in Drive.":"No photos on this job yet.");return;
  }
  btn.disabled=true;
  let folderUrl=known||"",sent=0,failed=false;
  for(let i=0;i<todo.length;i+=6){
    const batch=todo.slice(i,i+6);
    btn.textContent=`⬆️ Uploading ${Math.min(i+batch.length,todo.length)}/${todo.length}…`;
    try{
      const res=await fetch("/api/drive-upload",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({jobId:job,label:driveLabel(),photos:batch.map(p=>({id:p.id,tag:p.tag,dataUrl:p.dataUrl}))})});
      const j=await res.json().catch(()=>({}));
      if(res.status===501){alert("Drive upload isn't connected yet — Zac: run /api/drive-auth once.");failed=true;break;}
      if(!res.ok||!j.ok){failed=true;break;}
      folderUrl=j.folderUrl||folderUrl;
      for(const id of (j.uploaded||[])){await photoMark(id);sent++;}
    }catch(e){failed=true;break;}
  }
  if(folderUrl){try{localStorage.setItem(driveKey(),folderUrl);}catch(e){}}
  btn.disabled=false;
  if(failed&&!sent){btn.textContent="⬆️ Retry Drive upload";alert("Upload didn't go through — check signal and tap again. Photos are still on this iPad.");}
  else if(failed){btn.textContent=`⬆️ ${sent} up — retry the rest`;}
  else{btn.textContent="✓ Photos in Drive";}
  if(doneEl&&folderUrl)doneEl.innerHTML=linkHtml(folderUrl);
}

async function genAfter(){
  const btn=$("aibtn"); if(!btn) return;
  const job=S.jobId||""; let befs=[]; try{befs=await photoList(job,"before");}catch(e){}
  if(!befs.length){alert("Snap a before photo first.");return;}
  btn.disabled=true;btn.textContent="✨ Generating…";
  // estimate bar — the model doesn't stream progress, so creep toward ~96% over ~30s, then snap to 100
  const out=$("aiout");
  if(out) out.innerHTML=`<div class="genbar"><i></i></div><div class="genmsg">Rendering the “after”… about 30 seconds</div>`;
  const bar=out?out.querySelector(".genbar i"):null;
  let pct=0; const timer=setInterval(()=>{pct=Math.min(96,pct+(pct<75?2.5:0.7));if(bar)bar.style.width=pct+"%";},500);
  try{
    const res=await fetch("/api/garage-render",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({image:befs[befs.length-1].dataUrl, hint:layoutHint(), sketch:layoutSketchDataUrl()})});
    const j=await res.json();
    clearInterval(timer);
    if(res.ok&&j&&j.ok&&j.image){
      if(bar)bar.style.width="100%";
      S.aiAfter=j.image; save();
      try{await photoAdd(job,"after_ai",j.image);}catch(e){}
      paintAi(); refreshCounts();
      btn.textContent="✨ Regenerate the After";btn.disabled=false;
    }else{ if(out)out.innerHTML=""; btn.textContent="✨ Generate the After";btn.disabled=false;
      alert("Couldn't generate: "+((j&&j.error)||res.status)+". Check signal and try again."); }
  }catch(e){ clearInterval(timer); if(out)out.innerHTML=""; btn.textContent="✨ Generate the After";btn.disabled=false;
    alert("Image service unreachable — check signal and try again."); }
}

function priceFor(u,q){ return u.qty ? Math.round(u.price*Math.max(1,q||1)*100)/100 : u.price; }
function upgradesTotal(){
  let t=0;
  CONFIG.upgrades.forEach((u,i)=>{ if(S.storage.includes(i)) t+=priceFor(u,S.storageQty[i]||1); });
  return t;
}
// The quote builds from scope: removal base ($500 × truckloads) + add-ons.
// Organize + a basic sweep are included, so they are never line items.
function removalBase(){ return Math.max(0,Number(S.loads||0))*CONFIG.removalPerTruck; }
function grandTotal(){ return removalBase()+upgradesTotal(); }

/* ---------- flow definition ---------- */
const steps=[
  {id:"start"},
  {id:"zone",z:"A",title:"The Damage",sub:"First we get honest about where the garage stands today. Your answers here become the plan."},
  {id:"p1",z:"A"},{id:"p3",z:"A"},{id:"p4",z:"A"},{id:"p5",z:"A"},

  p7:"Heavy & Specialty Items", p8:"Access & Logistics", p9:"Donate & Recycle Plan",

/* ---------- grid + signature + upgrades helpers ---------- */
/* ---------- parking layout (p12): color-coded zones, presets + custom draw ---------- */
const LZONE={1:{name:"Car",color:"#13203a"},2:{name:"Workbench",color:"#2f8f6b"},3:{name:"Gym",color:"#7c5cbf"},4:{name:"Storage",color:"#d4a017"}};
const LAYOUT_PRESETS=["1 car","2 cars","Car + workbench","Car + gym corner","No car — clean storage","Custom"];
function layoutPreset(name){
  const g=Array(40).fill(0), set=(r,c,z)=>{ if(r>=0&&r<5&&c>=0&&c<8) g[r*8+c]=z; };
  const car=c0=>{ for(let r=2;r<5;r++) for(let c=c0;c<c0+2;c++) set(r,c,1); };
  if(name==="1 car") car(3);
  else if(name==="2 cars"){ car(1); car(5); }
  else if(name==="Car + workbench"){ car(2); for(let c=0;c<8;c++) set(0,c,2); }
  else if(name==="Car + gym corner"){ car(4); for(let r=0;r<2;r++) for(let c=0;c<2;c++) set(r,c,3); }
  else if(name==="No car — clean storage"){ for(let r=0;r<5;r++){ set(r,0,4); set(r,7,4); } for(let c=0;c<8;c++) set(0,c,4); }
  return g;
}
function pickLayout(v){ S.layout=v; if(v!=="Custom") S.layoutGrid=layoutPreset(v); render(); }
// Multi-garage: each bay keeps its own sketch; selectBay stashes the current and loads another.
function selectBay(n){
  S.bayGrids[S.bay]=S.layoutGrid; S.bayLayouts[S.bay]=S.layout;
  S.bay=n;
  S.layoutGrid=S.bayGrids[n]||Array(40).fill(0);
  S.layout=S.bayLayouts[n]||null;
  render();
}
function tapLayout(i){ if(S.layout!=="Custom") S.layout="Custom"; S.layoutGrid[i]=(S.layoutGrid[i]===S.layoutPaint)?0:S.layoutPaint; render(); }
// Live size read from the custom measurements — rough bays by width, handy for the deep-clean size.
function garageSizeHint(){
  const w=parseFloat(S.garageW), d=parseFloat(S.garageD);
  if(!(w>0)||!(d>0)) return "";
  const sqft=Math.round(w*d), size=w<16?"1-car":w<26?"2-car":"3-car";
  return `<div class="looknote" style="margin-top:8px">≈ <b>${sqft} sq ft</b> — reads like a <b>${size}</b> garage. Handy for sizing the deep clean.</div>`;
}
// Prompt nudge for the AI "after": chosen parking layout + scope (zones, bays, shelving).
function layoutHint(){
  const p=[];
  if(S.layout&&S.layout!=="Custom") p.push("parking layout: "+S.layout.toLowerCase());
  else if(S.layout==="Custom"){ const z=[...new Set(S.layoutGrid.filter(Boolean).map(v=>LZONE[v].name.toLowerCase()))]; if(z.length) p.push("zones: "+z.join(", ")); }
  if(S.garages>1) p.push(S.garages+" garage bays");
  // render the actual shelving they chose, as a concrete material
  const shelfDesc={
    "Shelving — Metal":"freestanding black heavy-duty steel shelving racks",
    "Shelving — Plastic":"freestanding black plastic/resin shelving units",
    "Shelving — Wood + Metal":"freestanding shelving with wood shelves on black steel frames"};
  CONFIG.upgrades.forEach((u,i)=>{ if(S.storage.includes(i)&&u.group==="shelving"&&shelfDesc[u.name]) p.push(shelfDesc[u.name]); });
  // EGC bins are the yellow-and-black HDX-style totes
  if(CONFIG.upgrades.some((u,i)=>S.storage.includes(i)&&/tote|bin/i.test(u.name)))
    p.push("belongings stored in matching yellow-and-black labeled storage totes neatly stacked on the shelves");
  return p.join("; ");
}
// Render the current bay's top-down layout to a labeled diagram the AI can match positions from.
function layoutSketchDataUrl(){
  const g=S.layoutGrid; if(!g||!g.some(Boolean)) return ""; // nothing drawn → skip
  const cols=8, rows=5, cell=60, pad=18, w=cols*cell+pad*2, h=rows*cell+pad*2+26;
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  const ctx=cv.getContext("2d");
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,w,h);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ const v=g[r*cols+c], x=pad+c*cell, y=pad+r*cell;
    ctx.fillStyle=v?LZONE[v].color:"#e7ddca"; ctx.fillRect(x+2,y+2,cell-4,cell-4); }
  ctx.fillStyle="#ffffff"; ctx.font="bold 14px sans-serif"; ctx.textAlign="center";
  Object.keys(LZONE).forEach(z=>{ const idx=g.map((v,i)=>v==z?i:-1).filter(i=>i>=0); if(!idx.length) return;
    const cx=idx.reduce((s,i)=>s+(i%cols),0)/idx.length, cy=idx.reduce((s,i)=>s+Math.floor(i/cols),0)/idx.length;
    ctx.fillText(LZONE[z].name, pad+(cx+0.5)*cell, pad+(cy+0.5)*cell+5); });
  ctx.fillStyle="#13203a"; ctx.font="bold 12px sans-serif";
  ctx.fillText("▲ GARAGE DOOR / camera stands here ▲", w/2, h-9);
  try{ return cv.toDataURL("image/png"); }catch(e){ return ""; }
}
function toggleUp(i){
  const u=CONFIG.upgrades[i];
  if(!S.storage.includes(i)&&u.group) S.storage=S.storage.filter(j=>CONFIG.upgrades[j].group!==u.group);
  S.storage=chip(S.storage,i); render();
}
// quantity for qty-priced upgrades (e.g. Storage Totes @ $21.49 each) — +/- stepper
function setQty(i,d){ const q=Math.max(1,(S.storageQty[i]||1)+d); S.storageQty[i]=q; if(!S.storage.includes(i)) S.storage=[...S.storage,i]; render(); }
// typed quantity straight from the field — clamp to a whole number ≥ 1
function setQtyVal(i,v){ let q=parseInt(v,10); if(isNaN(q)||q<1)q=1; S.storageQty[i]=q; if(!S.storage.includes(i)) S.storage=[...S.storage,i]; render(); }

let sigCtx=null;
function captureSig(){ try{const cv=$("sig"); if(cv){S.sig=cv.toDataURL("image/png"); save();} }catch(e){} }
function initSig(){
  const cv=$("sig"); if(!cv) return;
  const r=cv.getBoundingClientRect(); cv.width=r.width*2; cv.height=300;
  sigCtx=cv.getContext("2d"); sigCtx.scale(2,2); sigCtx.lineWidth=2.4; sigCtx.lineCap="round"; sigCtx.strokeStyle="#13203a";
  // restore a previously captured signature so it survives re-render / reload
  if(S.sig){const img=new Image();img.onload=()=>sigCtx.drawImage(img,0,0,r.width,150);img.src=S.sig;}
  let draw=false,lx=0,ly=0;
  const pos=e=>{const b=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[t.clientX-b.left,t.clientY-b.top];};
  const dn=e=>{draw=true;[lx,ly]=pos(e);e.preventDefault();};
  const mv=e=>{if(!draw)return;const[x,y]=pos(e);sigCtx.beginPath();sigCtx.moveTo(lx,ly);sigCtx.lineTo(x,y);sigCtx.stroke();[lx,ly]=[x,y];e.preventDefault();};
  const end=()=>{if(draw){draw=false;captureSig();}};
  cv.addEventListener("touchstart",dn,{passive:false});cv.addEventListener("touchmove",mv,{passive:false});
  cv.addEventListener("mousedown",dn);cv.addEventListener("mousemove",mv);
  window.addEventListener("mouseup",end);window.addEventListener("touchend",end);
}
function clearSig(){ if(sigCtx){const cv=$("sig");sigCtx.clearRect(0,0,cv.width,cv.height);} S.sig=""; save(); }

/* ---------- nav / render ---------- */
const SAVEKEY="egc_gameplan_v1";
function save(){try{localStorage.setItem(SAVEKEY,JSON.stringify({S:S,idx:idx}))}catch(e){}}
function restore(){
  try{const d=JSON.parse(localStorage.getItem(SAVEKEY));
    if(d&&d.S&&(d.S.name||d.idx>0)&&confirm("Resume walkthrough"+(d.S.name?" for "+d.S.name:"")+"?")){
      Object.assign(S,d.S); idx=d.idx;
    } else localStorage.removeItem(SAVEKEY);
  }catch(e){}
}

function compileNotes(){
  const L=[];
  const add=(k,v)=>{if(v&&String(v).trim()&&v!=="null")L.push(k+": "+(Array.isArray(v)?v.join(", "):v));};
  add("Car fits today", S.park===true?"Yes":S.park===false?"NO":"");
  add("Last parked inside", S.parkLast);
  add("Building for", S.howLong);
  add("Missing out on", S.missing);
  add("THEIR WORDS", S.missNote);
  add("Used in last 12mo", S.used12);
  add("Keep / re-home", S.keepNote);
  add("HAZARDS", S.hazards); add("Hazard notes", S.hazNote);
  add("Truckloads", S.loads); add("Volume notes", S.loadNote);
  add("Heavy/specialty", S.heavy); add("Heavy notes", S.heavyNote);
  add("Access flags", S.access); add("Access notes", S.accessNote);
  add("Donate/recycle", S.donate); add("Donate notes", S.donateNote);
  add("Floor", S.floor); add("Floor notes", S.floorNote);
  add("Parking layout", S.layout); add("Layout notes", S.layoutNote);
  add("Garages to clear", S.garages>1?S.garages:"");
  add("Garage size", (parseFloat(S.garageW)>0&&parseFloat(S.garageD)>0)?`${S.garageW} × ${S.garageD}${S.garageH?" × "+S.garageH+"H":""} ft (~${Math.round(parseFloat(S.garageW)*parseFloat(S.garageD))} sq ft)`:"");
  add("Stay-clean system", S.stay);
  add("DAY-OF BONUS", S.dayBonus?"APPLIED — all special-disposal fees waived (mattress, fridge, tires, paint, e-waste)":"");
  return L.join("\n");
}

function buildLineItems(){
  const items=[];
  const base=removalBase();
  if(base>0) items.push({name:`Removal — ${S.loads} truckload${S.loads!==1?"s":""}`,
    description:`$${CONFIG.removalPerTruck}/truckload · organize with what they have + a basic sweep included`, qty:1, unit_price:base, total:base});
  CONFIG.upgrades.forEach((u,i)=>{ if(S.storage.includes(i)){
    const q=u.qty?(S.storageQty[i]||1):1, tot=priceFor(u,q);
    items.push({name:u.name, description:u.sub, qty:q, unit_price:Math.round(tot/q*100)/100, total:tot});
  }});
  return items;
}

function buildPayload(){
  const parts=(S.name||"").trim().split(/\s+/);
  const items=buildLineItems();
  if(!S.jobId)S.jobId=uid();
  const p={
    tool:"game_plan", job_id:S.jobId, sent_at:new Date().toISOString(),
    client:{name:S.name||"", first_name:parts[0]||"", last_name:parts.slice(1).join(" ")||"", phone:normPhone(S.phone), email:S.email||"", address:S.addr,
      jobber_client_id:S.jobberClientId||"", jobber_request_id:S.jobberRequestId||""},
    quote:{title:pointTotal()+"-Point Garage Game Plan — "+(S.addr||S.name||"garage"),
      total:grandTotal(), deposit:Number(S.deposit||0), job_date:S.jobdate,
      line_items:items, line_items_count:items.length},
    day_of_bonus:!!S.dayBonus,
    signature:S.sig||"", terms_version:"2026-06", terms_accepted:!!S.sig,
    photos:{before:PHOTO_COUNTS.before, ai_after:PHOTO_COUNTS.after_ai},
    drive_folder:(function(){try{return localStorage.getItem(driveKey())||"";}catch(e){return "";}})(),
    garage:{width:S.garageW||"", depth:S.garageD||"", height:S.garageH||"", bays:S.garages, layout:S.layout||"",
      sqft:(parseFloat(S.garageW)>0&&parseFloat(S.garageD)>0)?Math.round(parseFloat(S.garageW)*parseFloat(S.garageD)):""},
    notes:compileNotes(),
    // raw mirrors state for downstream Zaps, but strip the heavy base64 blobs — a high-quality AI
    // "after" can be several MB and blows past the crew-hook 256KB cap (413 → "NOT logged to HQ").
    raw:Object.assign({},S,{aiAfter:S.aiAfter?"[omitted]":"",sig:S.sig?"[omitted]":""}),
  };
  // flattened 6-slot mapping for easy Zapier field mapping (max job = removal + 5 add-ons)
  for(let i=0;i<6;i++){const it=items[i]||{};
    p["li"+(i+1)+"_name"]=it.name||""; p["li"+(i+1)+"_desc"]=it.description||"";
    p["li"+(i+1)+"_qty"]=it.qty||""; p["li"+(i+1)+"_unit_price"]=it.unit_price||""; p["li"+(i+1)+"_total"]=it.total||"";}
  p.title=p.quote.title; p.instructions=p.notes; p.start_date=S.jobdate||"";
  p.start_time=S.startTime?S.startTime+":00":""; p.end_time=S.endTime?S.endTime+":00":"";
  p.create_visits=!!(S.startTime&&S.endTime);
  p.line_items_count=items.length; p.total=grandTotal(); p.deposit=Number(S.deposit||0);
  return p;
}

// Validate before any send: a quote with no name/package/rate creates junk in Jobber.
function validateClose(){
  const miss=[];
  if(!(S.name||"").trim()) miss.push("homeowner name");
  if(grandTotal()<=0) miss.push("scope (truckloads or an add-on)");
  return miss;
}

async function postHook(payload){
  // Same-origin proxy returns a real, readable status — no opaque no-cors guessing.
  const res=await fetch(CONFIG.webhook,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)});
  let ok=res.ok; try{const j=await res.json();ok=ok&&j&&j.ok!==false;}catch(e){}
  return ok;
}

async function sendToJobber(btn){
  const st=$("sendstatus");
  const miss=validateClose();
  if(miss.length){if(st){st.style.color="var(--orange2)";st.textContent="Add "+miss.join(", ")+" before sending.";}return;}
  writeActive("sent_to_jobber"); // local handoff first — must survive even if HQ is unreachable
  btn.disabled=true; btn.textContent="Sending…"; if(st){st.style.color="var(--ok)";st.textContent="";}
  let ok=false;
  try{ ok=await postHook(buildPayload()); }catch(e){ ok=false; }
  if(ok){ btn.textContent="Sent to Jobber ✓"; if(st)st.textContent="Quote + notes pushed. Tyler can see it."; }
  else{ btn.disabled=false; btn.textContent="Retry → Send to Jobber"; if(st){st.style.color="var(--orange2)";
    st.textContent="NOT logged to HQ — handoff saved locally. Check signal and retry."; } }
}

// Text the plan from the EGC business line straight through the Quo API
// (/api/quo-send) — never the crew member's personal phone, and no Zapier hop.
async function textPlan(btn){
  const phone=normPhone(S.phone);
  if(!phone){alert("Add the homeowner's mobile number first (Point 1).");return;}
  const ups=CONFIG.upgrades.filter((u,i)=>S.storage.includes(i)).map((u)=>{
    const i=CONFIG.upgrades.indexOf(u), q=u.qty?(S.storageQty[i]||1):1;
    return "+ "+u.name+(u.qty?` × ${q}`:"")+" "+money(priceFor(u,q));}).join("\n");
  const msg=`${S.name?S.name+", h":"H"}ere's your Garage Comeback Plan from Easy Garage Cleaning:\n\n`+
    `Removal — ${S.loads} truckload${S.loads!==1?"s":""}: ${money(removalBase())}\nOrganize + basic sweep: included\n${ups?ups+"\n":""}TOTAL (locked): ${money(grandTotal())}\n`+
    `${S.jobdate?"Job date: "+S.jobdate+"\n":""}${S.deposit?"Deposit on file: "+money(S.deposit)+"\n":""}`+
    `\nPrice never moves. Questions? Call/text ${CONFIG.bizPhone}. — EGC`;
  const st=$("sendstatus");
  if(btn){btn.disabled=true;btn.textContent="Texting…";}
  if(st){st.style.color="var(--ok)";st.textContent="";}
  let r={ok:false};
  try{ const res=await fetch("/api/quo-send",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({to:phone,message:msg})}); r=await res.json().catch(()=>({})); r._ok=res.ok; r._status=res.status; }catch(e){ r={ok:false}; }
  if(r&&r._ok&&r.ok){ if(S.name) writeActive("texted_plan"); // texting the plan is a commit too — keep the handoff
    if(btn){btn.textContent="Plan texted ✓";} if(st)st.textContent="Sent from the EGC line via Quo."; }
  else{ if(btn){btn.disabled=false;btn.textContent="Retry → Text Plan";}
    if(st){st.style.color="var(--orange2)";st.textContent=(r&&r._status===501)?"Quo not connected yet — Zac: set QUO_API_KEY in Cloudflare.":"Couldn't send via Quo — check signal and retry.";} }
}

// Single source of truth for the cross-tool handoff. Carries the locked TOTAL
// (not just the package rate) and priced upsells so prejob/postjob confirm the
// real number. Only called on a commit (Send to Jobber / Text Plan), never on
// mere screen views — that stops abandoned/no-show quotes leaking into the next job.
function writeActive(via){
  try{
    const chosen=CONFIG.upgrades.filter((u,i)=>S.storage.includes(i));
    const upsells=chosen.map(u=>u.name).join(", ");
    const upsellsPriced=chosen.map(u=>{const i=CONFIG.upgrades.indexOf(u);const q=u.qty?(S.storageQty[i]||1):1;return u.name+(u.qty?` × ${q}`:"")+" "+money(priceFor(u,q));}).join(", ");
    if(!S.jobId)S.jobId=uid();
    localStorage.setItem("egc_active_job",JSON.stringify({
      jobId:S.jobId, jobberClientId:S.jobberClientId||"", name:S.name, addr:S.addr, phone:S.phone,
      pkg:removalBase()>0?`${S.loads} truckload${S.loads!==1?"s":""} removal`:"", upsells, upsellsPriced,
      rate:removalBase(), upgradesTotal:upgradesTotal(), total:grandTotal(),
      deposit:S.deposit, jobdate:S.jobdate, dayBonus:!!S.dayBonus, hasSignature:!!S.sig,
      photosBefore:PHOTO_COUNTS.before, hasAiAfter:!!S.aiAfter,
      pain:S.missNote||(S.parkLast?"hasn't parked inside since "+S.parkLast:""),
      committedVia:via||"", savedAt:new Date().toISOString()}));
  }catch(e){}
}
function jump(i){ idx=i; render(); }
function paintTotal(){
  const el=$("runtotal");
  if(grandTotal()>0){el.style.display="block";el.textContent=money(grandTotal());}
  else el.style.display="none";
}
function render(){
  const s=steps[idx];
  $("screen").innerHTML = R[s.id]?(s.id==="zone"?R.zone(s):R[s.id]()):"";
  // zone chip
  const zc=$("zonechip");
  if(s.z) {zc.textContent="ZONE "+s.z; zc.style.display="block";}
  else if(s.id==="plan"){zc.textContent="THE CLOSE";zc.style.display="block";}
  else zc.style.display="none";
  // rail
  $("rail").innerHTML=steps.map((st,i)=>{
    const z=st.z?("z"+st.z):"zC";
    return `<i class="${z} ${i<idx?"done":""} ${i===idx?"cur":""}" onclick="jump(${i})" style="cursor:pointer;min-height:14px;padding:5px 0;background-clip:content-box"></i>`;}).join("");
  // nav buttons
  let nav="";
  if(idx>0) nav+=`<button class="btn back" onclick="go(-1)">Back</button>`;
  if(s.id==="start") nav+=`<button class="btn next" onclick="go(1)">Start the Walkthrough</button>`;
  else if(s.id==="zone") nav+=`<button class="btn next" onclick="go(1)">Let's Go</button>`;
  else if(s.id==="p14") nav+=`<button class="btn next" onclick="go(1)">Show the Game Plan →</button>`;
  else if(s.id==="plan") nav+=`<button class="btn navy" onclick="sendToJobber(this)">Send to Jobber</button><button class="btn next" onclick="textPlan(this)">Text Plan</button>`;
  else nav+=`<button class="btn next" onclick="go(1)">Next Point →</button>`;
  $("navinner").innerHTML=nav;
  paintTotal();
  $("stage").scrollTop=0;
  if(s.id==="start")setTimeout(loadTodayRequests,0); // auto-pull the day's Jobber walkthroughs (cached after first load)
  if(s.id==="p10")setTimeout(()=>mountStrip("pb_before","before",{ai:false}),0); // before photo only — the After generates at the Layout step
  if(s.id==="p12")setTimeout(paintAi,0);
  if(s.id==="plan"){setTimeout(initSig,60);setTimeout(mountPlanPhotos,0);} // handoff is written on commit (Send/Text), not on view
  save();
}
async function mountPlanPhotos(){
  const el=$("pb_plan"); if(!el) return;
  const job=S.jobId||""; let befs=[]; try{befs=await photoList(job,"before");}catch(e){}
  if(!befs.length&&!S.aiAfter){el.innerHTML="";return;}
  const known=localStorage.getItem(driveKey())||"";
  el.innerHTML=`<label class="fl" style="margin-top:4px">Before → After</label>`+
    (S.aiAfter?`<div class="aiout"><div class="aibadge">AI preview — actual results vary</div>
      <img src="${S.aiAfter}" onclick="viewPhoto(this.src)"></div>`:"")+
    (befs.length?`<div class="photostrip" style="margin-top:8px">${befs.map(p=>
      `<div class="pthumb"><img src="${p.dataUrl}" onclick="viewPhoto(this.src)"></div>`).join("")}</div>`:"")+
    `<div><button class="drivebtn" onclick="driveUploadAll(this,$('drivelinkout'))">⬆️ Upload job photos to Drive</button>
      <span id="drivelinkout">${known?`<a class="drivelink" href="${known}" target="_blank" rel="noopener">Open Drive folder ↗</a>`:""}</span></div>`;
}
function go(d){ idx=Math.min(steps.length-1,Math.max(0,idx+d)); render(); }
if(!STORAGE_OK) setTimeout(()=>alert("Heads up: this browser is blocking local storage (often Private Browsing). The walkthrough won't auto-save and the pre-fill into the Pre/Post-Job tools won't work. Switch off Private Browsing for this iPad."),200);
restore();
if(!S.jobId)S.jobId=uid();
render();
</script>
