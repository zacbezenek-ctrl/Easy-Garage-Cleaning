<body>
<div id="gate"><form class="gate-card" onsubmit="login(event)"><div class="gate-mark">EGC</div><h1>Crew sign-in</h1><p>Use your employee portal login.</p><label for="user">Username</label><input id="user" autocomplete="username"><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password"><button type="submit">Unlock walkthrough</button><div class="gate-error" id="gate-error">Incorrect username or password.</div></form></div>
<div id="app">
  <header class="top"><div class="top-row"><div class="brand">EGC</div><div class="top-copy"><strong>Walkthrough</strong><span id="customer-label">New customer</span></div><div class="top-status"><i></i><span id="save-label">Saved on this device</span></div><button class="lock" onclick="logout()">Lock</button></div><nav class="steps" id="steps"></nav></header>
  <main id="screen"></main>

<script>
const SAVE='egc_walkthrough_v3',FLOW='2026-09-simple',REQUESTED_WALKTHROUGH_ID=new URLSearchParams(location.search).get('walkthroughId')||'';
const sections=['Customer','Photos','Scope','Finish','Schedule','Review'];
let index=0,error='',LOOK=[],APPTS=[],PHOTO_COUNT=0,sigCtx=null,draw=false,SLOT_OPTIONS=[],SLOT_LOADING=false,SLOT_ERROR='',SLOT_SIGNATURE='';
const freshState=()=>({name:'',phone:'',email:'',address:'',sourceWalkthroughId:'',highlevelContactId:'',highlevelOpportunityId:'',highlevelAppointmentId:'',highlevelJobAppointmentId:'',source:'',whyNow:'',outcome:'',garageSize:'2',fill:'',loads:'',sortMethod:'',keepNotes:'',removeNotes:'',valuables:'',special:[],hazards:[],access:[],accessNotes:'',truckPlacement:'',finish:['cleanout'],shelfType:'metal',shelfQty:0,toteQty:0,jobDate:'',startTime:'',endTime:'',crewSize:'2',assignedTo:'',notes:'',lockedPrice:'',priceManuallySet:false,photoDriveUrl:'',approved:false,signature:'',jobId:'',acceptanceAt:'',acceptanceBy:'',termsVersion:'2026-09-simple'});
const S=freshState();
const $=id=>document.getElementById(id),esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'$'+Number(v||0).toLocaleString('en-US',{maximumFractionDigits:0});
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
const normPhone=raw=>{const d=String(raw||'').replace(/\D/g,'');return d.length===10?'+1'+d:d.length===11&&d[0]==='1'?'+'.concat(d):d};
function denyWalkthrough(){location.replace('/crew/?notice=walkthrough-restricted')}
async function validSession(){const user=await EGCHubAuth.session();if(user&&!EGCHubAuth.canRunBusiness(user)){denyWalkthrough();return null}return user}
async function login(e){e.preventDefault();const button=e.submitter||e.currentTarget.querySelector('button'),error=$('gate-error');button.disabled=true;button.textContent='Signing in…';error.style.display='none';try{const user=await EGCHubAuth.signIn($('user').value.trim(),$('pass').value);if(!EGCHubAuth.canRunBusiness(user)){denyWalkthrough();return}await openApp()}catch(err){error.textContent=err.message||'Unable to sign in. Try again.';error.style.display='block'}finally{button.disabled=false;button.textContent='Unlock walkthrough'}}
async function logout(){await EGCHubAuth.signOut();location.reload()}
let hubDb=null;
try{if(window.firebase){if(!firebase.apps.length)firebase.initializeApp({apiKey:'AIzaSyA8g4UAW4P4bsCrQNZhUe81CbC7BvjJbNc',authDomain:'egcw-1ec83.firebaseapp.com',projectId:'egcw-1ec83',storageBucket:'egcw-1ec83.firebasestorage.app',messagingSenderId:'763340109795',appId:'1:763340109795:web:ac203b3eb71831fa4ed2d6'});hubDb=firebase.firestore()}}catch(e){}
async function openApp(){$('gate').style.display='none';$('app').style.display='block';restore(REQUESTED_WALKTHROUGH_ID);render();refreshPhotoCount();await loadAppointments();if(REQUESTED_WALKTHROUGH_ID){const i=APPTS.findIndex(x=>x.id===REQUESTED_WALKTHROUGH_ID);if(i>=0)useAppointment(i,true)}}
const draftKey=id=>`${SAVE}:${id||'manual'}`;
function save(){try{localStorage.setItem(draftKey(S.sourceWalkthroughId||REQUESTED_WALKTHROUGH_ID),JSON.stringify({flow:FLOW,index,S}));$('save-label').textContent='Saved on this device'}catch(e){$('save-label').textContent='Device storage blocked'}}
function restore(id=''){try{const d=JSON.parse(localStorage.getItem(draftKey(id))||(!id?localStorage.getItem(SAVE):'null')||'null');if(d&&d.flow===FLOW){Object.assign(S,d.S||{});index=Math.min(sections.length-1,Number(d.index||0))}}catch(e){}}
function resetForWalkthrough(id){const next=freshState();next.sourceWalkthroughId=id||'';Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,next);index=0;error='';SLOT_OPTIONS=[];SLOT_ERROR='';SLOT_SIGNATURE=''}
function pick(key,value,multi=false){invalidateAcceptance();if(!S.priceManuallySet)S.lockedPrice='';if(multi&&key==='hazards'){if(value==='No visible hazards')S.hazards=S.hazards.includes(value)?[]:[value];else S.hazards=S.hazards.filter(x=>x!=='No visible hazards'),S.hazards=S.hazards.includes(value)?S.hazards.filter(x=>x!==value):[...S.hazards,value]}else if(multi)S[key]=S[key].includes(value)?S[key].filter(x=>x!==value):[...S[key],value];else S[key]=value;if(key==='garageSize'&&!S.loads)S.loads={1:'1',2:'1.5',3:'2',other:'2.5'}[value];save();render()}
const choice=(key,value,label,sub='',multi=false)=>{const selected=multi?S[key].includes(value):S[key]===value;return`<button type="button" class="choice ${selected?'on':''}" onclick="pick('${key}','${value}',${multi})">${label}${sub?`<span>${sub}</span>`:''}</button>`};
function title(k,h,p){return`<div class="screen-head"><div><div class="eyebrow">${k}</div><h1>${h}</h1><p>${p}</p></div><div class="autosave">Changes save automatically</div></div>`}
function input(label,key,type='text',placeholder='',extra=''){return`<div><label class="label" for="f-${key}">${label}</label><input class="field" id="f-${key}" type="${type}" value="${esc(S[key])}" placeholder="${esc(placeholder)}" oninput="updateField('${key}',this.value)" ${extra}></div>`}
function area(label,key,placeholder=''){return`<div><label class="label" for="f-${key}">${label}</label><textarea class="field" id="f-${key}" placeholder="${esc(placeholder)}" oninput="updateField('${key}',this.value)">${esc(S[key])}</textarea></div>`}
function invalidateAcceptance(){if(!S.approved&&!S.signature&&!S.acceptanceAt)return;S.approved=false;S.acceptanceAt='';S.acceptanceBy='';S.signature='';const approved=$('approved');if(approved)approved.checked=false;const canvas=$('signature');if(canvas){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height)}const status=$('send-status');if(status)status.textContent='The plan changed. Review the updated brief and collect approval again.'}
function updateField(key,value){if(S[key]!==value){invalidateAcceptance();if(key==='lockedPrice')S.priceManuallySet=true;else if(!S.priceManuallySet)S.lockedPrice='';if(['crewSize','assignedTo'].includes(key))SLOT_SIGNATURE=''}S[key]=value;save()}

const screens=[
()=>title('Start','Customer and goal','Confirm who you are meeting and what they want the garage to do for them.')+`<section class="panel"><h2>Today’s Hub walkthroughs</h2><p>Tap one to fill the customer details.</p><div class="appointment-list" id="appointments">${APPTS.length?APPTS.map((a,i)=>`<button type="button" class="appointment" onclick="useAppointment(${i})"><time>${esc(a.time||'Today')}</time><div><strong>${esc(a.customer||a.name||a.title||'Walkthrough')}</strong><small>${esc(a.address||a.phone||'')}</small></div></button>`).join(''):'<div class="note">No walkthrough is scheduled in the Hub today. Manual entry still works.</div>'}</div><label class="label">Search HighLevel CRM</label><div class="inline-search"><input class="field" id="contact-search" value="${esc(S.name)}" placeholder="Customer name or phone"><button type="button" class="small-btn" onclick="searchContacts()">Search</button></div><div class="lookup-results" id="lookup-results"></div></section><section class="panel"><div class="grid2">${input('Customer name','name','text','Full name')}${input('Mobile','phone','tel','(970) 555-0123')}${input('Email','email','email','name@email.com')}${input('Address','address','text','Street address')}<div><label class="label">Source</label><select class="field" onchange="updateField('source',this.value)"><option value="">Select</option>${['Google','Facebook / Instagram','Referral','Repeat customer','Truck / yard sign','Other'].map(x=>`<option ${S.source===x?'selected':''}>${x}</option>`).join('')}</select></div></div>${area('Why now?','whyNow','What changed or made this urgent?')}${area('What should be different when we leave?','outcome','Use the customer’s words.')}</section>`,
()=>title('Document','Photograph the garage','Take enough photos to price and hand the job off without another explanation.')+`<section class="panel"><div class="photo-drop"><input type="file" accept="image/*" capture="environment" multiple onchange="addPhotos(this)"><div><div class="camera">＋</div><strong>Take or add photos</strong><span>Doorway wide shot, both sides, and the worst area</span></div></div><div class="photos" id="photos"></div><div class="photo-count ${PHOTO_COUNT>=3?'good':''}" id="photo-count">${PHOTO_COUNT} photo${PHOTO_COUNT===1?'':'s'} saved · ${PHOTO_COUNT>=3?'Minimum captured · add every angle the crew will need':'Take at least 3'}</div></section><section class="panel"><h2>Quick size check</h2><p>This supports the background estimate. No dimensions or diagram needed.</p><label class="label">Garage size</label><div class="choices cols4">${choice('garageSize','1','1-car')+choice('garageSize','2','2-car')+choice('garageSize','3','3-car')+choice('garageSize','other','Larger')}</div><label class="label">How full is it?</label><div class="choices cols4">${choice('fill','light','Light','Floor mostly open')+choice('fill','medium','Medium','Walkways remain')+choice('fill','full','Full','Little open floor')+choice('fill','packed','Packed','Stacked / no paths')}</div></section>`,
()=>title('Scope','What stays, what leaves, and what could slow the job','Record only what the crew needs to execute safely and correctly.')+`<section class="panel"><h2>Sorting plan</h2><label class="label">How will keep/remove decisions happen?</label><div class="choices cols2">${choice('sortMethod','customer','Customer sorts with crew')+choice('sortMethod','labels','Customer labels before arrival')+choice('sortMethod','zones','Crew stages keep / donate / haul zones')+choice('sortMethod','remove_all','Everything goes')}</div><div class="grid2">${area('Important keep items','keepNotes','Valuables, heirlooms, or anything the crew must protect')}${area('Remove / donate notes','removeNotes','Donation preferences or items that need confirmation')}${area('Known valuables','valuables','Tools, documents, family items, or “ask before touching”')}</div></section><section class="panel"><h2>Special handling</h2><div class="check-grid">${['Mattress','Refrigerator / freezer','Tires','Paint / chemicals','Electronics','Appliances','Piano / safe','Very heavy items'].map(x=>choice('special',x,x,'',true).replace('choice ','check ')).join('')}</div><label class="label">Hazards seen</label><div class="check-grid">${['Mold / moisture','Pest waste','Unstable stacks','Blocked panel / heater','Sharp material','No visible hazards'].map(x=>choice('hazards',x,x,'',true).replace('choice ','check ')).join('')}</div></section><section class="panel"><h2>Access</h2><div class="check-grid">${['Long carry','Stairs','Narrow gate / alley','HOA / access restriction','Trailer can park at garage','Customer will not be home'].map(x=>choice('access',x,x,'',true).replace('choice ','check ')).join('')}</div><div class="grid2">${input('Estimated truckloads','loads','number','1.5','min="0.5" step="0.5"')}${input('Truck placement / carry distance','truckPlacement','text','Driveway, curb, alley…')}${area('Access notes','accessNotes','Codes, pets, clearance, parking limits…')}</div></section>`,
()=>title('Finish','Choose the finished result','Use the photos to show the difference, then select only what the customer wants included. The estimate updates in the background.')+`<div class="before-after"><figure><img src="/images/garage-before.jpg" alt="Garage before an EGC transformation" width="1200" height="1200"><figcaption>BEFORE</figcaption></figure><figure><img src="/images/garage-after.jpg" alt="Garage after an EGC transformation" width="1200" height="1200"><figcaption>AFTER</figcaption></figure></div><section class="panel"><h2>Work to include</h2><p>Cleanout, basic organization with what they own, and a sweep are the baseline.</p><div class="service-grid"><button type="button" class="service on" disabled><img src="/images/job-before-after-1.jpg" alt="Garage cleanout" width="1646" height="615"><div><strong>Cleanout + reset</strong><span>Sort, haul, donate, organize what stays, sweep</span></div></button><button type="button" class="service ${S.finish.includes('deep_clean')?'on':''}" onclick="pick('finish','deep_clean',true)"><img src="/images/upsell-deepclean.jpg" alt="Deep garage cleaning" width="800" height="800"><div><strong>Deep clean</strong><span>Degrease, dust, ledges, and detailed floor clean</span></div></button><button type="button" class="service ${S.finish.includes('shelving')?'on':''}" onclick="pick('finish','shelving',true)"><img src="/images/shelf-metal.png" alt="Installed garage shelving" width="100" height="100"><div><strong>Add shelving</strong><span>Installed and loaded as part of the reset</span></div></button><button type="button" class="service ${S.finish.includes('totes')?'on':''}" onclick="pick('finish','totes',true)"><img src="/images/upsell-totes.jpg" alt="Garage storage totes" width="800" height="800"><div><strong>Add labeled totes</strong><span>27-gallon totes grouped by zone</span></div></button></div>${S.finish.includes('shelving')?`<div class="conditional"><label class="label">Shelving type</label><div class="choices cols2">${choice('shelfType','metal','Metal')+choice('shelfType','wood','Wood + metal')+choice('shelfType','plastic','Plastic')}</div><label class="label">How many shelving units?</label><div class="qty-row"><button type="button" onclick="qty('shelfQty',-1)">−</button><strong>${S.shelfQty}</strong><button type="button" onclick="qty('shelfQty',1)">+</button></div></div>`:''}${S.finish.includes('totes')?`<div class="conditional"><label class="label">How many totes?</label><div class="qty-row"><button type="button" onclick="qty('toteQty',-1)">−</button><strong>${S.toteQty}</strong><button type="button" onclick="qty('toteQty',1)">+</button></div></div>`:''}</section>`,
()=>title('Schedule','Put the job on the EGC schedule','The Walkthrough estimates the work, then checks the Hub and HighLevel for the next openings that actually fit.')+scheduleScreen(),
()=>title('Review','Confirm once and create the job brief','Approve one consolidated handoff. It becomes the internal notes, client-specific crew checks, schedule, and HighLevel record.')+reviewScreen()
];

function reviewScreen(){const price=recommend(),jobMinutes=estimatedJobMinutes(),shiftHours=(jobMinutes+90)/60;if(!S.lockedPrice)S.lockedPrice=String(price);const finish=['Cleanout + reset',S.finish.includes('deep_clean')?'Deep clean':'',S.finish.includes('shelving')?`${S.shelfQty} ${S.shelfType} shelving unit${S.shelfQty===1?'':'s'}`:'',S.finish.includes('totes')?`${S.toteQty} labeled totes`:''].filter(Boolean).join(', '),instructions=buildJobInstructions({sent_at:new Date().toISOString()}),checks=buildClientChecklists(instructions);return`<div class="review"><section class="panel summary"><div class="sum-row"><b>Customer</b><span>${esc(S.name)} · ${esc(S.address)}</span></div><div class="sum-row"><b>Goal</b><span>${esc(S.outcome)}</span></div><div class="sum-row"><b>Garage</b><span>${esc(S.garageSize)}-car · ${esc(S.fill)} · about ${esc(S.loads)} truckload(s) · ${PHOTO_COUNT} photos</span></div><div class="sum-row"><b>Sort</b><span>${esc(S.sortMethod.replaceAll('_',' '))}${S.keepNotes?' · '+esc(S.keepNotes):''}</span></div><div class="sum-row"><b>Special / hazards</b><span>${esc([...S.special,...S.hazards].join(', ')||'None recorded')}</span></div><div class="sum-row"><b>Finish</b><span>${esc(finish)}</span></div><div class="sum-row"><b>Schedule</b><span>${esc(S.jobDate)} · ${esc(S.startTime)}–${esc(S.endTime)} · ${esc(S.assignedTo||`crew of ${S.crewSize}`)} · ${durationText(jobMinutes)} job / ${shiftHours.toFixed(1)} hr crew shift</span></div><div class="sum-row"><b>Internal notes</b><span>${esc(S.notes||'No extra note')}</span></div><div class="sum-row"><b>Generated handoff</b><span>1 internal job brief · ${checks.preJob.length} client pre-job checks · ${checks.postJob.length} client post-job checks</span></div><div class="approve"><input id="approved" type="checkbox" ${S.approved?'checked':''} onchange="setApproval(this.checked)"><label for="approved">The homeowner confirms the written scope, locked flat rate, and that only approved items will be removed.</label></div><label class="label">Homeowner signature</label><canvas class="signature" id="signature"></canvas><div class="sig-tools"><button type="button" onclick="clearSignature()">Clear signature</button></div></section><aside class="price-card"><div class="eyebrow">Recommended flat rate</div><div class="price">${money(price)}</div><p>The rate was built in the background from the documented work. Change it only when the real scope calls for it.</p><label class="label" for="locked-price">Final flat rate</label><input class="field" id="locked-price" type="number" inputmode="decimal" value="${esc(S.lockedPrice)}" oninput="updateField('lockedPrice',this.value)"><div class="send-grid"><button class="save-btn" onclick="sendHighLevel(this)">Save brief + schedule</button></div><div class="send-status" id="send-status">One save creates the Hub job, internal notes, client checklists, HighLevel note, appointment, and confirmation workflow.</div></aside></div>`}
function qty(key,d){invalidateAcceptance();if(!S.priceManuallySet)S.lockedPrice='';S[key]=Math.max(0,Number(S[key]||0)+d);save();render()}
function recommend(){const size={1:450,2:650,3:850,other:1100}[S.garageSize]||650,fill={light:.75,medium:1,full:1.35,packed:1.7}[S.fill]||1;let n=size*fill;const stated=Number(S.loads||0)*500;if(stated)n=Math.max(n,stated);n+=S.special.reduce((a,x)=>a+({'Mattress':45,'Refrigerator / freezer':60,'Tires':50,'Paint / chemicals':45,'Electronics':25,'Appliances':40,'Piano / safe':150,'Very heavy items':100}[x]||0),0);if(S.access.includes('Long carry'))n+=75;if(S.access.includes('Stairs'))n+=125;if(S.finish.includes('deep_clean'))n+=({1:125,2:220,3:320,other:420}[S.garageSize]||220);if(S.finish.includes('shelving'))n+=S.shelfQty*({metal:499,wood:449,plastic:349}[S.shelfType]||499);if(S.finish.includes('totes'))n+=S.toteQty*21.5;return Math.max(450,Math.round(n/25)*25)}
function estimatedJobMinutes(){const loads=Math.max(.5,Number(S.loads||1));let minutes=60+loads*90+({light:0,medium:30,full:60,packed:120}[S.fill]||30);minutes+=(Array.isArray(S.special)?S.special.length:0)*15;if(S.access.includes('Long carry'))minutes+=30;if(S.access.includes('Stairs'))minutes+=30;if(S.finish.includes('deep_clean'))minutes+=({1:60,2:90,3:120,other:150}[S.garageSize]||90);if(S.finish.includes('shelving'))minutes+=Number(S.shelfQty||0)*30;if(S.finish.includes('totes'))minutes+=Number(S.toteQty||0)*4;minutes*=2/Math.max(1,Number(S.crewSize||2));return Math.min(540,Math.max(120,Math.ceil(minutes/30)*30))}
function durationText(minutes){const hours=Number(minutes||0)/60;return Number.isInteger(hours)?`${hours} hours`:`${hours.toFixed(1)} hours`}
function slotResults(){if(SLOT_LOADING)return'<div class="slot-message">Checking the Hub, crew time off, and HighLevel…</div>';if(SLOT_ERROR)return`<div class="slot-message slot-error">${esc(SLOT_ERROR)}</div>`;if(!SLOT_OPTIONS.length)return'<div class="slot-message">Finding the next 3 openings…</div>';return`<div class="slot-list">${SLOT_OPTIONS.map((slot,i)=>`<button type="button" class="slot ${S.jobDate===slot.date&&S.startTime===slot.start?'selected':''}" onclick="chooseSlot(${i})"><strong>${esc(slot.label)}</strong><span>${esc(slot.start)}–${esc(slot.end)}</span></button>`).join('')}</div>`}
function scheduleScreen(){const minutes=estimatedJobMinutes(),shiftHours=(minutes+90)/60;return`<section class="panel duration-card"><div><div class="eyebrow">Estimated job time</div><h2>${durationText(minutes)}</h2><p>Based on truckloads, fullness, access, add-ons, and a ${esc(S.crewSize)}-person crew. Employees see ${shiftHours.toFixed(1)} expected hours after the 1.5-hour travel and dump allowance.</p></div><button type="button" onclick="findNearestSlots(true)">Refresh openings</button><div class="slot-finder"><strong>Next 3 openings</strong>${slotResults()}</div></section><section class="panel"><h2>Schedule details</h2><p>Choose an opening above or set the appointment manually.</p><div class="grid3">${input('Job date','jobDate','date')}${input('Arrival start','startTime','time')}${input('Arrival end','endTime','time')}${input('Assigned crew / lead','assignedTo','text','Zac + Tyler')}<div><label class="label">Crew size</label><select class="field" onchange="updateField('crewSize',this.value);findNearestSlots(true)">${['1','2','3','4'].map(x=>`<option ${S.crewSize===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="schedule-help">Enter the crew or lead before refreshing to factor that employee’s blocked calendar time into the openings.</div>${area('Internal customer / job notes','notes','Anything the crew must know before arrival')}</section><section class="panel"><h2>Confirm the handoff aloud</h2><p>Repeat back what stays, what leaves, the finished result, the arrival window, and the rule that nothing leaves without approval.</p></section>`}

function validateStep(step=index){const miss=[];if(step===0){if(!S.name)miss.push('customer name');if(!S.phone)miss.push('mobile number');if(!S.whyNow)miss.push('why now');if(!S.outcome)miss.push('desired result')}if(step===1){if(PHOTO_COUNT<3)miss.push('at least 3 photos');if(!S.fill)miss.push('fullness')}if(step===2){if(!S.sortMethod)miss.push('sorting plan');if(!S.loads)miss.push('estimated truckloads');if(!S.truckPlacement)miss.push('truck placement')}if(step===4){if(!S.jobDate||!S.startTime||!S.endTime)miss.push('job date and arrival window');if(!S.assignedTo)miss.push('assigned crew or lead');if(S.startTime&&S.endTime&&timeMins(S.endTime)<=timeMins(S.startTime))miss.push('an end time after the start')}return miss}
function validate(){return validateStep(index)}
function move(d){if(d>0){const m=validate();if(m.length){error='Add '+m.join(', ')+' before continuing.';render();return}}error='';index=Math.max(0,Math.min(sections.length-1,index+d));save();render();scrollTo({top:0,behavior:'smooth'})}
function jump(i){if(i<=index){index=i;error='';save();render()}}
function render(){$('steps').innerHTML=sections.map((x,i)=>`<button class="${i===index?'on':i<index?'done':''}" onclick="jump(${i})">${i<index?'✓ ':''}${x}</button>`).join('');$('screen').innerHTML=screens[index]()+ (error?`<div class="required">${esc(error)}</div>`:'');$('back').style.visibility=index?'visible':'hidden';$('next').style.display=index===sections.length-1?'none':'block';$('customer-label').textContent=S.name||'New customer';if(index===1)mountPhotos();if(index===4&&!SLOT_LOADING&&SLOT_SIGNATURE!==slotSignature())setTimeout(()=>findNearestSlots(),0);if(index===5)setTimeout(initSignature)}

function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('egc_photos',1);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('p')){const st=db.createObjectStore('p',{keyPath:'id'});st.createIndex('job','job',{unique:false})}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function photoList(){if(!S.jobId)S.jobId=uid();const db=await dbOpen();return new Promise(res=>{const out=[],tx=db.transaction('p','readonly');tx.objectStore('p').index('job').openCursor(IDBKeyRange.only(S.jobId)).onsuccess=e=>{const c=e.target.result;if(c){if(c.value.tag==='before')out.push(c.value);c.continue()}else res(out.sort((a,b)=>a.at-b.at))}})}
async function markPhotoUploaded(id){const db=await dbOpen();await new Promise(res=>{const tx=db.transaction('p','readwrite'),st=tx.objectStore('p'),g=st.get(id);g.onsuccess=()=>{const v=g.result;if(v){v.uploaded=true;st.put(v)}};tx.oncomplete=res;tx.onerror=res})}
async function syncWalkthroughPhotos(){const all=await photoList(),key=`egc_drive_${S.jobId}`;let folderUrl=S.photoDriveUrl||localStorage.getItem(key)||'';if(!all.length)return{status:'none',folderUrl};const todo=all.filter(x=>!x.uploaded);if(!todo.length)return{status:folderUrl?'synced':'device_only',folderUrl};for(let i=0;i<todo.length;i+=6){const batch=todo.slice(i,i+6),r=await EGCHubAuth.fetch('/api/drive-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jobId:S.jobId,label:[S.jobDate,S.name,S.address].filter(Boolean).join(' — '),photos:batch.map(x=>({id:x.id,tag:'before',dataUrl:x.dataUrl}))})}),j=await r.json().catch(()=>({}));if(r.status===501)return{status:'needs_setup',folderUrl};if(!r.ok||!j.ok)throw new Error(j.error||'photo upload failed');folderUrl=j.folderUrl||folderUrl;for(const id of j.uploaded||[])await markPhotoUploaded(id)}S.photoDriveUrl=folderUrl;if(folderUrl)localStorage.setItem(key,folderUrl);return{status:'synced',folderUrl}}
async function fileData(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height,s=Math.min(1,1600/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',.82));URL.revokeObjectURL(img.src)};img.onerror=rej;img.src=URL.createObjectURL(file)})}
async function addPhotos(input){invalidateAcceptance();if(!S.jobId)S.jobId=uid();const db=await dbOpen();for(const f of Array.from(input.files||[])){const dataUrl=await fileData(f),tx=db.transaction('p','readwrite');tx.objectStore('p').put({id:uid(),job:S.jobId,tag:'before',dataUrl,at:Date.now()});await new Promise(res=>{tx.oncomplete=res;tx.onerror=res})}input.value='';await mountPhotos();save()}
async function removePhoto(id){invalidateAcceptance();const db=await dbOpen(),tx=db.transaction('p','readwrite');tx.objectStore('p').delete(id);await new Promise(res=>{tx.oncomplete=res;tx.onerror=res});mountPhotos();save()}
async function mountPhotos(){const el=$('photos');if(!el)return;const ps=await photoList();PHOTO_COUNT=ps.length;el.innerHTML=ps.map((p,i)=>`<div class="photo"><img src="${p.dataUrl}" alt="Walkthrough photo ${i+1}" width="1200" height="900" role="button" tabindex="0" onclick="viewPhoto(this.src)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();viewPhoto(this.src)}"><button type="button" onclick="removePhoto('${p.id}')" aria-label="Remove walkthrough photo ${i+1}">×</button></div>`).join('');const c=$('photo-count');if(c){c.className='photo-count '+(PHOTO_COUNT>=3?'good':'');c.textContent=PHOTO_COUNT+' photo'+(PHOTO_COUNT===1?'':'s')+' saved · '+(PHOTO_COUNT>=3?'Minimum captured · add every angle the crew will need':'Take at least 3')}}
async function refreshPhotoCount(){try{PHOTO_COUNT=(await photoList()).length;if(index===1||index===5)render()}catch(e){}}
function viewPhoto(src){$('viewer-img').src=src;$('viewer').classList.add('on')}

async function loadAppointments(){try{if(hubDb){const today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Denver',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),snap=await hubDb.collection('jobs').where('date','==',today).get();APPTS=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.type==='walkthrough'&&!['cancelled','completed'].includes(x.status)).sort((a,b)=>String(a.time).localeCompare(String(b.time)));if(REQUESTED_WALKTHROUGH_ID&&!APPTS.some(x=>x.id===REQUESTED_WALKTHROUGH_ID)){const requested=await hubDb.collection('jobs').doc(REQUESTED_WALKTHROUGH_ID).get();if(requested.exists){const row={id:requested.id,...requested.data()};if(row.type==='walkthrough')APPTS.unshift(row)}}}}catch(e){}if(index===0)render()}
function useAppointment(i,fromUrl=false){const a=APPTS[i];if(!a)return;if(S.sourceWalkthroughId!==a.id){save();resetForWalkthrough(a.id);restore(a.id)}S.sourceWalkthroughId=a.id;S.name=a.customer||a.name||S.name;S.phone=a.phone||S.phone;S.email=a.email||S.email;S.address=a.address||S.address;S.highlevelContactId=a.highlevelContactId||a.contactId||S.highlevelContactId;S.highlevelOpportunityId=a.highlevelOpportunityId||S.highlevelOpportunityId;S.highlevelAppointmentId=a.highlevelAppointmentId||S.highlevelAppointmentId;S.source=a.source||S.source;save();if(!fromUrl&&history.replaceState)history.replaceState(null,'',`?walkthroughId=${encodeURIComponent(a.id)}`);render()}
async function searchContacts(){const q=$('contact-search').value.trim(),out=$('lookup-results');if(q.length<2){out.innerHTML='<div class="note">Type at least 2 characters.</div>';return}out.innerHTML='<div class="note">Searching HighLevel…</div>';try{const r=await EGCHubAuth.fetch('/api/highlevel?view=contacts&q='+encodeURIComponent(q)),j=await r.json();if(!r.ok)throw 0;LOOK=j.contacts||[];out.innerHTML=LOOK.length?LOOK.map((c,i)=>`<button onclick="useContact(${i})"><strong>${esc(c.name)}</strong><small>${esc([c.phone,c.address].filter(Boolean).join(' · '))}</small></button>`).join(''):'<div class="note">No matching contact. Continue with manual entry.</div>'}catch(e){out.innerHTML='<div class="note">HighLevel is not connected. Continue with manual entry.</div>'}}
function useContact(i){const c=LOOK[i];if(!c)return;invalidateAcceptance();S.name=c.name||S.name;S.phone=c.phone||S.phone;S.email=c.email||S.email;S.address=c.address||S.address;S.highlevelContactId=c.id||S.highlevelContactId;save();render()}

function initSignature(){const c=$('signature');if(!c)return;const ratio=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*ratio;c.height=r.height*ratio;sigCtx=c.getContext('2d');sigCtx.scale(ratio,ratio);sigCtx.lineWidth=2.3;sigCtx.lineCap='round';sigCtx.strokeStyle='#172033';if(S.signature){const im=new Image();im.onload=()=>sigCtx.drawImage(im,0,0,r.width,r.height);im.src=S.signature}const pos=e=>{const q=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[p.clientX-q.left,p.clientY-q.top]};c.onpointerdown=e=>{draw=true;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(...p);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!draw)return;sigCtx.lineTo(...pos(e));sigCtx.stroke()};c.onpointerup=()=>{draw=false;S.signature=c.toDataURL('image/png');save()}}
