async function loadAppointments(){
  if(APPTS_LOADING)return false;
  APPTS_LOADING=true;APPTS_ERROR='';render();
  try{
    const query=new URLSearchParams({view:'walkthroughs'});if(REQUESTED_WALKTHROUGH_ID)query.set('walkthroughId',REQUESTED_WALKTHROUGH_ID);
    const response=await EGCHubAuth.fetch('/api/walkthrough-handoff?'+query,{cache:'no-store'}),data=await response.json().catch(()=>null);
    if(!response.ok||!data||data.ok!==true||!Array.isArray(data.walkthroughs)){const error=new Error('Walkthrough schedule unavailable');error.code=response.status===404?'WALKTHROUGH_NOT_FOUND':data?.code==='handoff_walkthrough_forbidden'?'WALKTHROUGH_FORBIDDEN':[401,403].includes(response.status)?'permission-denied':'unavailable';throw error}
    let requestedRow=null;

      requestedRow=data.requested&&data.requested.id===REQUESTED_WALKTHROUGH_ID?data.requested:null;
      if(!requestedRow||requestedRow.type!=='walkthrough'||['cancelled','completed'].includes(requestedRow.pipelineStatus||requestedRow.status)){const error=new Error('Walkthrough unavailable');error.code='WALKTHROUGH_NOT_FOUND';throw error}
    }
    const rows=data.walkthroughs.filter(x=>x&&x.type==='walkthrough'&&!['cancelled','completed'].includes(x.pipelineStatus||x.status)).sort((a,b)=>String(a.time).localeCompare(String(b.time)));
    if(requestedRow){const i=rows.findIndex(x=>x.id===requestedRow.id);if(i>=0)rows[i]=requestedRow;else rows.unshift(requestedRow)}
    APPTS=rows;
    if(requestedRow&&!walkthroughReady){resetForWalkthrough(requestedRow.id);restore(requestedRow.id);walkthroughReady=true;useAppointment(APPTS.findIndex(x=>x.id===requestedRow.id),true);refreshPhotoCount()}
    return true;
  }catch(error){
    APPTS=[];
