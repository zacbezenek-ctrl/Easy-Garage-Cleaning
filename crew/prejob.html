<style>

        --paper:#faf5ec;--khaki:#8a8170;--line:#d9cdb8;--ok:#2e7d4f;--r:14px}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--navy);padding-bottom:90px}
  .disp{font-family:'Oswald','Arial Narrow',sans-serif;text-transform:uppercase}

  #topbar{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;
          padding:max(env(safe-area-inset-top),12px) 18px 12px}
  #topbar .row{display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:0 auto}
  #brand{font-family:'Oswald';font-weight:700;font-size:14px;letter-spacing:.06em}
  #brand span{color:var(--orange)}
  #prog{font-family:'Oswald';font-weight:700;font-size:15px}
  #prog b{color:var(--orange)}
  #bar{height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin-top:8px;max-width:720px;margin-left:auto;margin-right:auto}
  #bar i{display:block;height:100%;background:var(--orange);border-radius:2px;width:0%;transition:width .2s}

  main{max-width:720px;margin:0 auto;padding:20px 18px}
  .eyebrow{font-family:'Oswald';font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--orange);text-transform:uppercase}
  h1{font-family:'Oswald';font-weight:700;font-size:clamp(28px,6vw,38px);text-transform:uppercase;line-height:1.05;margin:4px 0 14px}

  .jobcard{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:8px}

  .handoff .brief-head b{font-family:'Oswald';font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:#e8581c;padding:5px 9px;border-radius:99px;white-space:nowrap}
  .brief-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .brief-grid article{background:rgba(255,255,255,.08);padding:11px 12px;border-radius:10px;min-width:0}
  .brief-grid article.wide{grid-column:1/-1}.brief-grid small{display:block;color:#aeb8cc;font-family:'Oswald';font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
  .brief-grid strong{display:block;font-size:14px;line-height:1.4;overflow-wrap:anywhere}.brief-grid .danger{color:#ffb4ad}.brief-empty{color:#aeb8cc;font-size:14px;line-height:1.5}
  .client-checks{margin-top:20px}.client-checks .sechead{border-color:var(--orange)}.client-checks .item{background:#fff}.client-checks .item small{white-space:pre-line}.client-checks .client-tag{display:inline-block;background:var(--orange);color:#fff;border-radius:99px;padding:3px 8px;font-family:'Oswald';font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-left:7px;vertical-align:2px}
  @media(max-width:520px){.brief-grid{grid-template-columns:1fr}.brief-grid article.wide{grid-column:auto}}
  .jobcard .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label.fl{display:block;font-family:'Oswald';font-weight:600;font-size:11px;letter-spacing:.1em;
           text-transform:uppercase;color:var(--khaki);margin:8px 0 5px}
  input,select,textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;
    padding:12px 13px;font:inherit;font-size:16px;color:var(--navy)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--orange)}
  textarea{min-height:70px;resize:none}

  section{margin-top:26px}
  .sechead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2.5px solid var(--navy);padding-bottom:8px;margin-bottom:12px}

  .sechead .cnt{font-family:'Oswald';font-weight:600;font-size:13px;color:var(--khaki)}

  .when{font-family:'Oswald';font-size:11px;letter-spacing:.12em;color:var(--orange);text-transform:uppercase;margin-bottom:8px}

  .item{display:flex;gap:13px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);

            display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}

  .item.on .bx{background:var(--ok);border-color:var(--ok)}

  .item .tx small{display:block;font-weight:500;color:var(--khaki);font-size:13.5px;margin-top:2px;line-height:1.45}
  .item.crit{border-left:5px solid var(--orange)}

  .script{background:var(--navy);color:#fff;border-radius:var(--r);padding:16px 18px;margin:10px 0 14px}
  .script h4{font-family:'Oswald';font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--orange);
             text-transform:uppercase;margin-bottom:8px}
  .script p{font-size:15.5px;line-height:1.55;font-weight:500}
  .script p+p{margin-top:8px}
  .script i{color:#aeb8cc;font-style:normal;font-size:13.5px}
  .copybtn{margin-top:10px;background:var(--orange);border:none;color:#fff;font-family:'Oswald';font-weight:600;
           font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border-radius:9px;cursor:pointer}

  .lookrow{display:flex;gap:8px}
  .lookrow input{flex:1}
  .lookbtn{background:var(--navy);color:#fff;border:none;border-radius:10px;font-family:'Oswald';font-weight:600;
           font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;padding:0 13px;cursor:pointer;min-height:46px;white-space:nowrap}
  #lookout{margin-top:8px}
  .lkr{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;
       border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:7px;cursor:pointer}
  .lkr .nm{font-weight:600;font-size:14.5px}
  .lkr .nm small{display:block;font-weight:500;color:var(--khaki);font-size:12.5px}
  .lkr .go{font-family:'Oswald';font-weight:700;color:var(--orange);font-size:17px}
  .looknote{font-size:12.5px;color:var(--khaki);font-weight:500;margin-top:6px}
  /* inline item actions (photo / text / call / clock) */
  .item{flex-wrap:wrap}
  .itemact{flex-basis:100%;width:100%;margin-top:10px}
  .actbtn{background:var(--navy);color:#fff;border:none;border-radius:11px;font-family:'Oswald';font-weight:600;
          font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;padding:12px 16px;cursor:pointer;
          min-height:46px;display:inline-flex;align-items:center;gap:8px}
  .actbtn.alt{background:var(--orange)}
  .actbtn.done{background:var(--ok)}
  .acthint{font-size:12.5px;color:var(--khaki);font-weight:500;margin-top:6px}
  .photostrip{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
  .pthumb{position:relative;width:92px;height:92px;border-radius:12px;overflow:hidden;border:1.5px solid var(--line);background:#fff}
  .pthumb img{width:100%;height:100%;object-fit:cover;display:block}

  .padd{width:92px;height:92px;border-radius:12px;border:2px dashed var(--khaki);background:#fff;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;
        font-family:'Oswald';font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--khaki)}
  .padd span{font-size:23px;line-height:1}
  #pviewer{position:fixed;inset:0;z-index:9000;background:rgba(8,14,26,.92);display:none;align-items:center;justify-content:center;padding:16px}
  #pviewer.on{display:flex}

  #donebar{position:fixed;left:0;right:0;bottom:0;background:var(--cream);border-top:1.5px solid var(--line);

  #donebar .inner{max-width:720px;margin:0 auto}

           border:none;border-radius:var(--r);padding:17px;background:var(--line);color:var(--khaki);min-height:56px}
  #donebtn.ready{background:var(--orange);color:#fff;cursor:pointer}
</style>

<style>
  #egc-gate{position:fixed;inset:0;z-index:99999;background:#13203a;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Inter',system-ui,sans-serif}

  #egc-gate input{width:100%;box-sizing:border-box;background:#13203a;border:1.5px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:16px;padding:12px 13px;font-family:inherit}

  #egc-gate .gerr{display:none;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#fca5a5;border-radius:8px;padding:9px 12px;font-size:13px;margin-top:14px}
</style>
<div id="egc-gate">
  <div class="gcard">
    <div class="gpill">EGC Crew Tools</div>
    <h2>Crew Sign-In</h2>
    <p class="gsub">Use your employee portal username &amp; password.</p>
    <label for="gate-u">Username</label>
    <input type="text" id="gate-u" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="gate-p">Password</label>
    <input type="password" id="gate-p" autocomplete="current-password">
    <button class="gbtn" onclick="gateLogin()">Unlock</button>
    <div class="gerr" id="gate-err">Incorrect username or password.</div>
  </div>
</div>
<script>
/* SOFT GATE — keeps customers, bots, and casual snoops out of the field tools.
   It is NOT real authentication: the page source is public, so a determined
   reader can forge the token. For true protection put Cloudflare Access in
   front of /crew/* and /api/crew-hook (identity-checked at the edge).
   Auth mirrors /employee.html: salted SHA-256, same usernames & passwords.
   Sessions expire after GATE_TTL so a lost/left iPad re-locks itself.
   Rotate a password by updating the hash here AND in employee.html:
   sha256(username + ':' + newPass + ':egc-salt-2026') */
const GATE_USERS={
  ZacB:"6b8670f397174ff99440629b877581216a0b26b6770054be198988ff48a16861",
  TylerG:"28b50fd5ee98af8cf015972811def03dbc2eaff52997f82ecfc4342ece6cfa36",
  AlexK:"52e2e9901adc10406ad9597084ece4770d1c9fd0e3b76e1f31abf35f8030ac50",
  FrankJara:"ed2ed02c6f4db402e46a370902a0f19ae2539753d4c13288954ecb32b1253d70",
  JobberCrew:"a68121119b6a72c583c366a62257cbb3652867e9b50e46bdda6fb05280dee683"};
const GATE_TTL=12*60*60*1000; // 12h — covers a work day, bounds a lost device
async function gateSha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");}
function gateTok(u){return gateSha(u+":"+GATE_USERS[u]+":egc-session");}
function gateSet(u,t){const exp=String(Date.now()+GATE_TTL);
  try{for(const st of[sessionStorage,localStorage]){st.setItem("egc_u",u);st.setItem("egc_tok",t);st.setItem("egc_exp",exp);}}catch(e){}}
async function gateOk(){
  try{
    for(const st of[sessionStorage,localStorage]){
      const u=st.getItem("egc_u"),t=st.getItem("egc_tok"),exp=parseInt(st.getItem("egc_exp")||"0",10);
      if(u&&GATE_USERS[u]&&t&&t===await gateTok(u)){
        if(exp&&Date.now()<exp){gateSet(u,t);return u;} // valid → slide the window
        gateClear(); // token ok but expired (or pre-expiry session) → require re-login
      }
    }
  }catch(e){}
  return null;
}
function gateClear(){try{["egc_u","egc_tok","egc_exp"].forEach(k=>{sessionStorage.removeItem(k);localStorage.removeItem(k);});}catch(e){}}
async function gateLogin(){
  const u=document.getElementById("gate-u").value.trim(),p=document.getElementById("gate-p").value;
  if(GATE_USERS[u]&&await gateSha(u+":"+p+":egc-salt-2026")===GATE_USERS[u]){
    gateSet(u,await gateTok(u));
    document.getElementById("egc-gate").classList.add("off");
  }else document.getElementById("gate-err").style.display="block";
}
function gateLock(){gateClear();location.reload();}
gateOk().then(u=>{
  if(u){document.getElementById("egc-gate").classList.add("off");return;}
  document.getElementById("gate-p").addEventListener("keydown",e=>{if(e.key==="Enter")gateLogin()});
  document.getElementById("gate-u").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("gate-p").focus()});
});
</script>

const STARTKEY="egc_prejob_start";
const textList=v=>Array.isArray(v)?v.filter(Boolean).join(', '):String(v||'');
function normalizedInstructions(job={}){const s=job.scope||{},l=job.logistics||{},d=job.discovery||{},i=job.jobInstructions||job.instructions||{};return{customerGoal:i.customerGoal||d.success||'',whyNow:i.whyNow||d.why_now||job.walkthroughNotes||job.pain||'',sortMethod:i.sortMethod||s.sort_method||'',keepItems:i.keepItems||s.keep_items||'',removeItems:i.removeItems||s.remove_items||s.keep_remove||'',exclusions:i.exclusions||s.exclusions||'',hazards:i.hazards||s.hazards||[],access:i.access||s.access||l.access||[],accessNotes:i.accessNotes||l.notes||'',truckPlacement:i.truckPlacement||l.truck_placement||s.truck_placement||'',specialItems:i.specialItems||s.special_items||[],finish:i.finish||s.finish||[],shelving:i.shelving||{type:s.finish_details?.shelf_type||'',qty:Number(s.finish_details?.shelf_qty||0)},totes:i.totes||{qty:Number(s.finish_details?.tote_qty||0)},customerNotes:i.customerNotes||job.customerNotesSummary||job.notes||'',assignedTo:i.assignedTo||job.assignedTo||'',crewSize:Number(i.crewSize||job.crewSize||0),arrivalWindow:i.arrivalWindow||[job.time,job.endTime].filter(Boolean).join('–'),photoCount:Number(i.photoCount||job.photoCount||job.photosBefore||0)}}
function renderJobBrief(){const host=document.getElementById('job-brief');if(!host)return;const i=normalizedInstructions(ACTIVE),has=Object.values(i).some(v=>Array.isArray(v)?v.length:Boolean(v&&typeof v!=='object'));if(!has){host.innerHTML='<div class="brief-head"><div><span>Walkthrough handoff</span><h2>Internal job brief</h2></div><b>Needs brief</b></div><p class="brief-empty">No walkthrough instructions are attached yet. Stop and confirm the scope with the manager before the truck rolls.</p>';return}const row=(label,value,cls='')=>value?`<article class="${cls}"><small>${esc(label)}</small><strong>${esc(textList(value))}</strong></article>`:'';const materials=[i.shelving?.qty?`${i.shelving.qty} ${i.shelving.type||''} shelf unit(s)`:'' ,i.totes?.qty?`${i.totes.qty} tote(s)`:'' ].filter(Boolean).join(' · ');host.innerHTML=`<div class="brief-head"><div><span>One source · synced from walkthrough</span><h2>Internal job brief</h2></div><b>Read first</b></div><div class="brief-grid">${row('Customer goal',i.customerGoal,'wide')}${row('Why now',i.whyNow,'wide')}${row('Keep — protect these',i.keepItems)}${row('Remove',i.removeItems)}${row('Do not move / exclusions',i.exclusions,'danger')}${row('Hazards / PPE',i.hazards,'danger')}${row('Access',textList(i.access)+(i.accessNotes?` — ${i.accessNotes}`:''))}${row('Truck placement',i.truckPlacement)}${row('Special handling',i.specialItems)}${row('Finish',i.finish)}${row('Materials',materials)}${row('Crew + arrival',[i.assignedTo,i.crewSize?`${i.crewSize} needed`:'',i.arrivalWindow].filter(Boolean).join(' · '))}${row('Internal customer notes',i.customerNotes,'wide')}${row('Walkthrough photos',i.photoCount?`${i.photoCount} captured on walkthrough device`:'Not cloud-synced','wide')}</div>`}
function fallbackClientItems(){const i=normalizedInstructions(ACTIVE),out=[],add=(id,label,detail,critical=false)=>{if(detail)out.push({id,label,detail:String(detail),critical})};add('goal','Repeat the promised outcome to the crew',i.customerGoal,true);add('keep','Identify and protect every keep item',i.keepItems,true);add('remove','Reconfirm the approved removal / donation scope',i.removeItems,true);add('exclusions','Mark every do-not-touch item',i.exclusions,true);add('hazards','Set the client-specific PPE and hazard plan',textList(i.hazards),true);add('access','Set access and staging exactly as planned',[textList(i.access),i.accessNotes,i.truckPlacement].filter(Boolean).join(' · '));add('special','Load equipment for special-handling items',textList(i.specialItems));add('notes','Review the internal customer notes',i.customerNotes);return out}
function clientItems(){const saved=ACTIVE.clientChecklists?.preJob;return Array.isArray(saved)&&saved.length?saved:fallbackClientItems()}
function clientKey(item){return'client_'+String(item.id||item.label).replace(/[^a-z0-9_-]/gi,'_')}
function renderClientChecklist(){const host=document.getElementById('client-checklist'),items=clientItems();if(!host)return;if(!items.length){host.innerHTML='';return}const done=items.filter(it=>clientState[clientKey(it)]).length;host.innerHTML=`<section class="client-checks"><div class="when">Generated from this client’s walkthrough</div><div class="sechead ${done===items.length?'done':''}"><h2>Client-specific checks <span class="client-tag">${items.length} for this job</span></h2><span class="cnt">${done}/${items.length}</span></div>${items.map(it=>`<div class="item ${clientState[clientKey(it)]?'on':''} ${it.critical?'crit':''}" onclick="togClient('${clientKey(it)}')"><span class="bx"></span><div class="tx">${esc(it.label)}<small>${esc(it.detail||'')}</small></div></div>`).join('')}</section>`}
function standardDone(){return SECTIONS.reduce((n,sec,si)=>n+sec.items.filter((_,ii)=>state[key(si,ii)]).length,0)}
function totalDone(){return standardDone()+clientItems().filter(it=>clientState[clientKey(it)]).length}
function totalChecks(){return SECTIONS.reduce((a,s)=>a+s.items.length,0)+clientItems().length}
function progressIdentity(){return sessionStorage.getItem('egc_u')||localStorage.getItem('egc_u')||''}
function progressPayload(){const standardItems=SECTIONS.flatMap((sec,si)=>sec.items.map((it,ii)=>({key:key(si,ii),label:it.t,completed:Boolean(state[key(si,ii)])}))),specificItems=clientItems().map(it=>({id:it.id,label:it.label,detail:it.detail||'',completed:Boolean(clientState[clientKey(it)])})),completedCount=standardItems.filter(x=>x.completed).length+specificItems.filter(x=>x.completed).length,totalCount=standardItems.length+specificItems.length;return{completedCount,totalCount,percent:totalCount?Math.round(completedCount/totalCount*100):0,updatedAt:new Date().toISOString(),updatedBy:progressIdentity(),standardItems,clientItems:specificItems}}
function restoreSharedProgress(progress){if(!progress)return;(progress.standardItems||[]).forEach(item=>{if(item.key)state[item.key]=Boolean(item.completed)});(progress.clientItems||[]).forEach(item=>{clientState[clientKey(item)]=Boolean(item.completed)})}
function queueProgressSave(){if(!HUBDB||!ACTIVE.jobId)return;clearTimeout(progressTimer);progressTimer=setTimeout(async()=>{const snapshot=progressPayload();await HUBDB.collection('jobs').doc(ACTIVE.jobId).set({preJobProgress:snapshot,updatedAt:snapshot.updatedAt},{merge:true}).catch(()=>{})},600)}
function togClient(k){clientState[k]=!clientState[k];render();saveAll();queueProgressSave()}

/* ===== Per-job photos — on-device (IndexedDB), shared with the Game Plan/Post-Job
   tools via the egc_active_job jobId. Job-day "before" capture lives here. ===== */
function jobKey(){return ACTIVE.jobId||"prejob_"+((document.getElementById("j_name").value||"unknown").toLowerCase().replace(/\s+/g,"_"));}
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open("egc_photos",1);
  r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains("p")){
    const s=db.createObjectStore("p",{keyPath:"id"});s.createIndex("job","job",{unique:false});}};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function photoAdd(job,tag,dataUrl){const db=await idbOpen();return new Promise((res,rej)=>{
  const tx=db.transaction("p","readwrite");const id=uid();
  tx.objectStore("p").put({id,job,tag,dataUrl,at:Date.now()});tx.oncomplete=()=>res(id);tx.onerror=()=>rej(tx.error);});}
async function photoDel(id){const db=await idbOpen();return new Promise(res=>{
  const tx=db.transaction("p","readwrite");tx.objectStore("p").delete(id);tx.oncomplete=()=>res();tx.onerror=()=>res();});}
async function photoList(job,tag){const db=await idbOpen();return new Promise(res=>{
  const tx=db.transaction("p","readonly");const out=[];
  tx.objectStore("p").index("job").openCursor(IDBKeyRange.only(job)).onsuccess=e=>{const c=e.target.result;
    if(c){if(!tag||c.value.tag===tag)out.push(c.value);c.continue();}else res(out.sort((a,b)=>a.at-b.at));};});}
function fileToDataUrl(file,max=1600,q=0.82){return new Promise((res,rej)=>{const img=new Image();
  img.onload=()=>{let w=img.width,h=img.height;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
    res(cv.toDataURL("image/jpeg",q));};img.onerror=rej;img.src=URL.createObjectURL(file);});}
function viewPhoto(src){const v=document.getElementById("pviewer");document.getElementById("pviewerimg").src=src;v.classList.add("on");}

/* ===== Inline item actions ===== */
function actId(si,ii){return "act_"+si+"_"+ii;}
async function mountActions(){
  for(let si=0;si<SECTIONS.length;si++){for(let ii=0;ii<SECTIONS[si].items.length;ii++){
    const it=SECTIONS[si].items[ii]; if(!it.act) continue;
    const el=document.getElementById(actId(si,ii)); if(!el) continue;
    if(it.act.type==="photo") await mountPhotoAct(el,it.act);
    else if(it.act.type==="sms") el.innerHTML=`<button class="actbtn alt" onclick="event.stopPropagation();smsCustomer(${si},${ii})">💬 Text the customer</button>`;
    else if(it.act.type==="call") el.innerHTML=`<button class="actbtn" onclick="event.stopPropagation();callOffice()">📞 Call office</button>`;
    else if(it.act.type==="clock"){const t=localStorage.getItem(STARTKEY);
      el.innerHTML=t?`<button class="actbtn done" onclick="event.stopPropagation();logStart()">⏱️ Started ${esc(t)} — tap to reset</button>`
                     :`<button class="actbtn" onclick="event.stopPropagation();logStart()">⏱️ Log start time now</button>`;}
  }}
}
async function mountPhotoAct(el,act){
  let photos=[]; try{photos=await photoList(jobKey(),act.tag);}catch(e){}
  el.innerHTML=`<div class="photostrip">
    <label class="padd"><span>+</span>${esc(act.label||"Add photo")}
      <input type="file" accept="image/*" capture="environment" style="display:none" onchange="onActPhoto(this,'${act.tag}')"></label>
    ${photos.map(p=>`<div class="pthumb"><img src="${p.dataUrl}" onclick="viewPhoto(this.src)">
      <button class="del" onclick="onActPhotoDel('${p.id}')">×</button></div>`).join("")}</div>`;
}
async function onActPhoto(input,tag){const f=input.files&&input.files[0]; if(!f) return;
  try{const url=await fileToDataUrl(f);await photoAdd(jobKey(),tag,url);}catch(e){}
  input.value="";mountActions();}
async function onActPhotoDel(id){await photoDel(id);mountActions();}
function custPhoneDigits(){return String(ACTIVE.phone||"").replace(/\D/g,"");}
function smsCustomer(si,ii){
  const it=SECTIONS[si].items[ii];
  const name=(document.getElementById("j_name").value||"").split(" ")[0]||"there";
  const rate=document.getElementById("j_rate").value||"[RATE]";
  const body=String(it.act.body||"").replaceAll("[NAME]",name).replaceAll("[RATE]",rate);
  const num=custPhoneDigits();
  location.href="sms:"+num+"&body="+encodeURIComponent(body);
}
function callOffice(){location.href="tel:"+BIZPHONE;}
function logStart(){const now=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  localStorage.setItem(STARTKEY,now);mountActions();}

/* ===== HighLevel contact lookup (read-only, via /api/highlevel) ===== */
let LOOK=[];
async function highlevelLookup(){
  const out=document.getElementById("lookout"); if(!out) return;
  const q=(document.getElementById("j_name").value||"").trim();
  if(q.length<2){out.innerHTML=`<div class="looknote">Type at least 2 letters of the name first, then tap 🔍.</div>`;return;}
  out.innerHTML=`<div class="looknote">Searching HighLevel…</div>`;
  try{
    const res=await fetch("/api/highlevel?view=contacts&q="+encodeURIComponent(q));
    const j=await res.json().catch(()=>({}));
    if(res.status===501){out.innerHTML=`<div class="looknote">HighLevel needs its API key and location ID. Type the details manually for now.</div>`;return;}
    if(!res.ok||!j.ok){out.innerHTML=`<div class="looknote">Lookup failed — type it manually.</div>`;return;}
    LOOK=j.contacts||[];
    out.innerHTML=LOOK.length?LOOK.map((c,i)=>`<div class="lkr" onclick="lookPick(${i})">
        <div class="nm">${esc(c.name)}<small>${esc([c.address,c.phone].filter(Boolean).join(" · "))}</small></div>
        <span class="go">→</span></div>`).join("")
      :`<div class="looknote">No HighLevel opportunity match for “${esc(q)}”.</div>`;
  }catch(e){out.innerHTML=`<div class="looknote">Lookup unreachable — type it manually.</div>`;}
}
function lookPick(i){
  const c=LOOK[i]; if(!c) return;
  if(c.name)document.getElementById("j_name").value=c.name;
  if(c.address)document.getElementById("j_addr").value=c.address;
  if(c.phone)ACTIVE.phone=ACTIVE.phone||c.phone;
  ACTIVE.highlevelContactId=ACTIVE.highlevelContactId||c.id||"";
  LOOK=[];document.getElementById("lookout").innerHTML="";saveAll();
}
function saveAll(){
  try{const f={};FIELD_IDS.forEach(id=>{const el=document.getElementById(id);if(el)f[id]=el.value;});
    localStorage.setItem(saveKey(),JSON.stringify({state:state,clientState:clientState,fields:f}));}catch(e){}
}
function restoreAll(){
  try{const d=JSON.parse(localStorage.getItem(saveKey()));
    if(d){Object.assign(state,d.state||{});Object.assign(clientState,d.clientState||{});
      FIELD_IDS.forEach(id=>{const el=document.getElementById(id);if(el&&d.fields&&d.fields[id]!=null)el.value=d.fields[id];});}
  }catch(e){}
  // pull from Game Plan handoff if fields still empty
  try{const a=JSON.parse(localStorage.getItem("egc_active_job"));
    if(a)ACTIVE=a;
    if(a&&a.name&&!document.getElementById("j_name").value){
      // Flat rate field carries the LOCKED TOTAL (package + upgrades) — that's the
      // number the customer signed off on, so the confirmation script quotes it right.
      const lockedTotal=(a.total!=null&&a.total!=="")?a.total:(a.rate||"");
      document.getElementById("j_name").value=a.name||"";
      document.getElementById("j_addr").value=a.addr||"";
      document.getElementById("j_date").value=a.jobdate||"";
      document.getElementById("j_rate").value=lockedTotal;
      document.getElementById("j_pkg").value=(a.pkg||"")+(a.upsellsPriced?" + "+a.upsellsPriced:(a.upsells?" + "+a.upsells:""));
      const stale=a.savedAt&&(Date.now()-new Date(a.savedAt).getTime())>14*864e5;
      const b=document.createElement("div");
      b.style.cssText="background:#13203a;color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:14px;font-family:Oswald;font-weight:600;font-size:14px;letter-spacing:.03em";
      b.innerHTML="LOADED FROM GAME PLAN: <span style='color:#e8581c'>"+esc((a.name||"").toUpperCase())+"</span>"+(a.addr?" — "+esc(a.addr):"")+
        (lockedTotal?"<div style='font-family:Inter;font-weight:500;font-size:13px;margin-top:4px;color:#aeb8cc'>Locked total: $"+esc(lockedTotal)+(a.deposit?" · deposit $"+esc(a.deposit):"")+"</div>":"")+
        (stale?"<div style='font-family:Inter;font-weight:600;font-size:12px;margin-top:6px;color:#fca5a5'>⚠ This handoff is over 2 weeks old — confirm it's the right job.</div>":"");
      const card=document.querySelector(".jobcard");card.parentNode.insertBefore(b,card);
      saveAll();
    }}catch(e){}
}
function key(si,ii){return si+"_"+ii;}
function render(){
  document.getElementById("sections").innerHTML = SECTIONS.map((sec,si)=>{
    const done=sec.items.filter((_,ii)=>state[key(si,ii)]).length;
    return `<section>
      <div class="when">${sec.when}</div>
      <div class="sechead ${done===sec.items.length?'done':''}">
        <h2>${sec.title}</h2><span class="cnt">${done}/${sec.items.length}</span></div>
      ${sec.items.map((it,ii)=>`
        <div class="item ${state[key(si,ii)]?'on':''} ${it.crit?'crit':''}" onclick="tog(${si},${ii})">
          <span class="bx"></span>
          <div class="tx">${it.t}${it.s?`<small>${it.s}</small>`:""}</div>
          ${it.act?`<div class="itemact" id="${actId(si,ii)}" onclick="event.stopPropagation()"></div>`:""}
        </div>`).join("")}
      ${sec.script?`<div class="script"><h4>${sec.script.h}</h4>${sec.script.p.map(p=>`<p>${p}</p>`).join("")}
        <button class="copybtn" onclick="event.stopPropagation();copyScript(${si})">Copy text</button></div>`:""}
    </section>`;
  }).join("");
  setTimeout(mountActions,0);
  renderClientChecklist();
  const total=totalChecks();
  const done=totalDone();
  document.getElementById("pc").textContent=done;
  document.getElementById("pt").textContent="/"+total+" DONE";
  document.getElementById("barfill").style.width=(100*done/total)+"%";
  const btn=document.getElementById("donebtn");
  if(done===total){btn.classList.add("ready");btn.textContent="All checks complete — start the job";}
  else{btn.classList.remove("ready");btn.textContent=`Complete all checks to start the job (${total-done} left)`;}
  renderJobBrief();
}
function tog(si,ii){state[key(si,ii)]=!state[key(si,ii)];render();saveAll();queueProgressSave();}
function copyScript(si){
  const name=document.getElementById("j_name").value||"[NAME]";
  const rate=document.getElementById("j_rate").value||"[RATE]";
  const i=normalizedInstructions(ACTIVE);
  let txt=SECTIONS[si].script.p.join("\n\n").replace(/<[^>]+>/g,"")
    .replaceAll("[NAME]",name).replaceAll("[RATE]",rate)
    .replaceAll("[SCOPE]",i.removeItems||textList(ACTIVE.scope?.keep_remove)||"[SCOPE]")
    .replaceAll("[KEEP ITEMS]",i.keepItems||"[KEEP ITEMS]")
    .replaceAll("[TIME]",ACTIVE.endTime||"[TIME]").replaceAll("[N]",String(i.crewSize||"[N]"));
  navigator.clipboard&&navigator.clipboard.writeText(txt);
  event.target.textContent="Copied ✓";setTimeout(()=>{event.target.textContent="Copy text";},1500);
}
async function syncStartLifecycle(startedAt){if(!ACTIVE.jobId)return false;const key=`lifecycle:${ACTIVE.jobId}:job-started:${startedAt}`;try{const response=await fetch('/api/highlevel',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':key},body:JSON.stringify({tool:'lifecycle',event:'job-started',idempotency_key:key,highlevel_contact_id:ACTIVE.highlevelContactId||'',client:{name:ACTIVE.name||'',phone:ACTIVE.phone||'',email:ACTIVE.email||'',address:ACTIVE.addr||'',highlevel_contact_id:ACTIVE.highlevelContactId||''}})}),result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'HighLevel lifecycle sync failed');if(HUBDB)await HUBDB.collection('jobs').doc(ACTIVE.jobId).set({lifecycleSync:{event:'job-started',status:'synced',trigger:result.automation?.trigger||'',syncedAt:startedAt},highlevelContactId:result.contactId||ACTIVE.highlevelContactId||'',updatedAt:startedAt},{merge:true});return true}catch(error){if(HUBDB)await HUBDB.collection('jobs').doc(ACTIVE.jobId).set({lifecycleSync:{event:'job-started',status:'error',error:String(error.message||error).slice(0,160),attemptedAt:startedAt},updatedAt:startedAt},{merge:true}).catch(()=>{});return false}}
async function finish(){
  const total=totalChecks();
  if(totalDone()<total) return;
  const startedAt=ACTIVE.startedAt||new Date().toISOString(),completedBy=sessionStorage.getItem('egc_u')||localStorage.getItem('egc_u')||'';
  if(HUBDB&&ACTIVE.jobId){try{await HUBDB.collection('jobs').doc(ACTIVE.jobId).set({status:'in_progress',pipelineStatus:'in_progress',startedAt,preJobProgress:{...progressPayload(),completedAt:startedAt},preJobChecklist:{completedAt:startedAt,completedBy,clientItems:clientItems().map(it=>({id:it.id,label:it.label,detail:it.detail,completed:true})),standardItems:SECTIONS.flatMap(sec=>sec.items.map(it=>it.t))},updatedAt:startedAt},{merge:true})}catch(error){alert("The Hub could not record job start. Your checklist is still saved on this device—reconnect and retry before starting work.");return}}
  const workflowSynced=await syncStartLifecycle(startedAt);
  localStorage.removeItem(saveKey());
  alert(workflowSynced?"Pre-job complete. HighLevel was notified. Go make it disappear. 🛻":"Pre-job complete and saved. The HighLevel trigger needs a retry from the Hub.");
}
async function loadCentralJob(){if(!HUBDB||!CENTRAL_JOB_ID)return;try{const snap=await HUBDB.collection('jobs').doc(CENTRAL_JOB_ID).get();if(!snap.exists)return;const j={id:snap.id,...snap.data()};ACTIVE={...ACTIVE,jobId:j.id,customerId:j.customerId||'',highlevelContactId:j.highlevelContactId||'',highlevelOpportunityId:j.highlevelOpportunityId||'',highlevelAppointmentId:j.highlevelAppointmentId||'',name:j.customer||'',phone:j.phone||'',email:j.email||'',addr:j.address||'',pkg:j.serviceType||'',total:j.total||j.priceQuoted||'',rate:j.total||j.priceQuoted||'',deposit:j.deposit?.amount||'',jobdate:j.date||'',startTime:j.time||'',endTime:j.endTime||'',assignedTo:j.assignedTo||'',crewSize:Number(j.crewSize||0),pain:j.walkthroughNotes||'',customerNotesSummary:j.customerNotesSummary||j.notes||'',internalNotes:j.internalNotes||'',clientChecklists:j.clientChecklists||{},discovery:j.discovery||{},scope:j.scope||{},logistics:j.logistics||{},instructions:normalizedInstructions(j),photosBefore:Number(j.photoCount||0),savedAt:j.updatedAt||j.createdAt||''};restoreSharedProgress(j.preJobProgress);document.getElementById('j_name').value=j.customer||'';document.getElementById('j_addr').value=j.address||'';document.getElementById('j_date').value=j.date||'';document.getElementById('j_rate').value=j.total||j.priceQuoted||'';document.getElementById('j_pkg').value=j.serviceType||'Garage service';saveAll()}catch(e){}}
document.addEventListener("input",saveAll);
if(!STORAGE_OK) setTimeout(()=>alert("Heads up: this browser is blocking local storage (often Private Browsing). The job won't pre-fill from the Game Plan and progress won't save. Switch off Private Browsing for this iPad."),200);
async function renderWalkthroughPhotoFolder(){if(!HUBDB||!CENTRAL_JOB_ID)return;try{const snap=await HUBDB.collection('jobs').doc(CENTRAL_JOB_ID).get(),data=snap.data()||{},url=data.photoDriveUrl,grid=document.querySelector('#job-brief .brief-grid');ACTIVE.startedAt=data.startedAt||'';if(url&&grid)grid.insertAdjacentHTML('beforeend',`<article class="wide"><small>Walkthrough photos</small><strong><a href="${esc(url)}" target="_blank" rel="noopener">Open the client photo folder ↗</a></strong></article>`)}catch(e){}}
(async()=>{restoreAll();await loadCentralJob();render();await renderWalkthroughPhotoFolder()})();
</script>
