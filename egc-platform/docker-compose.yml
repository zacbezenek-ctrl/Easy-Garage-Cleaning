services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: egc
      POSTGRES_PASSWORD: egc
      POSTGRES_DB: egc
    ports:
      - "5432:5432"
    volumes:
      - egc_postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - egc_redis:/data

volumes:
  egc_postgres:
  egc_redis:
