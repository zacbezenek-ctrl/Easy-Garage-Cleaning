name: EGC Gallery Release Reconcile

on:
  push:
    branches: ['feat/before-after-gallery-20260923']
    paths: ['.github/workflows/egc-gallery-release-reconcile.yml']

permissions:
  contents: write

concurrency:
  group: egc-gallery-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge current main and resolve only additive gallery integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EGC Gallery Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rev-parse origin/main > /tmp/gallery-main-sha
          git merge --no-commit --no-ff origin/main || {
            python - <<'PY'
          import subprocess
          conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).splitlines()
          print('Merge conflicts:', conflicts)
          allowed = {'index.html','sitemap.xml'}
          if not conflicts or not set(conflicts).issubset(allowed):
              raise SystemExit('Unexpected merge conflict; no branch update performed')
          for name in conflicts:
              subprocess.run(['git','checkout','--theirs','--',name], check=True)
              subprocess.run(['git','add','--',name], check=True)
          PY
          }
          # Retain the complete current homepage and sitemap, then add only gallery discovery.
          git show origin/main:index.html > index.html
          git show origin/main:sitemap.xml > sitemap.xml
          python tools/gallery/integrate.py
          git add index.html sitemap.xml before-after.html
          test -z "$(git diff --name-only --diff-filter=U)"
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','diff','--cached','--name-only','origin/main'], text=True).splitlines()
          allowed_files = {'index.html','sitemap.xml','site-enhancements.js','docs/BEFORE_AFTER_PRODUCTION.md','docs/GALLERY_AUTOMATION.md','docs/before-after-generation-plan.json','docs/gallery-generation-registry.json'}
          allowed_prefixes = ('before-after','images/before-after/','tools/gallery/','.github/workflows/egc-gallery-')
          unexpected = [p for p in changed if p not in allowed_files and not p.startswith(allowed_prefixes)]
          print('Gallery-only diff versus current main:', changed)
          if unexpected: raise SystemExit('Unrelated changes would be introduced: ' + repr(unexpected))
          PY
      - name: Install pinned image and browser tooling
        run: |
          python -m pip install Pillow==11.3.0
          npm install --prefix /tmp/egc-gallery-tools --no-package-lock playwright@1.55.0
          /tmp/egc-gallery-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Prepare and validate actual gallery
        run: |
          python tools/gallery/prepare.py
          python tools/gallery/validate.py
          node --check before-after.js
          node --check before-after-compare.js
          node --check site-enhancements.js
      - name: Test desktop and mobile interactions
        env:
          NODE_PATH: /tmp/egc-gallery-tools/node_modules
        run: |
          node tools/gallery/browser-test.cjs
          node tools/gallery/dialog-test.cjs
      - name: Save review material and release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egc-gallery-reconciled-${{ github.run_id }}
          path: |
            gallery-review/
            images/before-after/concepts/
            images/garage-*
            images/job-before-after-*
            images/brand/egc-logo-horizontal-primary.png
            before-after*
            index.html
            sitemap.xml
            styles.css
            site-enhancements.js
            favicon.ico
            docs/gallery-generation-registry.json
            docs/GALLERY_AUTOMATION.md
            tools/gallery/
          if-no-files-found: error
          retention-days: 30
      - name: Commit tested merge to feature branch only
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$SOURCE_BRANCH" = 'feat/before-after-gallery-20260923'
          remote_sha=$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)
          test "$remote_sha" = "$SOURCE_SHA"
          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$main_sha" = "$(cat /tmp/gallery-main-sha)"
          git add images/before-after/concepts before-after-concepts.json before-after.html index.html sitemap.xml
          if git diff --cached --quiet && ! test -f .git/MERGE_HEAD; then exit 0; fi
          git commit -m 'Reconcile gallery with latest main and preserve newer site changes'
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
