name: EGC Public Gallery
on:
  push:
    branches: ['feat/gallery-live-*']
    paths: ['functions/before-after.js', 'gallery-live.css', 'tools/gallery/publish-links.py', 'tests/gallery-public.test.mjs', '.github/workflows/egc-public-gallery.yml']
  pull_request:
    paths: ['functions/before-after.js', 'gallery-live.css', 'tools/gallery/publish-links.py', 'tests/gallery-public.test.mjs', 'gallery-preview-assets/**', '.github/workflows/egc-public-gallery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gallery-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name != 'pull_request' && github.repository == 'zacbezenek-ctrl/Easy-Garage-Cleaning' && startsWith(github.ref_name, 'feat/gallery-live-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add deterministic homepage and sitemap links
        run: python3 tools/gallery/publish-links.py
      - name: Validate public route and existing image files
        run: node --test tests/gallery-public.test.mjs
      - name: Save only generated link changes without overwriting concurrent work
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_BRANCH" =~ ^feat/gallery-live-[a-zA-Z0-9-]+$ ]]
          if git diff --quiet -- index.html sitemap.xml; then exit 0; fi
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html sitemap.xml
          git diff --cached --stat
          git commit -m 'Link public before-and-after gallery from homepage and sitemap'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/gallery-public.test.mjs
      - run: node --check functions/before-after.js
