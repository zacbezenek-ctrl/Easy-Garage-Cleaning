name: EGC Development Correct
on:
  push:
    branches: [feature/operations-action-center]
    paths: [.egc-development/correction-01.b64]
permissions:
  contents: read
jobs:
  correct:
    if: github.repository == 'zacbezenek-ctrl/Easy-Garage-Cleaning' && github.ref == 'refs/heads/feature/operations-action-center'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.apply.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply exact reviewed fixes on feature branch only
        id: apply
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path.cwd()
          raw=lzma.decompress(base64.b64decode(pathlib.Path('.egc-development/correction-01.b64').read_text(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='71b5f1404f1dd67b4f2f01aa7103785c50d8c3a2c4fcb0dacd112aed66060467'
          files=json.loads(raw)['files'];assert len(files)==10
          prepared=[];seen=set()
          for item in files:
              name=item['path'];p=pathlib.PurePosixPath(name)
              assert name not in seen and not p.is_absolute() and '..' not in p.parts
              assert name in {'employee-operations.css','employee-operations.js'} or name.startswith(('egc-platform/','tests/'))
              assert all(not v.startswith('.env') and v not in {'.git','.github','node_modules'} for v in p.parts)
              dest=root/name;assert not dest.is_symlink();seen.add(name)
              if item.get('create'):
                  assert not dest.exists();result=item['content']
              else:
                  data=dest.read_bytes();assert hashlib.sha256(data).hexdigest()==item['before'],name
                  result=data.decode();length=len(result);last=length+1
                  for edit in reversed(item['edits']):
                      a,b=edit['start'],edit['end'];assert 0<=a<=b<=length and b<=last
                      result=result[:a]+edit['text']+result[b:];last=a
              data=result.encode();assert hashlib.sha256(data).hexdigest()==item['after'],name
              prepared.append((dest,data))
          for dest,data in prepared:dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
          subprocess.run(['git','add','--',*sorted(seen)],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(operations): validate full MCP discovery, strict task types and accessible mobile forms'
          git push origin HEAD:refs/heads/feature/operations-action-center
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: correct
    uses: ./.github/workflows/egc-action-center-ci.yml
    with:
      ref: ${{ needs.correct.outputs.source_sha }}
