name: EGC Ideal Gallery Assets
on:
  push:
    branches: ['feat/gallery-ideal-20260923']
    paths: ['docs/gallery-ideal-generation.json', '.github/workflows/egc-ideal-gallery-assets.yml']
permissions:
  contents: read
concurrency:
  group: ideal-gallery-assets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'zacbezenek-ctrl/Easy-Garage-Cleaning' && github.ref_name == 'feat/gallery-ideal-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Download only the requested generated concepts and build review sheets
        run: |
          python - <<'PY'
          import json, re, io, hashlib, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          m=json.loads(Path('docs/gallery-ideal-generation.json').read_text())
          base='https://d8j0ntlcm91z4.cloudfront.net/user_3JjgIOWHcjk4PKqJNGDT7ggmCDm/'
          assert m['sourceBase']==base and m['customerProject'] is False
          assert len(m['pairs'])==8 and len({p['id'] for p in m['pairs']})==8
          out=Path('gallery-ideal-assets/images');out.mkdir(parents=True,exist_ok=True)
          review=Path('gallery-review');review.mkdir(exist_ok=True)
          records=[]; pairs=[]
          for p in m['pairs']:
              assert re.fullmatch(r'[0-9]{2}-[a-z-]+',p['id'])
              files=[]
              for side in ['before','after']:
                  job=p[side+'Job'];stamp=p[side+'Time']
                  assert re.fullmatch(r'[a-f0-9-]{36}',job) and re.fullmatch(r'[0-9]{6}',stamp)
                  url=base+'hf_20260923_'+stamp+'_'+job+'.png'
                  with urllib.request.urlopen(url,timeout=40) as r:
                      assert r.geturl().startswith(base)
                      data=r.read(20*1024*1024+1)
                  assert len(data)<=20*1024*1024 and data.startswith(b'\x89PNG\r\n\x1a\n')
                  image=Image.open(io.BytesIO(data));image.load()
                  assert image.width>=1000 and image.height>=750 and image.width*image.height<20000000
                  path=out/(p['id']+'-'+side+'-'+job[:8]+'.webp')
                  image.convert('RGB').save(path,'WEBP',quality=90,method=6)
                  records.append({'id':p['id'],'side':side,'jobId':job,'source':url,'sourceSha256':hashlib.sha256(data).hexdigest(),'path':str(path),'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'width':image.width,'height':image.height})
                  files.append(path)
              pairs.append((p['id'],*files))
          Path('docs/gallery-ideal-assets.json').write_text(json.dumps(records,indent=2)+'\n')
          def sheets(items,prefix):
              for offset in range(0,len(items),4):
                  subset=items[offset:offset+4]; sheet=Image.new('RGB',(1400,len(subset)*560),'#ffffff'); draw=ImageDraw.Draw(sheet)
                  for row,(name,before,after) in enumerate(subset):
                      y=row*560;draw.text((12,y+8),name+' | BEFORE',fill='black');draw.text((712,y+8),name+' | AFTER',fill='black')
                      for col,file in enumerate([before,after]):
                          im=Image.open(file).convert('RGB');im=ImageOps.contain(im,(694,524));sheet.paste(im,(col*700,y+30))
                  sheet.save(review/(prefix+'-'+str(offset//4+1)+'.jpg'),quality=88)
          sheets(pairs,'new')
          old=[]
          for before in sorted(Path('gallery-preview-assets/images').glob('*-before-*.webp')):
              name=before.name.split('-before-')[0];after=list(before.parent.glob(name+'-after-*.webp'));assert len(after)==1
              old.append((name,before,after[0]))
          sheets(old,'original')
          print('Saved',len(records),'verified WebP images and',len(list(review.glob('*.jpg'))),'review sheets')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ideal-gallery-visual-review
          path: |
            gallery-review/*.jpg
            gallery-ideal-assets/images/*.webp
            docs/gallery-ideal-assets.json
          retention-days: 7
      - name: Save generated assets only if this branch has not moved
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$TARGET_BRANCH" = 'feat/gallery-ideal-20260923'
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_SHA"
          git add -- gallery-ideal-assets/images docs/gallery-ideal-assets.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Save eight generated clutter-to-black-storage pairs with source hashes'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
