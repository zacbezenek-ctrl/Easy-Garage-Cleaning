name: EGC Development Apply
on:
  push:
    branches: [feature/operations-action-center]
    paths: [.egc-development/run]
permissions:
  contents: read
jobs:
  apply-reviewed-source:
    if: github.repository == 'zacbezenek-ctrl/Easy-Garage-Cleaning' && github.ref == 'refs/heads/feature/operations-action-center'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Validate exact source hashes and apply reviewed bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root=pathlib.Path.cwd()
          parts=[root/'.egc-development'/f'part-{i:02d}' for i in range(4)]
          raw=lzma.decompress(base64.b64decode(''.join(p.read_text() for p in parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='21076ee83eb5d8b878755692c254aee368a6d0da5deee2951d77ddb33ec20f0f'
          bundle=json.loads(raw); assert set(bundle)=={'files'} and len(bundle['files'])==31
          prepared=[]; seen=set()
          for item in bundle['files']:
              name=item['path']; p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and name not in seen
              assert all(not v.startswith('.env') and v not in {'.git','.github','node_modules'} for v in p.parts)
              assert name in {'employee-suite.js','employee.html','employee-operations.js','employee-operations.css'} or name.startswith(('egc-platform/','functions/','tests/'))
              assert p.suffix in {'.js','.mjs','.ts','.json','.css','.html','.sql','.py'}
              seen.add(name); dest=root/name
              assert all(not ancestor.is_symlink() for ancestor in [dest,*dest.parents] if ancestor!=root.parent)
              if item.get('create'):
                  assert not dest.exists(),name
                  result=item['content']
              else:
                  data=dest.read_bytes(); assert hashlib.sha256(data).hexdigest()==item['before'],name
                  result=data.decode('utf-8'); original_length=len(result); last=original_length+1
                  for edit in reversed(item['edits']):
                      start,end=edit['start'],edit['end']
                      assert 0<=start<=end<=original_length and end<=last,name
                      result=result[:start]+edit['text']+result[end:]; last=start
              data=result.encode('utf-8'); assert hashlib.sha256(data).hexdigest()==item['after'],name
              prepared.append((dest,data))
          for dest,data in prepared:
              dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
          pathlib.Path('/tmp/egc-reviewed-paths.json').write_text(json.dumps(sorted(seen)))
          print('Verified and applied',len(prepared),'source files; no external services contacted.')
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
        working-directory: egc-platform
      - name: Generate checked-in schema and revision-guard migrations
        working-directory: egc-platform
        env:
          DATABASE_URL: postgres://egc_test:isolated_ci_only@localhost:5432/egc_operations_test
        run: |
          pnpm --filter @egc/database exec drizzle-kit generate --name=operations_actions
          pnpm --filter @egc/database exec drizzle-kit generate --custom --name=operations_guards
          python3 - <<'PY'
          from pathlib import Path
          candidates=list(Path('packages/database/migrations').glob('*operations_guards.sql'))
          assert len(candidates)==1,candidates
          candidates[0].write_bytes(Path('services/operations/sql/revision-guards.sql').read_bytes())
          print('Custom migration:',candidates[0])
          PY
      - name: Commit source to development branch only
        id: publish
        shell: bash
        run: |
          python3 - <<'PY'
          import json,subprocess
          paths=json.load(open('/tmp/egc-reviewed-paths.json'))
          subprocess.run(['git','add','--',*paths,'egc-platform/packages/database/migrations','egc-platform/pnpm-lock.yaml'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'feat(operations): integrate durable Action Center, shared commands, exact reviews and portal reads'
          git push origin HEAD:refs/heads/feature/operations-action-center
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Package source and dependencies for isolated review
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,tarfile,subprocess
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with tarfile.open('/tmp/egc-build-review.tar.gz','w:gz') as out:
              for name in paths:
                  p=pathlib.Path(name)
                  if name and p.is_file() and not name.startswith(('.git','.egc-development/')) and not any(v.startswith('.env') for v in p.parts):
                      out.add(p,arcname=name,recursive=False)
              for p in pathlib.Path('egc-platform').rglob('node_modules'):
                  if not any(v in {'node_modules','.git'} for v in p.parent.parts):out.add(p,arcname=str(p))
          PY
          git rev-parse HEAD > /tmp/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egc-action-center-build-review-${{ github.run_id }}
          path: |
            /tmp/egc-build-review.tar.gz
            /tmp/source-commit.txt
          retention-days: 1
  verify:
    needs: apply-reviewed-source
    uses: ./.github/workflows/egc-action-center-ci.yml
    with:
      ref: ${{ needs.apply-reviewed-source.outputs.source_sha }}
