name: Materialize tested portal release
on:
  push:
    branches: [fix/portal-scheduling-lineage-20260922]
    paths: [.github/workflows/portal-release-materialize.yml]
permissions:
  contents: write
concurrency:
  group: portal-release-materialize
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'zacbezenek-ctrl/Easy-Garage-Cleaning' && github.ref == 'refs/heads/fix/portal-scheduling-lineage-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify every original and resulting source hash before applying
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path.cwd().resolve()
          manifests = ['scripts/portal-release-gameplan.json', 'scripts/portal-release-backend.json', 'scripts/portal-release-tests.json']
          def blob(text):
              raw = text.encode('utf-8')
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          pending = {}
          for name in manifests:
              data = json.loads(Path(name).read_text())
              for name, expected in data.get('verifyNewFiles', {}).items():
                  path = (root / name).resolve()
                  assert path.is_relative_to(root), name
                  actual = blob(path.read_text())
                  assert actual == expected, f'{name}: new source hash {actual} != {expected}'
              for item in data['files']:
                  name = item['path']
                  path = (root / name).resolve()
                  assert path.is_relative_to(root) and name.startswith(('crew/', 'functions/', 'tests/', 'egc-platform/')), name
                  assert name not in pending, f'duplicate target {name}'
                  original = path.read_text()
                  assert blob(original) == item['before'], f'{name}: original source changed'
                  edits = sorted(item['edits'], key=lambda e: (e['start'], e['end']))
                  last = 0
                  for edit in edits:
                      assert isinstance(edit['start'], int) and isinstance(edit['end'], int) and isinstance(edit['text'], str)
                      assert last <= edit['start'] <= edit['end'] <= len(original), f'{name}: invalid edit'
                      last = edit['end']
                  result = original
                  for edit in reversed(edits):
                      result = result[:edit['start']] + edit['text'] + result[edit['end']:]
                  assert blob(result) == item['after'], f'{name}: resulting source hash {blob(result)} != {item["after"]}'
                  pending[name] = result
          for name, content in pending.items():
              (root / name).write_text(content)
              print('Verified', name, blob(content))
          for name in manifests:
              Path(name).unlink()
          Path('.github/workflows/portal-release-materialize.yml').unlink()
          PY
      - name: Run actual full Hub regression suite
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --experimental-strip-types --test tests/*.test.mjs > /tmp/portal-release-tests.txt 2>&1
          tail -20 /tmp/portal-release-tests.txt
      - name: Commit only verified changes to the existing repair branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git config user.name 'EGC release repair'
          git config user.email 'release-repair@users.noreply.github.com'
          git add -u
          git diff --cached --check
          git commit -m 'Finish native signed walkthrough handoff, private crew reference photos and CAPI operational logging'
          git push origin HEAD:refs/heads/fix/portal-scheduling-lineage-20260922
          git rev-parse HEAD
      - name: Save failure diagnostics without credentials or production data
        if: failure()
        run: |
          mkdir -p release-failure
          cp /tmp/portal-release-tests.txt release-failure/ 2>/dev/null || true
          git diff > release-failure/source.diff
          git status --short > release-failure/status.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: portal-release-materialize-failure
          path: release-failure/
          retention-days: 1
