name: Publish verified Portal handoff patch
on:
  push:
    branches: [fix/portal-scheduling-lineage-20260922]
    paths: [.github/workflows/portal-handoff-publish-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact inspected source edits
        env:
          PATCH: >-
            
        run: |
          python - <<'PY'
          import os,json,base64,gzip,hashlib,pathlib,subprocess
          data=gzip.decompress(base64.b64decode(os.environ['PATCH']))
          assert hashlib.sha256(data).hexdigest()=='60e42ca4d1bf9d51bcef08c497bdeac88bec45ab4fcc739bdcd519f6ddfe670e','Patch payload mismatch'
          entries=json.loads(data)
          allowed={'crew/gameplan.html','functions/_lib/walkthrough-handoff.js','functions/api/walkthrough-handoff.js','tests/operations-suite.test.mjs','tests/portal-invitation-ui.test.mjs','tests/walkthrough-handoff.test.mjs','tests/walkthrough-pricing.test.mjs','tests/dispatch-field.browser.mjs'}
          assert {e['path'] for e in entries}==allowed
          for e in entries:
              path=pathlib.Path(e['path']); old=path.read_text() if path.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest()==e['before'], 'Concurrent edit: '+e['path']
              new=old
              for start,end,text in reversed(e['ops']):
                  assert 0<=start<=end<=len(old)
                  new=new[:start]+text+new[end:]
              assert hashlib.sha256(new.encode()).hexdigest()==e['after'], 'Result mismatch: '+e['path']
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(new)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          print('Verified all eight source hashes against the locally tested patch.')
          PY
      - name: Run native Hub regressions
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --check functions/_lib/walkthrough-handoff.js
          node --check functions/api/walkthrough-handoff.js
          node --check tests/dispatch-field.browser.mjs
          node --experimental-strip-types --test tests/*.test.mjs > /tmp/handoff-tests.log 2>&1 || { tail -100 /tmp/handoff-tests.log; exit 1; }
          tail -15 /tmp/handoff-tests.log
      - name: Commit tested changes to the existing release branch only
        run: |
          git config user.name 'EGC Portal repair'
          git config user.email 'portal-repair@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'Complete native signed walkthrough handoff and resilient mobile retries'
          git push origin HEAD:refs/heads/fix/portal-scheduling-lineage-20260922
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-handoff-unit-evidence
          path: /tmp/handoff-tests.log
          retention-days: 7
