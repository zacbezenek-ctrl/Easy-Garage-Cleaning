name: EGC Action Center CI
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
  pull_request:
    paths: ['egc-platform/**','functions/**','employee*','tests/**','crew/**','scripts/repair-stale-schedule-instants.mjs','scripts/backfill-job-contact-keys.mjs','scripts/backfill-customer-identity.mjs','scripts/backfill-job-labor-private.mjs','_generate_site.py','_services_data.py','_finalize_urls.py','tools/site-build.json','tools/gallery/**','scripts/render-before-after.mjs','gallery-simple.js','package.json','*.html','blog/**','projects/**','sitemap.xml','llms.txt','message-templates.*','customer-portal.html','staff-paths.js','hub-sw.js','customer-tip.*','staff-login.*','fb-capture.js','analytics-loader.js','site-forms.js','site-enhancements.js','styles.css','client-login.*','.github/workflows/egc-action-center-ci.yml']
  push:
    branches: [main]
    paths: ['egc-platform/**','functions/**','employee*','tests/**','crew/**','scripts/repair-stale-schedule-instants.mjs','scripts/backfill-job-contact-keys.mjs','scripts/backfill-customer-identity.mjs','scripts/backfill-job-labor-private.mjs','_generate_site.py','_services_data.py','_finalize_urls.py','tools/site-build.json','tools/gallery/**','scripts/render-before-after.mjs','gallery-simple.js','package.json','*.html','blog/**','projects/**','sitemap.xml','llms.txt','message-templates.*','customer-portal.html','staff-paths.js','hub-sw.js','customer-tip.*','staff-login.*','fb-capture.js','analytics-loader.js','site-forms.js','site-enhancements.js','styles.css','client-login.*','.github/workflows/egc-action-center-ci.yml']
permissions:
  contents: read
# Push runs are keyed by commit SHA: a shared refs/heads/main group would let a newer queued
# run cancel an older PENDING one even with cancel-in-progress false, skipping main commits.
concurrency:
  group: egc-action-center-ci-${{ inputs.ref || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  database-and-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: egc_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: egc_operations_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U egc_test -d egc_operations_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://egc_test:isolated_ci_only@localhost:5432/egc_operations_test
      EGC_OPERATIONS_TEST: isolated
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: egc-platform
      - name: Build shared packages
        run: pnpm build:packages
        working-directory: egc-platform
      - name: Typecheck platform
        run: pnpm typecheck
        working-directory: egc-platform
      - name: All platform unit tests
        run: pnpm test
        working-directory: egc-platform
      - name: Build all applications
        run: pnpm build
        working-directory: egc-platform
      - name: Build leaves no uncommitted changes
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
        working-directory: egc-platform
      - name: Apply checked-in migrations twice
        run: |
          pnpm --filter @egc/database migrate:runtime
          pnpm --filter @egc/database migrate:runtime
        working-directory: egc-platform
      # FUN-15: ad spend daily rows, sync days, lead-form counts and the append-only owner spend ledger.
      - name: Ad spend ingestion ledger and owner spend entries
        run: node --test services/ad-spend/test/postgres.check.mjs
        working-directory: egc-platform
      - name: Existing task adapter database regression tests
        run: pnpm --filter @egc/lead-audit test:operations:integration
        working-directory: egc-platform
      - name: Durable actions, approvals, idempotency and source invalidation
        run: |
          pnpm --filter @egc/operations test:integration
          node --test services/operations/test/timeline.check.mjs
          node --test services/operations/test/message-completion.check.mjs
          node --test services/operations/test/legacy-walkthrough.check.mjs
        working-directory: egc-platform
      # schedule-sync-postgres.check.mjs runs the real Hub queue from functions/_lib, which imports
      # the root package's @noble/hashes (funnel-definitions.js); pnpm installs only egc-platform.
      - name: Install root dependencies for the Hub modules the schedule-sync check imports
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Durable appointment claims, unknown-outcome reconciliation, MCP safety defaults, OAuth clients and grants, and paged CRM reads
        run: |
          node --test apps/mcp/test/appointments-postgres.check.mjs
          node --test apps/mcp/test/safety-postgres.check.mjs
          node --test apps/mcp/test/oauth-postgres.check.mjs
          pnpm --filter @egc/mcp test:crm-reads:postgres
          node --test apps/api/test/scheduling-postgres.check.mjs
          node --test apps/api/test/schedule-sync-postgres.check.mjs
          node --test apps/api/test/service-auth-postgres.check.mjs
        working-directory: egc-platform
      - name: Durable recording intake, retries and authoritative review
        run: pnpm --filter @egc/api test:recordings:integration
        working-directory: egc-platform
      - name: Unanswered customer replies and protected reconciliation health
        run: pnpm --filter @egc/api test:inbound:integration
        working-directory: egc-platform
      - name: Webhook lease takeover and terminal outcome fencing
        run: node --test apps/worker/test/webhooks-postgres.check.mjs
        working-directory: egc-platform
      - name: Authorized customer communications and provider note write recovery
        run: |
          node --test apps/mcp/test/communications-postgres.check.mjs
          node --test apps/worker/test/notes-postgres.check.mjs
          node --test apps/worker/test/provider-notes-read-postgres.check.mjs
          node --test apps/worker/test/call-transcript-postgres.check.mjs
          pnpm --filter @egc/api test:provider-notes:integration
          pnpm --filter @egc/api test:action-send:integration
        working-directory: egc-platform
      - name: Verify schema has no uncommitted migration drift
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain packages/database/migrations)"
        working-directory: egc-platform
  functions-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      # PRICE-SCRUB: the walkthrough prices must bundle on the Wrangler majors Pages may build with; the check fails on a
      # leftover runtime import(), an unsupported dynamic import or [ERROR] in the build log, or a missing walkthrough service.
      - name: Pages Functions bundle builds on Wrangler 3 and 4
        run: |
          for major in 3 4; do
            npx --yes wrangler@$major pages functions build functions --outdir /tmp/pages-fn$major > /tmp/pages-fn$major.log 2>&1 || { cat /tmp/pages-fn$major.log; exit 1; }
            node scripts/check-functions-bundle.mjs /tmp/pages-fn$major/index.js /tmp/pages-fn$major.log
          done
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Some browser fixtures render server modules with Node (money documents).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Isolated real-browser Action Center tests
        run: python tests/browser/test_operations_ui.py
      - name: Isolated real-browser recording review tests
        run: python tests/browser/test_recordings_ui.py
      - name: Native Hub booking recovery and Denver time-zone tests
        run: python tests/browser/test_native_booking_ui.py
      - name: Dispatch conflict recovery, openings and mobile controls
        run: python tests/browser/test_dispatch_ui.py
      - name: Dispatch month grid, time lanes, drag and phone tap-to-assign
        run: python tests/browser/test_dispatch_calendar_ui.py
      - name: Recurring plans dialog, mobile layout and save recovery
        run: python tests/browser/test_recurring_ui.py
      - name: Crew availability and private draft recovery
        run: python tests/browser/test_availability_ui.py
      - name: Personal field agenda and Mountain date boundaries
        run: python tests/browser/test_field_today_ui.py
      - name: Hub shell registry, draft-safe refreshes and navigation history
        run: python tests/browser/test_hub_shell_ui.py
      - name: Hub mobile shell at phone widths
        run: python tests/browser/test_hub_mobile_ui.py
      - name: Owner catalog and pricing screen on a phone
        run: python tests/browser/test_catalog_ui.py
      - name: Hub offline queue, Pending sync, clock-out not saved and discarding a shift at phone widths
        run: python tests/browser/test_hub_offline_ui.py
      - name: Job labor dollars owner-only on the finance board and cost dialog
        run: python tests/browser/test_job_cost_privacy_ui.py
      - name: Follow-up owner and due-time settings on a phone
        run: python tests/browser/test_followup_settings_ui.py
      - name: Hub home overdue follow-ups widget (isolated and Command center)
        run: python tests/browser/test_home_widgets_ui.py
      - name: Review queues for held Stripe charges, member matches and unconfirmed sends, and the Command Center alert
        run: python tests/browser/test_review_queues_ui.py
      - name: Customer tip picker on portal Pay, held tipped payments and phone layout
        run: python tests/browser/test_customer_tips_ui.py
      - name: Crew closeout tip picker, held tipped charges and the Hub tip allocation card
        run: python tests/browser/test_crew_tips_ui.py
      - name: Walkthrough pricing served by role, offline copy and Hub outage messages
        run: python tests/browser/test_gameplan_pricing_ui.py
      - name: Staff directory Team screen on a phone
        run: python tests/browser/test_staff_ui.py
      - name: Crew schedule alerts feed, acknowledgement and text opt-in on a phone
        run: python tests/browser/test_crew_notifications_ui.py
      - name: Time-off requests, approvals and PTO pay edits on a phone
        run: python tests/browser/test_pto_requests_ui.py
      - name: 'Payroll week card: owner-only pay and CSV'
        run: python tests/browser/test_payroll_week_ui.py
      - name: Field job-cost capture on a phone
        run: python tests/browser/test_field_expenses_ui.py
      - name: Crew multi-day visits, end of day and the day lock on a phone
        run: python tests/browser/test_field_multiday_ui.py
      - name: Owner-only ad spend screen, manual spend entries and connection health on a phone
        run: python tests/browser/test_ad_spend_ui.py
      - name: Owner stocked item costs screen, manager read-only view and phone layout
        run: python tests/browser/test_standard_costs_ui.py
      - name: Crew pre-job customer texts are idempotent and never re-sent
        run: python tests/browser/test_prejob_sms_ui.py
      - name: Server-rendered estimate, invoice and receipt documents on a phone
        run: python3 -m unittest tests/browser/test_money_document_ui.py
      - name: Portal insurance certificate, guarantee and terms, and the Hub documents admin
        run: python tests/browser/test_portal_documents_ui.py
      - name: Hub quote draft "Send options for review" dialog on a phone
        run: python tests/browser/test_quote_draft_ui.py
      - name: Portal quote draft withholding and edit-safe quiet refresh on a phone
        run: python tests/browser/test_quote_draft_portal_ui.py
      - name: Hub money actions on the server money API, flag fallback and phone layout
        run: python3 -m unittest tests/browser/test_money_actions_ui.py
      - name: Customer credits, gift-card sales, decision prompts and rebooking follow-ups on the server lifecycle API
        run: python tests/browser/test_customer_lifecycle_ui.py
      - name: Portal change orders (approve, decline, billing and void) on a phone
        run: python tests/browser/test_portal_change_orders_ui.py
      - name: Client Login magic-link sign-in, sign-in retry and portal hand-off on a phone
        run: python tests/browser/test_client_login_ui.py
      - name: Staff page gate sign-in redirects, 401 scripts and crew service worker installs
        run: python tests/browser/test_staff_gate_ui.py
      - name: Crew headshots, manager approval and the customer portal crew card on a phone
        run: python tests/browser/test_crew_profile_ui.py
      - name: Customer before/after photos and manager sharing on a phone
        run: python tests/browser/test_customer_photos_ui.py
      - name: Public nav drawer keyboard contract and footer tap targets
        run: python tests/browser/test_nav_drawer_ui.py
      - name: Public site mobile performance (logos, hero srcset, deferred fonts, site-forms.js, static booking bar)
        run: python tests/browser/test_public_performance_ui.py
      - name: Website lead relay, ads.html relay fix and book.html Meta Lead eventID on a phone
        run: python tests/browser/test_lead_relay_ui.py
      - name: Owner message template drafts, approval and conflict recovery
        run: python tests/browser/test_message_templates_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egc-action-center-browser-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
