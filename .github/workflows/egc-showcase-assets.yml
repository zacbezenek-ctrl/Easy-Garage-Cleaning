name: EGC Showcase Images
on:
  push:
    branches: ['feat/gallery-showcase-*']
    paths: ['tools/gallery/showcase-import.json', 'tools/gallery/import-showcase.py', 'tools/gallery/showcase-browser.cjs', 'gallery-preview-assets/gallery.js', 'gallery-live.css', '.github/workflows/egc-showcase-assets.yml']
permissions:
  contents: read
concurrency:
  group: egc-showcase-${{ github.ref }}
  cancel-in-progress: false
jobs:
  import-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install Pillow==11.3.0
      - name: Import exact selected images as first-party full and mobile WebP files
        run: python tools/gallery/import-showcase.py
      - run: node --check gallery-preview-assets/gallery.js
      - name: Prepare isolated browser tooling
        run: |
          npm install --prefix /tmp/egc-showcase-tools --no-package-lock playwright@1.55.0
          /tmp/egc-showcase-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Test only the static public-facing gallery
        env:
          NODE_PATH: /tmp/egc-showcase-tools/node_modules
        run: node tools/gallery/showcase-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egc-showcase-review-${{ github.run_id }}
          path: |
            showcase-review/
            images/gallery-showcase/
            gallery-showcase.json
          if-no-files-found: warn
      - name: Save only image files and the static showcase manifest
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_BRANCH" =~ ^feat/gallery-showcase-[a-zA-Z0-9-]+$ ]]
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          git add -- images/gallery-showcase gallery-showcase.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'EGC Gallery Asset Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add six full-size showcase comparisons and mobile WebP images'
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
