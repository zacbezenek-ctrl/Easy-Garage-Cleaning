name: Commit EGC Task Migration

on:
  push:
    branches:
      - feature/egc-operational-tasks
    paths:
      - .github/workflows/egc-task-migration-commit.yml

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: egc-platform
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/egc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/egc-operational-tasks
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/migrations
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
          else
            git commit -m "Tasks: commit generated database migration"
            git push origin HEAD:feature/egc-operational-tasks
          fi
