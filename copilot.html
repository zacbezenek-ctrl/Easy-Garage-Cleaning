<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EGC Field Co-Pilot</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EGC Co-Pilot">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="/styles.css?v=20260903e">
<style>
/* Dark-theme tokens used below but not defined in /styles.css */
:root {
  --navy-light: #1c3252;
  --border: rgba(255,255,255,.08);
  --red: #ef4444;
  --green: #22c55e;
  --yellow: #facc15;
}
html, body { height: 100%; }
body { margin: 0; background: var(--navy); color: #fff; font-family: 'Inter', system-ui, sans-serif; }
/* Screen gating — the co-pilot UI stays hidden until login adds .active */
#login-screen { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
#copilot-screen { display: none; }
#copilot-screen.active { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.login-card {
      background: var(--navy-soft); border: 1px solid var(--border);
      border-radius: 1.25rem; padding: 2.5rem 2rem;
      width: 100%; max-width: 360px;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }
.login-logo { text-align: center; margin-bottom: 2rem; }
.login-logo .wordmark { font-size: 1.05rem; font-weight: 700; }
.login-logo .sub {
      font-size: .7rem; color: var(--accent);
      letter-spacing: .12em; text-transform: uppercase; margin-top: .25rem;
    }
.login-card label {
      display: block; font-size: .72rem; font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase;
      color: var(--muted); margin-bottom: .4rem;
    }
.login-card input {
      width: 100%; background: var(--navy-light);
      border: 1px solid var(--border); border-radius: .65rem;
      padding: .75rem 1rem; color: #fff; font-size: .95rem;
      font-family: inherit; margin-bottom: 1rem; outline: none;
      transition: border-color .15s;
    }
.login-card input:focus { border-color: var(--accent); }
.login-btn {
      width: 100%; background: var(--accent); border: none;
      border-radius: .65rem; padding: .85rem; color: #fff;
      font-size: .95rem; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: opacity .15s;
    }
.login-btn:active { opacity: .85; }
.login-error {
      background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
      border-radius: .5rem; padding: .6rem .85rem; font-size: .8rem;
      color: #fca5a5; margin-bottom: 1rem; display: none;
    }
.topbar {
      display: flex; align-items: center; gap: .65rem;
      padding: .7rem 1rem;
      background: var(--navy-soft); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
.topbar-logo { font-weight: 700; font-size: .88rem; flex: 1; }
.topbar-logo span { color: var(--accent); }
.logout-btn {
      background: none; border: none; color: var(--muted);
      font-size: .85rem; cursor: pointer; padding: .25rem;
      line-height: 1;
    }
.schedule-strip {
      flex-shrink: 0; padding: .65rem 1rem .45rem;
      border-bottom: 1px solid var(--border); background: var(--navy);
    }
.strip-label {
      font-size: .62rem; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; color: var(--muted); margin-bottom: .45rem;
    }
.jobs-scroll {
      display: flex; gap: .55rem; overflow-x: auto;
      padding-bottom: .35rem; -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
.jobs-scroll::-webkit-scrollbar { display: none; }
.job-chip {
      flex-shrink: 0; background: var(--navy-soft);
      border: 1px solid var(--border); border-radius: .6rem;
      padding: .5rem .75rem; min-width: 130px;
    }
.job-chip .jc-name { font-size: .8rem; font-weight: 600; }
.job-chip .jc-time { font-size: .68rem; color: var(--muted); margin-top: .12rem; }
.job-chip .jc-meta { font-size: .65rem; color: var(--muted); margin-top: .08rem; }
.job-chip.s-inprogress { border-color: var(--yellow); }
.job-chip.s-completed  { border-color: var(--green); opacity: .6; }
.status-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      margin-right: .3rem; vertical-align: middle; background: var(--muted);
    }
.s-inprogress .status-dot { background: var(--yellow); }
.s-completed  .status-dot { background: var(--green); }
.no-jobs-msg { font-size: .78rem; color: var(--muted); padding: .2rem 0 .35rem; }
.chat-area {
      flex: 1; overflow-y: auto; padding: 1rem;
      display: flex; flex-direction: column; gap: .8rem;
      -webkit-overflow-scrolling: touch;
    }
.msg { display: flex; flex-direction: column; animation: fadein .18s ease; }
.msg-bubble {
      padding: .8rem .95rem; border-radius: .95rem;
      font-size: .875rem; line-height: 1.62;
    }
.msg.user .msg-bubble {
      background: var(--accent); color: #fff;
      border-bottom-right-radius: .25rem; align-self: flex-end; max-width: 84%;
    }
.msg.assistant .msg-bubble {
      background: var(--navy-soft); border: 1px solid var(--border);
      border-bottom-left-radius: .25rem;
    }
.script-block {
      background: rgba(255,91,31,.07); border: 1px solid rgba(255,91,31,.22);
      border-radius: .55rem; padding: .7rem .85rem;
      margin: .55rem 0 .25rem; font-size: .83rem;
      line-height: 1.65; white-space: pre-wrap;
    }
.script-label {
      font-size: .62rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--accent); margin-bottom: .35rem;
    }
.copy-btn {
      display: inline-flex; align-items: center; gap: .28rem;
      background: rgba(255,91,31,.12); border: 1px solid rgba(255,91,31,.28);
      border-radius: .38rem; padding: .32rem .6rem;
      font-size: .7rem; font-weight: 600; color: var(--accent);
      cursor: pointer; font-family: inherit; margin-top: .35rem;
      transition: background .15s;
    }
.copy-btn:active { background: rgba(255,91,31,.25); }
.copy-btn.copied { color: var(--green); border-color: rgba(34,197,94,.4); background: rgba(34,197,94,.08); }
.sop-pill {
      display: inline-block; background: rgba(255,255,255,.06);
      border: 1px solid var(--border); border-radius: 99px;
      padding: .12rem .5rem; font-size: .65rem;
      font-family: 'JetBrains Mono', monospace; color: var(--muted);
      margin-top: .45rem;
    }
.dot-row { display: flex; gap: .28rem; align-items: center; height: 1.1rem; }
.dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted); animation: bounce .85s infinite;
    }
.dot:nth-child(2) { animation-delay: .14s; }
.dot:nth-child(3) { animation-delay: .28s; }
.input-area {
      flex-shrink: 0; padding: .7rem 1rem;
      padding-bottom: calc(.7rem + env(safe-area-inset-bottom));
      background: var(--navy-soft); border-top: 1px solid var(--border);
      display: flex; align-items: flex-end; gap: .55rem;
    }
.input-wrap {
      flex: 1; background: var(--navy-light); border: 1px solid var(--border);
      border-radius: 1.2rem; display: flex; align-items: flex-end; gap: .45rem;
      padding: .5rem .7rem; transition: border-color .15s;
    }
.input-wrap:focus-within { border-color: rgba(255,91,31,.4); }
.voice-btn, .send-btn {
      border: none; border-radius: 50%; width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; transition: opacity .15s;
    }
.voice-btn {
      background: var(--navy-light); border: 1px solid var(--border);
      color: var(--muted); font-size: 1rem;
    }
.voice-btn.recording {
      background: rgba(239,68,68,.18); border-color: rgba(239,68,68,.45);
      color: var(--red); animation: pulse 1.1s infinite;
    }
.send-btn { background: var(--accent); color: #fff; }
.send-btn:disabled { opacity: .35; cursor: default; }
.send-btn:not(:disabled):active { opacity: .8; }
</style>
</head>
<body>

<!-- ── LOGIN ──────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="wordmark">Easy Garage Cleaning</div>
      <div class="sub">Field Co-Pilot</div>
    </div>
    <div class="login-error" id="login-error">Wrong username or password.</div>
    <label>Username</label>
    <input type="text" id="l-user" autocomplete="username" autocorrect="off"
           autocapitalize="off" spellcheck="false" placeholder="AlexK" />
    <label>Password</label>
    <input type="password" id="l-pass" autocomplete="current-password" placeholder="••••••••" />
    <button class="login-btn" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- ── COPILOT ─────────────────────────────────────────── -->
<div id="copilot-screen">

  <div class="topbar">
    <div class="topbar-logo">EGC <span>Co-Pilot</span></div>
    <div id="topbar-time"></div>
    <div id="topbar-user"></div>
    <button class="logout-btn" onclick="doLogout()" title="Log out">✕</button>
  </div>

  <div class="schedule-strip">
    <div class="strip-label">Today's Jobs</div>
    <div class="jobs-scroll" id="jobs-strip">
      <div class="no-jobs-msg">Loading…</div>
    </div>
  </div>

  <div class="chat-area" id="chat-area"></div>

  <div class="input-area">
    <button class="voice-btn" id="voice-btn" onclick="toggleVoice()" title="Voice input">🎤</button>
    <div class="input-wrap">
      <textarea id="query-input" rows="1"
        placeholder="Ask anything — scope change, running late, customer text…"
        oninput="autoResize(this)" onkeydown="inputKeydown(event)"></textarea>
    </div>
    <button class="send-btn" id="send-btn" onclick="sendQuery()" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════
   AUTH — same SHA-256 hashes as employee.html
══════════════════════════════════════════════════ */
const USERS = {
  ZacB:   '6b8670f397174ff99440629b877581216a0b26b6770054be198988ff48a16861',
  TylerG: '28b50fd5ee98af8cf015972811def03dbc2eaff52997f82ecfc4342ece6cfa36',
  AlexK:  '52e2e9901adc10406ad9597084ece4770d1c9fd0e3b76e1f31abf35f8030ac50',
};

let me        = null;
let db        = null;
let todayJobs = [];
let allLeads  = [];
let history   = [];
let recording = false;
let recog     = null;

async function sha256(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function hashPass(u, p)  { return sha256(u + ':' + p + ':egc-salt-2026'); }
async function sessTok(u)      { return sha256(u + ':' + USERS[u] + ':egc-session'); }

document.getElementById('l-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

async function doLogin() {
  const u = document.getElementById('l-user').value.trim();
  const p = document.getElementById('l-pass').value;
  const err = document.getElementById('login-error');
  if (!USERS[u]) { err.style.display = 'block'; return; }
  const h = await hashPass(u, p);
  if (h !== USERS[u]) { err.style.display = 'block'; return; }
  err.style.display = 'none';
  me = u;
  const tok = await sessTok(u);
  sessionStorage.setItem('egc_cp_u',   u);
  sessionStorage.setItem('egc_cp_tok', tok);
  boot();
}

async function checkSession() {
  const u   = sessionStorage.getItem('egc_cp_u');
  const tok = sessionStorage.getItem('egc_cp_tok');
  if (!u || !USERS[u] || !tok) return false;
  if (tok !== await sessTok(u)) return false;
  me = u;
  return true;
}

function doLogout() {
  sessionStorage.removeItem('egc_cp_u');
  sessionStorage.removeItem('egc_cp_tok');
  me = null; history = []; todayJobs = []; allLeads = [];
  document.getElementById('copilot-screen').classList.remove('active');
  document.getElementById('login-screen').style.display = '';
  document.getElementById('chat-area').innerHTML = '';
}

/* ══════════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════════ */
async function boot() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('copilot-screen').classList.add('active');
  document.getElementById('topbar-user').textContent = me;

  // Firebase — same project as employee.html
  if (!firebase.apps.length) {
    firebase.initializeApp({
      apiKey:            "AIzaSyA8g4UAW4P4bsCrQNZhUe81CbC7BvjJbNc",
      authDomain:        "egcw-1ec83.firebaseapp.com",
      projectId:         "egcw-1ec83",
      storageBucket:     "egcw-1ec83.firebasestorage.app",
      messagingSenderId: "763340109795",
      appId:             "1:763340109795:web:ac203b3eb71831fa4ed2d6"
    });
  }
  db = firebase.firestore();

  updateClock();
  setInterval(updateClock, 30000);
  loadSchedule();
  loadLeads();

  document.getElementById('query-input').addEventListener('input', () => {
    document.getElementById('send-btn').disabled =
      !document.getElementById('query-input').value.trim();
  });

  addAssistantMsg(
    `Ready. I have today's schedule and the EGC SOPs loaded.\n\nAsk me anything — overage situation, running late, what text to send a customer, truck capacity, payment issue. I'll give you the exact action and the ready-to-send script.`
  );
}

function updateClock() {
  document.getElementById('topbar-time').textContent =
    new Date().toLocaleTimeString('en-US', {
      timeZone: 'America/Denver', hour: '2-digit', minute: '2-digit', timeZoneName: 'short'
    });
}

/* ══════════════════════════════════════════════════
   SCHEDULE
══════════════════════════════════════════════════ */
function loadSchedule() {
  if (!db) return;
  db.collection('jobs').onSnapshot(
    snap => {
      // Only today's jobs (Denver time) — the API treats this list as
      // "today's schedule" for truck capacity and next-job math, so
      // sending the full history poisons those answers.
      const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Denver' });
      todayJobs = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(j => j.date === today);
      renderStrip(todayJobs);
      console.log('[Co-Pilot] Jobs loaded for today:', todayJobs.length);
    },
    err => {
      console.error('[Co-Pilot] Jobs failed:', err.code, err.message);
      document.getElementById('jobs-strip').innerHTML =
        '<div class="no-jobs-msg">Jobs unavailable — check Firestore rules</div>';
    }
  );
}

function loadLeads() {
  if (!db) return;
  const onLeads = snap => {
    allLeads = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    console.log('[Co-Pilot] Leads loaded:', allLeads.length);
  };
  db.collection('leads').orderBy('createdAt', 'desc').limit(50).onSnapshot(
    onLeads,
    () => {
      db.collection('leads').limit(50).get()
        .then(onLeads)
        .catch(e => console.warn('[Co-Pilot] Leads unavailable:', e.code));
    }
  );
}

function renderStrip(jobs) {
  const el = document.getElementById('jobs-strip');
  if (!jobs.length) {
    el.innerHTML = '<div class="no-jobs-msg">No jobs scheduled today</div>';
    return;
  }
  el.innerHTML = jobs.map(j => {
    const s    = j.status || 'scheduled';
    const name = j.customerName || j.name || 'Unknown';
    const time = j.timeWindow || j.scheduledTime || '—';
    const meta = [j.cubicYards ? j.cubicYards + ' cu yd' : '', j.amount || j.quoteAmount || '']
                   .filter(Boolean).join(' · ');
    return `<div class="job-chip s-${s}">
      <div class="jc-name"><span class="status-dot"></span>${esc(name)}</div>
      <div class="jc-time">${esc(time)}</div>
      ${meta ? `<div class="jc-meta">${esc(meta)}</div>` : ''}
    </div>`;
  }).join('');
}

/* ══════════════════════════════════════════════════
   CHAT RENDERING
══════════════════════════════════════════════════ */
function esc(s) {
  return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function inputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!document.getElementById('send-btn').disabled) sendQuery();
  }
}

function renderResponse(text) {
  // Split on SEND THIS: blocks (greedy until blank line or SOP citation)
  const parts = text.split(/(SEND THIS:\n[\s\S]*?)(?=\n\n|\n\[SOP|$)/gi);
  let html = '';
  parts.forEach(part => {
    const trimmed = part.trim();
    if (!trimmed) return;
    if (/^SEND THIS:/i.test(trimmed)) {
      const script = trimmed.replace(/^SEND THIS:\s*/i, '').trim();
      const safeScript = script.replace(/"/g, '&quot;');
      html += `
        <div class="script-block">
          <div class="script-label">📱 Send This</div>${esc(script)}
        </div>
        <button class="copy-btn" onclick="copyScript(this)" data-text="${safeScript}">
          📋 Copy
        </button>`;
    } else {
      // Render [SOP X] as pills
      const withPills = trimmed
        .replace(/\[SOP ([^\]]+)\]/gi, '<span class="sop-pill">SOP $1</span>');
      html += `<span>${withPills}</span>`;
    }
  });
  return html;
}

function addUserMsg(text) {
  const chat = document.getElementById('chat-area');
  const d = document.createElement('div');
  d.className = 'msg user';
  d.innerHTML = `<div class="msg-bubble">${esc(text)}</div>`;
  chat.appendChild(d);
  scrollChat();
}

function addAssistantMsg(text) {
  const chat = document.getElementById('chat-area');
  const d = document.createElement('div');
  d.className = 'msg assistant';
  d.innerHTML = `<div class="msg-bubble">${renderResponse(text)}</div>`;
  chat.appendChild(d);
  scrollChat();
}

function addThinking() {
  const chat = document.getElementById('chat-area');
  const d = document.createElement('div');
  d.className = 'msg assistant'; d.id = 'thinking';
  d.innerHTML = `<div class="msg-bubble"><div class="dot-row">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div></div>`;
  chat.appendChild(d);
  scrollChat();
}

function removeThinking() { document.getElementById('thinking')?.remove(); }

function scrollChat() {
  const c = document.getElementById('chat-area');
  c.scrollTop = c.scrollHeight;
}

function copyScript(btn) {
  const text = btn.getAttribute('data-text');
  const finish = () => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 2500);
  };
  navigator.clipboard?.writeText(text).then(finish).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    finish();
  });
}

/* ══════════════════════════════════════════════════
   SEND QUERY
══════════════════════════════════════════════════ */
async function sendQuery() {
  const input = document.getElementById('query-input');
  const query = input.value.trim();
  if (!query) return;

  input.value = ''; input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;

  addUserMsg(query);
  addThinking();
  history.push({ role: 'user', content: query });

  try {
    const res = await fetch('/api/copilot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user:     me,
        query,
        schedule: todayJobs,
        leads:    allLeads,
        // Prior turns only — the API appends the current query itself
        history:  history.slice(0, -1).slice(-8),
      }),
    });

    const data = await res.json();
    removeThinking();

    if (!res.ok || data.error) {
      addAssistantMsg(`⚠️ ${data.error || 'Something went wrong — try again.'}`);
      history.pop();
      return;
    }

    addAssistantMsg(data.answer);
    history.push({ role: 'assistant', content: data.answer });
    if (history.length > 20) history = history.slice(-20);

  } catch (e) {
    removeThinking();
    addAssistantMsg('⚠️ Network error — check your connection and try again.');
    history.pop();
  }
}

/* ══════════════════════════════════════════════════
   VOICE INPUT
══════════════════════════════════════════════════ */
function toggleVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Voice input not supported. Use Chrome or Safari.'); return; }

  const btn = document.getElementById('voice-btn');

  if (recording) { recog?.stop(); return; }

  recog = new SR();
  recog.lang = 'en-US';
  recog.interimResults = false;

  recog.onstart = () => { recording = true;  btn.classList.add('recording');    btn.title = 'Tap to stop'; };
  recog.onend   = () => { recording = false; btn.classList.remove('recording'); btn.title = 'Voice input'; };
  recog.onerror = () => { recording = false; btn.classList.remove('recording'); btn.title = 'Voice input'; };

  recog.onresult = e => {
    const t = e.results[0][0].transcript;
    const input = document.getElementById('query-input');
    input.value = t;
    autoResize(input);
    document.getElementById('send-btn').disabled = false;
    setTimeout(sendQuery, 350);
  };

  recog.start();
}
